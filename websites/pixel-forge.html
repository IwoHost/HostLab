<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  /* THEME: Copper Circuit */
  --bg:#0b0805;--panel:#120d08;--border:#241a0f;--border2:#3a2a17;
  --text:#e8d4b8;--text2:#a8825a;--text3:#5a4530;
  --accent:#d4824a;--accent2:#ffb066;--accent3:#ffe0bc;
  --danger:#d45a4a;
  --mono:Share Tech Mono,monospace;
}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:12px;overflow:hidden;}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 4px);
  mix-blend-mode:overlay;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.85}94%{opacity:1}}

#app{display:grid;grid-template-rows:40px 1fr 32px;grid-template-columns:200px 1fr 210px;height:100vh;animation:fadeUp .4s ease;}

/* HEADER */
#header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border2);padding:0 16px;background:var(--panel);}
#logo{font-family:VT323,monospace;font-size:24px;letter-spacing:6px;color:var(--accent3);text-shadow:0 0 16px rgba(212,130,74,.5);animation:flicker 6s infinite;}
#logo span{color:var(--text2);}
#hinfo{display:flex;gap:18px;color:var(--text3);font-size:10px;letter-spacing:2px;}
#hinfo b{color:var(--accent2);}
.cursor-blk{display:inline-block;width:6px;height:12px;background:var(--accent2);vertical-align:middle;animation:blink 1s step-end infinite;margin-left:4px;}

/* LEFT PANEL - tools */
#left{border-right:1px solid var(--border2);background:var(--panel);overflow-y:auto;padding:10px;}
.section{border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:10px;}
.section:last-child{border-bottom:none;}
.label{font-size:9px;letter-spacing:3px;color:var(--text3);margin-bottom:8px;text-transform:uppercase;}

.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.tool-btn{background:#000;border:1px solid var(--border2);color:var(--text2);padding:8px 4px;text-align:center;cursor:pointer;font-size:10px;letter-spacing:1px;transition:transform .15s,border-color .15s,color .15s;user-select:none;}
.tool-btn:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--accent2);}
.tool-btn.active{background:var(--accent);color:#1a0f05;border-color:var(--accent2);font-weight:bold;}
.tool-btn .ic{display:block;font-size:15px;margin-bottom:3px;}

.size-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.size-row input[type=range]{flex:1;accent-color:var(--accent);height:2px;}
.size-row .val{width:20px;text-align:right;color:var(--accent2);font-size:10px;}

#swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:8px;}
.swatch{aspect-ratio:1;border:1px solid var(--border2);cursor:pointer;position:relative;}
.swatch.active{outline:2px solid var(--accent2);outline-offset:1px;}
.swatch.add-swatch{display:flex;align-items:center;justify-content:center;color:var(--text3);background:#000;font-size:14px;}

.color-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
#colorPick{width:34px;height:26px;border:1px solid var(--border2);background:#000;cursor:pointer;padding:0;}
#colorHex{flex:1;background:#000;border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:11px;padding:5px 6px;}

.grad-row{display:flex;gap:6px;align-items:center;}
#gradStart,#gradEnd{width:28px;height:24px;border:1px solid var(--border2);background:#000;padding:0;cursor:pointer;}
.grad-preview{flex:1;height:24px;border:1px solid var(--border2);}

button.wide{width:100%;background:#000;border:1px solid var(--border2);color:var(--text2);padding:7px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;transition:all .15s;margin-bottom:6px;}
button.wide:hover{border-color:var(--accent);color:var(--accent2);transform:translateY(-1px);}
button.wide.danger:hover{border-color:var(--danger);color:var(--danger);}
button.wide.primary{background:var(--accent);color:#1a0f05;border-color:var(--accent2);font-weight:bold;}
button.wide.primary:hover{color:#1a0f05;background:var(--accent2);}

/* CENTER canvas */
#center{position:relative;display:flex;align-items:center;justify-content:center;background:
  linear-gradient(45deg,#1a1310 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(-45deg,#1a1310 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(45deg,transparent 75%,#1a1310 75%) 0 0/16px 16px,
  linear-gradient(-45deg,transparent 75%,#1a1310 75%) 0 0/16px 16px,
  #0e0a07;
  overflow:hidden;
}
#canvasWrap{position:relative;box-shadow:0 0 0 1px var(--border2),0 0 40px rgba(0,0,0,.6);}
#gridCanvas,#drawCanvas{position:absolute;top:0;left:0;image-rendering:pixelated;}
#drawCanvas{cursor:crosshair;}
#zoomHud{position:absolute;bottom:12px;right:12px;background:rgba(10,7,4,.85);border:1px solid var(--border2);padding:5px 10px;font-size:10px;color:var(--text2);letter-spacing:1px;}
#zoomHud b{color:var(--accent2);}
.corner{position:absolute;width:16px;height:16px;border-color:var(--border2);opacity:.6;}
.corner.tl{top:8px;left:8px;border-top:1px solid;border-left:1px solid;}
.corner.tr{top:8px;right:8px;border-top:1px solid;border-right:1px solid;}
.corner.bl{bottom:8px;left:8px;border-bottom:1px solid;border-left:1px solid;}
.corner.br{bottom:8px;right:8px;border-bottom:1px solid;border-right:1px solid;}

/* RIGHT panel - layers */
#right{border-left:1px solid var(--border2);background:var(--panel);display:flex;flex-direction:column;padding:10px;overflow-y:auto;}
#layerList{display:flex;flex-direction:column-reverse;gap:4px;margin-bottom:8px;}
.layer{border:1px solid var(--border2);background:#000;padding:6px 8px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:border-color .15s;}
.layer:hover{border-color:var(--text2);}
.layer.active{border-color:var(--accent);background:rgba(212,130,74,.08);}
.layer .vis{cursor:pointer;width:16px;text-align:center;color:var(--text2);}
.layer .vis.off{opacity:.3;}
.layer .lname{flex:1;font-size:10px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.layer.active .lname{color:var(--accent2);}
.layer .thumb{width:20px;height:20px;border:1px solid var(--border2);image-rendering:pixelated;background:
  linear-gradient(45deg,#222 25%,transparent 25%) 0 0/6px 6px,
  linear-gradient(-45deg,#222 25%,transparent 25%) 0 0/6px 6px,#111;
}
.layer .del{cursor:pointer;color:var(--text3);font-size:11px;}
.layer .del:hover{color:var(--danger);}
.opacity-row{display:flex;align-items:center;gap:6px;margin-top:4px;}
.opacity-row input{flex:1;accent-color:var(--accent);height:2px;}
.layer-actions{display:flex;gap:6px;margin-bottom:10px;}
.layer-actions button{flex:1;}

/* FOOTER */
#footer{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border2);padding:0 16px;background:var(--panel);color:var(--text3);font-size:10px;letter-spacing:1px;}
#footer b{color:var(--accent2);}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:var(--border2);}

@media (max-width:768px){
  #app{grid-template-columns:1fr;grid-template-rows:40px auto 1fr auto 32px;height:auto;min-height:100vh;}
  #left{order:2;border-right:none;border-bottom:1px solid var(--border2);}
  #center{order:3;min-height:50vh;}
  #right{order:4;border-left:none;border-top:1px solid var(--border2);}
  #footer{order:5;}
}
</style>

<body>
<div id="app">
  <div id="header">
    <span id="logo">PIXEL<span>·</span>FORGE<span class="cursor-blk"></span></span>
    <div id="hinfo">
      <span>CANVAS <b id="canvasSizeLabel">64×64</b></span>
      <span>TOOL <b id="toolLabel">PENCIL</b></span>
    </div>
  </div>

  <div id="left">
    <div class="section">
      <div class="label">Tools</div>
      <div class="tool-grid">
        <div class="tool-btn active" data-tool="pencil"><span class="ic">✎</span>Pencil</div>
        <div class="tool-btn" data-tool="eraser"><span class="ic">▢</span>Eraser</div>
        <div class="tool-btn" data-tool="fill"><span class="ic">🪣</span>Fill</div>
        <div class="tool-btn" data-tool="gradient"><span class="ic">▨</span>Gradient</div>
        <div class="tool-btn" data-tool="picker"><span class="ic">✛</span>Picker</div>
        <div class="tool-btn" data-tool="line"><span class="ic">╱</span>Line</div>
      </div>
    </div>

    <div class="section">
      <div class="label">Brush Size</div>
      <div class="size-row">
        <input type="range" id="brushSize" min="1" max="6" value="1">
        <span class="val" id="brushVal">1</span>
      </div>
    </div>

    <div class="section">
      <div class="label">Color</div>
      <div class="color-row">
        <input type="color" id="colorPick" value="#d4824a">
        <input type="text" id="colorHex" value="#d4824a" maxlength="7">
      </div>
      <div id="swatches"></div>
    </div>

    <div class="section" id="gradientSection">
      <div class="label">Gradient</div>
      <div class="grad-row">
        <input type="color" id="gradStart" value="#d4824a">
        <div class="grad-preview" id="gradPreview"></div>
        <input type="color" id="gradEnd" value="#3a1a0a">
      </div>
    </div>

    <div class="section">
      <div class="label">Canvas</div>
      <button class="wide" id="btnUndo">↺ Undo</button>
      <button class="wide danger" id="btnClear">Clear Layer</button>
      <button class="wide danger" id="btnNew">New Canvas</button>
    </div>

    <div class="section">
      <div class="label">Export</div>
      <div class="size-row">
        <span style="color:var(--text3);font-size:9px;">SCALE</span>
        <input type="range" id="exportScale" min="1" max="16" value="8">
        <span class="val" id="exportScaleVal">8×</span>
      </div>
      <button class="wide primary" id="btnExport">⬇ Export PNG</button>
    </div>
  </div>

  <div id="center">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div id="canvasWrap">
      <canvas id="gridCanvas"></canvas>
      <canvas id="drawCanvas"></canvas>
    </div>
    <div id="zoomHud">ZOOM <b id="zoomVal">8×</b> · SCROLL TO ZOOM</div>
  </div>

  <div id="right">
    <div class="label">Layers</div>
    <div id="layerList"></div>
    <div class="layer-actions">
      <button class="wide" id="btnAddLayer" style="margin-bottom:0;">+ Layer</button>
      <button class="wide" id="btnDupLayer" style="margin-bottom:0;">⧉ Dup</button>
    </div>
    <div class="label" style="margin-top:6px;">Opacity</div>
    <div class="opacity-row">
      <input type="range" id="layerOpacity" min="0" max="100" value="100">
      <span class="val" id="layerOpacityVal">100%</span>
    </div>
  </div>

  <div id="footer">
    <span id="fl">HOSTLAB / PIXEL-FORGE</span>
    <span id="fc"><span id="pixelCoord">—,—</span></span>
    <span id="fr">© 2026</span>
  </div>
</div>

<script>
(function(){
  const N = 64; // grid size
  let zoom = 8;
  const MIN_ZOOM=2, MAX_ZOOM=24;

  const gridCanvas = document.getElementById('gridCanvas');
  const drawCanvas = document.getElementById('drawCanvas');
  const gctx = gridCanvas.getContext('2d');
  const dctx = drawCanvas.getContext('2d', {willReadFrequently:true});
  const wrap = document.getElementById('canvasWrap');

  let layers = [];
  let activeLayer = 0;
  let tool = 'pencil';
  let brushSize = 1;
  let color = '#d4824a';
  let history = [];

  function blankLayer(name){
    const c = document.createElement('canvas');
    c.width = N; c.height = N;
    return {name, canvas:c, ctx:c.getContext('2d',{willReadFrequently:true}), visible:true, opacity:1};
  }

  function newDoc(){
    layers = [blankLayer('Layer 1')];
    activeLayer = 0;
    history = [];
    renderLayerList();
    composite();
  }

  function resizeCanvases(){
    const px = N*zoom;
    [gridCanvas, drawCanvas].forEach(c=>{c.width=px;c.height=px;c.style.width=px+'px';c.style.height=px+'px';});
    wrap.style.width = px+'px'; wrap.style.height = px+'px';
    drawGrid();
    composite();
    document.getElementById('zoomVal').textContent = zoom+'×';
  }

  function drawGrid(){
    gctx.clearRect(0,0,gridCanvas.width,gridCanvas.height);
    if(zoom < 4) return;
    gctx.strokeStyle = 'rgba(212,130,74,0.10)';
    gctx.lineWidth = 1;
    for(let i=0;i<=N;i++){
      const p = i*zoom + .5;
      gctx.beginPath(); gctx.moveTo(p,0); gctx.lineTo(p,N*zoom); gctx.stroke();
      gctx.beginPath(); gctx.moveTo(0,p); gctx.lineTo(N*zoom,p); gctx.stroke();
    }
    // 8px major lines
    gctx.strokeStyle = 'rgba(212,130,74,0.22)';
    for(let i=0;i<=N;i+=8){
      const p = i*zoom + .5;
      gctx.beginPath(); gctx.moveTo(p,0); gctx.lineTo(p,N*zoom); gctx.stroke();
      gctx.beginPath(); gctx.moveTo(0,p); gctx.lineTo(N*zoom,p); gctx.stroke();
    }
  }

  function composite(){
    dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    dctx.imageSmoothingEnabled = false;
    layers.forEach(l=>{
      if(!l.visible) return;
      dctx.globalAlpha = l.opacity;
      dctx.drawImage(l.canvas, 0, 0, N, N, 0, 0, drawCanvas.width, drawCanvas.height);
    });
    dctx.globalAlpha = 1;
    renderLayerThumbs();
  }

  function pushHistory(){
    const l = layers[activeLayer];
    history.push({idx:activeLayer, data:l.ctx.getImageData(0,0,N,N)});
    if(history.length>50) history.shift();
  }

  function undo(){
    const h = history.pop();
    if(!h) return;
    layers[h.idx].ctx.putImageData(h.data,0,0);
    composite();
  }

  // ---- pixel ops on active layer (N x N space) ----
  function setPixel(x,y,rgba){
    if(x<0||y<0||x>=N||y>=N) return;
    const ctx = layers[activeLayer].ctx;
    ctx.clearRect(x,y,1,1);
    if(rgba){ ctx.fillStyle = rgba; ctx.fillRect(x,y,1,1); }
  }

  function getPixel(x,y,ctx){
    ctx = ctx || layers[activeLayer].ctx;
    if(x<0||y<0||x>=N||y>=N) return [0,0,0,0];
    const d = ctx.getImageData(x,y,1,1).data;
    return [d[0],d[1],d[2],d[3]];
  }

  function colorEq(a,b){ return a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]&&a[3]===b[3]; }

  function hexToRgba(hex, a=255){
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return [r,g,b,a];
  }

  function brushStamp(cx,cy,rgba){
    const r = Math.floor(brushSize/2);
    for(let dy=-r; dy<=r; dy++){
      for(let dx=-r; dx<=r; dx++){
        if(brushSize>2 && Math.hypot(dx,dy) > brushSize/2 + .2) continue;
        setPixel(cx+dx, cy+dy, rgba);
      }
    }
  }

  function floodFill(sx,sy,rgba){
    const ctx = layers[activeLayer].ctx;
    const img = ctx.getImageData(0,0,N,N);
    const data = img.data;
    const idx = (x,y)=>(y*N+x)*4;
    const target = [data[idx(sx,sy)],data[idx(sx,sy)+1],data[idx(sx,sy)+2],data[idx(sx,sy)+3]];
    const fill = hexToRgba(rgba,255);
    if(colorEq(target,fill)) return;
    const stack = [[sx,sy]];
    const visited = new Uint8Array(N*N);
    while(stack.length){
      const [x,y] = stack.pop();
      if(x<0||y<0||x>=N||y>=N) continue;
      const vi = y*N+x;
      if(visited[vi]) continue;
      const i = idx(x,y);
      const cur = [data[i],data[i+1],data[i+2],data[i+3]];
      if(!colorEq(cur,target)) continue;
      visited[vi]=1;
      data[i]=fill[0]; data[i+1]=fill[1]; data[i+2]=fill[2]; data[i+3]=fill[3];
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    ctx.putImageData(img,0,0);
  }

  function applyGradient(x0,y0,x1,y1){
    // gradient-fills the contiguous same-color region under the start point
    // (same connectivity rule as the bucket tool) so transparent areas
    // elsewhere on the layer are left untouched.
    const ctx = layers[activeLayer].ctx;
    const img = ctx.getImageData(0,0,N,N);
    const data = img.data;
    const idx = (x,y)=>(y*N+x)*4;
    const target = [data[idx(x0,y0)],data[idx(x0,y0)+1],data[idx(x0,y0)+2],data[idx(x0,y0)+3]];
    const c0 = hexToRgba(document.getElementById('gradStart').value);
    const c1 = hexToRgba(document.getElementById('gradEnd').value);
    const dx = x1-x0, dy = y1-y0;
    const len2 = dx*dx+dy*dy || 1;
    const stack = [[x0,y0]];
    const visited = new Uint8Array(N*N);
    while(stack.length){
      const [x,y] = stack.pop();
      if(x<0||y<0||x>=N||y>=N) continue;
      const vi = y*N+x;
      if(visited[vi]) continue;
      const i = idx(x,y);
      const cur = [data[i],data[i+1],data[i+2],data[i+3]];
      if(!colorEq(cur,target)) continue;
      visited[vi]=1;
      let t = ((x-x0)*dx + (y-y0)*dy) / len2;
      t = Math.max(0, Math.min(1, t));
      data[i] = Math.round(c0[0] + (c1[0]-c0[0])*t);
      data[i+1] = Math.round(c0[1] + (c1[1]-c0[1])*t);
      data[i+2] = Math.round(c0[2] + (c1[2]-c0[2])*t);
      data[i+3] = Math.round(c0[3] + (c1[3]-c0[3])*t);
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    ctx.putImageData(img,0,0);
  }

  function drawLine(x0,y0,x1,y1,rgba){
    const dx = Math.abs(x1-x0), sx = x0<x1?1:-1;
    const dy = -Math.abs(y1-y0), sy = y0<y1?1:-1;
    let err = dx+dy;
    while(true){
      brushStamp(x0,y0,rgba);
      if(x0===x1 && y0===y1) break;
      const e2 = 2*err;
      if(e2>=dy){ err+=dy; x0+=sx; }
      if(e2<=dx){ err+=dx; y0+=sy; }
    }
  }

  // ---- pointer handling ----
  let drawing = false;
  let gradStart = null;
  let lineStart = null;
  let lastPos = null;

  function toGrid(e){
    const rect = drawCanvas.getBoundingClientRect();
    const cx = (e.clientX ?? e.touches[0].clientX) - rect.left;
    const cy = (e.clientY ?? e.touches[0].clientY) - rect.top;
    const x = Math.floor(cx / zoom);
    const y = Math.floor(cy / zoom);
    return [x,y];
  }

  function pointerDown(e){
    e.preventDefault();
    const [x,y] = toGrid(e);
    document.getElementById('pixelCoord').textContent = x+','+y;
    if(x<0||y<0||x>=N||y>=N) return;
    drawing = true;
    pushHistory();
    if(tool==='pencil'){ brushStamp(x,y,color); composite(); }
    else if(tool==='eraser'){ brushStamp(x,y,null); composite(); }
    else if(tool==='fill'){ floodFill(x,y,color); composite(); }
    else if(tool==='picker'){
      const p = getPixel(x,y);
      if(p[3]>0){
        const hex = '#'+[p[0],p[1],p[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
        setColor(hex);
      }
      history.pop();
      drawing = false;
    }
    else if(tool==='gradient'){ gradStart = [x,y]; }
    else if(tool==='line'){ lineStart = [x,y]; }
    lastPos = [x,y];
  }

  function pointerMove(e){
    const [x,y] = toGrid(e);
    document.getElementById('pixelCoord').textContent = (x>=0&&x<N&&y>=0&&y<N) ? x+','+y : '—,—';
    if(!drawing) return;
    if(x<0||y<0||x>=N||y>=N) return;
    if(tool==='pencil' || tool==='eraser'){
      const rgba = tool==='eraser' ? null : color;
      if(lastPos) drawLine(lastPos[0],lastPos[1],x,y,rgba);
      else brushStamp(x,y,rgba);
      composite();
    }
    lastPos = [x,y];
  }

  function pointerUp(e){
    if(!drawing) return;
    if(tool==='gradient' && gradStart){
      const [x,y] = lastPos || gradStart;
      applyGradient(gradStart[0],gradStart[1],x,y);
      composite();
      gradStart = null;
    }
    else if(tool==='line' && lineStart){
      const [x,y] = lastPos || lineStart;
      drawLine(lineStart[0],lineStart[1],x,y,color);
      composite();
      lineStart = null;
    }
    drawing = false;
    lastPos = null;
  }

  drawCanvas.addEventListener('mousedown', pointerDown);
  drawCanvas.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  drawCanvas.addEventListener('touchstart', pointerDown, {passive:false});
  drawCanvas.addEventListener('touchmove', pointerMove, {passive:false});
  window.addEventListener('touchend', pointerUp);

  drawCanvas.parentElement.parentElement.addEventListener('wheel', (e)=>{
    e.preventDefault();
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom + (e.deltaY<0?1:-1)));
    resizeCanvases();
  }, {passive:false});

  // ---- tools UI ----
  document.querySelectorAll('.tool-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      tool = btn.dataset.tool;
      document.getElementById('toolLabel').textContent = tool.toUpperCase();
      drawCanvas.style.cursor = tool==='picker' ? 'copy' : 'crosshair';
    });
  });

  const brushSizeEl = document.getElementById('brushSize');
  brushSizeEl.addEventListener('input', ()=>{
    brushSize = +brushSizeEl.value;
    document.getElementById('brushVal').textContent = brushSize;
  });

  // ---- color ----
  const colorPick = document.getElementById('colorPick');
  const colorHex = document.getElementById('colorHex');
  const SWATCH_KEY = 'pixelforge_swatches';
  let swatches = JSON.parse(localStorage.getItem(SWATCH_KEY) || '["#d4824a","#ffb066","#3a1a0a","#e8d4b8","#1a0f05","#7ec87e"]');

  function setColor(hex){
    color = hex;
    colorPick.value = hex;
    colorHex.value = hex;
    document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active', s.dataset.hex===hex));
  }
  colorPick.addEventListener('input', ()=>setColor(colorPick.value));
  colorHex.addEventListener('change', ()=>{
    let v = colorHex.value.trim();
    if(!v.startsWith('#')) v = '#'+v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)) setColor(v);
  });

  function renderSwatches(){
    const box = document.getElementById('swatches');
    box.innerHTML = '';
    swatches.forEach(hex=>{
      const s = document.createElement('div');
      s.className = 'swatch'; s.dataset.hex = hex;
      s.style.background = hex;
      s.title = hex + ' (shift-click to remove)';
      s.addEventListener('click', (e)=>{
        if(e.shiftKey){
          swatches = swatches.filter(h=>h!==hex);
          localStorage.setItem(SWATCH_KEY, JSON.stringify(swatches));
          renderSwatches();
        } else setColor(hex);
      });
      box.appendChild(s);
    });
    const add = document.createElement('div');
    add.className = 'swatch add-swatch';
    add.textContent = '+';
    add.title = 'Save current color';
    add.addEventListener('click', ()=>{
      if(!swatches.includes(color)){
        swatches.push(color);
        localStorage.setItem(SWATCH_KEY, JSON.stringify(swatches));
        renderSwatches();
      }
    });
    box.appendChild(add);
  }
  renderSwatches();

  // gradient preview
  function updateGradPreview(){
    const s = document.getElementById('gradStart').value;
    const e = document.getElementById('gradEnd').value;
    document.getElementById('gradPreview').style.background = `linear-gradient(90deg, ${s}, ${e})`;
  }
  document.getElementById('gradStart').addEventListener('input', updateGradPreview);
  document.getElementById('gradEnd').addEventListener('input', updateGradPreview);
  updateGradPreview();

  // ---- layers UI ----
  function renderLayerList(){
    const list = document.getElementById('layerList');
    list.innerHTML = '';
    layers.forEach((l, i)=>{
      const row = document.createElement('div');
      row.className = 'layer' + (i===activeLayer ? ' active' : '');
      row.innerHTML = `
        <span class="vis ${l.visible?'':'off'}" data-i="${i}">${l.visible?'◉':'○'}</span>
        <canvas class="thumb" width="${N}" height="${N}"></canvas>
        <span class="lname">${l.name}</span>
        <span class="del" data-i="${i}">✕</span>
      `;
      row.addEventListener('click', (e)=>{
        if(e.target.classList.contains('vis') || e.target.classList.contains('del')) return;
        activeLayer = i;
        document.getElementById('layerOpacity').value = Math.round(layers[i].opacity*100);
        document.getElementById('layerOpacityVal').textContent = Math.round(layers[i].opacity*100)+'%';
        renderLayerList();
      });
      row.querySelector('.vis').addEventListener('click', (e)=>{
        e.stopPropagation();
        l.visible = !l.visible;
        renderLayerList(); composite();
      });
      row.querySelector('.del').addEventListener('click', (e)=>{
        e.stopPropagation();
        if(layers.length<=1) return;
        layers.splice(i,1);
        if(activeLayer>=layers.length) activeLayer = layers.length-1;
        renderLayerList(); composite();
      });
      list.appendChild(row);
    });
    renderLayerThumbs();
  }

  function renderLayerThumbs(){
    document.querySelectorAll('#layerList .layer').forEach((row,i)=>{
      const thumb = row.querySelector('.thumb');
      if(!thumb) return;
      const tctx = thumb.getContext('2d');
      tctx.clearRect(0,0,N,N);
      tctx.drawImage(layers[i].canvas,0,0);
    });
  }

  document.getElementById('btnAddLayer').addEventListener('click', ()=>{
    layers.push(blankLayer('Layer '+(layers.length+1)));
    activeLayer = layers.length-1;
    renderLayerList(); composite();
  });
  document.getElementById('btnDupLayer').addEventListener('click', ()=>{
    const src = layers[activeLayer];
    const dup = blankLayer(src.name+' copy');
    dup.ctx.drawImage(src.canvas,0,0);
    dup.opacity = src.opacity;
    layers.splice(activeLayer+1, 0, dup);
    activeLayer++;
    renderLayerList(); composite();
  });

  const opacitySlider = document.getElementById('layerOpacity');
  opacitySlider.addEventListener('input', ()=>{
    layers[activeLayer].opacity = +opacitySlider.value/100;
    document.getElementById('layerOpacityVal').textContent = opacitySlider.value+'%';
    composite();
  });

  // ---- canvas actions ----
  document.getElementById('btnUndo').addEventListener('click', undo);
  document.getElementById('btnClear').addEventListener('click', ()=>{
    pushHistory();
    layers[activeLayer].ctx.clearRect(0,0,N,N);
    composite();
  });
  document.getElementById('btnNew').addEventListener('click', ()=>{
    if(confirm('Start a new canvas? This clears all layers.')) newDoc();
  });

  window.addEventListener('keydown', (e)=>{
    if((e.ctrlKey||e.metaKey) && e.key==='z'){ e.preventDefault(); undo(); }
  });

  // ---- export ----
  const exportScale = document.getElementById('exportScale');
  exportScale.addEventListener('input', ()=>{
    document.getElementById('exportScaleVal').textContent = exportScale.value+'×';
  });

  document.getElementById('btnExport').addEventListener('click', ()=>{
    const scale = +exportScale.value;
    const out = document.createElement('canvas');
    out.width = N*scale; out.height = N*scale;
    const octx = out.getContext('2d');
    octx.imageSmoothingEnabled = false;
    layers.forEach(l=>{
      if(!l.visible) return;
      octx.globalAlpha = l.opacity;
      octx.drawImage(l.canvas, 0,0,N,N, 0,0, out.width, out.height);
    });
    octx.globalAlpha = 1;
    const a = document.createElement('a');
    a.download = 'pixel-forge-logo.png';
    a.href = out.toDataURL('image/png');
    a.click();
  });

  // init
  resizeCanvases();
  newDoc();
})();
</script>
</body>
</html>
