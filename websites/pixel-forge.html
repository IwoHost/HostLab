<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  /* THEME: Classic Paint — light, beveled, Windows-95-inspired */
  --desk:#3a6ea5;--face:#c0c0c0;--face-dark:#a8a8a8;
  --hi:#ffffff;--sh:#5a5a5a;--outer:#000000;
  --canvas-bg:#ffffff;
  --title1:#000a78;--title2:#1084d0;--title-text:#ffffff;
  --text:#000000;--text2:#333333;--text3:#6b6b6b;
  --accent:#000080;--accent2:#1084d0;
  --danger:#a00000;
  --mono:'DM Mono',monospace;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

html,body{height:100%;}
body{background:var(--desk);color:var(--text);font-family:var(--mono);font-size:12px;overflow:hidden;}

.bevel-out{border:1px solid var(--outer);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh);background:var(--face);}
.bevel-in{border:1px solid var(--outer);box-shadow:inset -1px -1px 0 var(--hi),inset 1px 1px 0 var(--sh);background:var(--face);}

#app{display:grid;
  grid-template-rows:30px 22px 1fr 46px 22px;
  grid-template-columns:64px 1fr 176px;
  height:100vh;gap:3px;padding:3px;background:var(--desk);
  animation:fadeUp .3s ease;
}

/* TITLE BAR */
#titlebar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(90deg,var(--title1),var(--title2));color:var(--title-text);
  padding:0 6px;border:1px solid #000;}
#titlebar .tleft{display:flex;align-items:center;gap:6px;}
#titlebar .ticon{width:14px;height:14px;background:var(--face);border:1px solid #000;display:inline-block;}
#titlebar .ttitle{font-size:12px;letter-spacing:.5px;font-weight:500;}
.cursor-blk{display:inline-block;width:5px;height:11px;background:#fff;vertical-align:middle;animation:blink 1s step-end infinite;margin-left:3px;}
#titlebar .tbtns{display:flex;gap:3px;}
#titlebar .tbtn{width:16px;height:14px;font-size:9px;line-height:14px;text-align:center;color:#000;cursor:default;}

/* MENU BAR */
#menubar{grid-column:1/-1;display:flex;align-items:stretch;background:var(--face);border:1px solid var(--sh);font-size:11px;}
.menu{position:relative;}
.menu > summary{list-style:none;padding:3px 10px;cursor:pointer;color:var(--text);user-select:none;}
.menu > summary::-webkit-details-marker{display:none;}
.menu[open] > summary,.menu > summary:hover{background:var(--accent);color:#fff;}
.menu-drop{position:absolute;top:100%;left:0;min-width:150px;z-index:50;padding:2px;}
.menu-drop button{display:block;width:100%;text-align:left;background:none;border:none;padding:5px 10px;font-family:var(--mono);font-size:11px;color:var(--text);cursor:pointer;}
.menu-drop button:hover{background:var(--accent);color:#fff;}

/* TOOLBOX (left) */
#toolbox{grid-row:3;background:var(--face);border:1px solid var(--sh);padding:4px;overflow-y:auto;}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:8px;}
.tool-btn{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;user-select:none;}
.tool-btn.active{box-shadow:inset -1px -1px 0 var(--hi),inset 1px 1px 0 var(--sh);}
.tb-label{font-size:8px;letter-spacing:1px;color:var(--text3);text-align:center;margin-bottom:3px;text-transform:uppercase;}
.size-row{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:4px 2px;}
.size-row input[type=range]{width:100%;accent-color:var(--accent);}
.size-row .val{text-align:center;color:var(--text2);font-size:10px;}

/* SUB TOOLBAR (icon strip under menu, spans canvas+layers cols) */
#subtoolbar{grid-row:2;grid-column:2/4;background:var(--face);border:1px solid var(--sh);display:flex;align-items:center;gap:4px;padding:0 4px;}
.tbar-btn{width:22px;height:18px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;}
.tbar-sep{width:1px;align-self:stretch;margin:3px 2px;box-shadow:inset 1px 0 0 var(--sh),inset -1px 0 0 var(--hi);}
#subtoolbar .scale-lbl{font-size:9px;color:var(--text3);letter-spacing:1px;margin-left:auto;}
#subtoolbar input[type=range]{width:70px;accent-color:var(--accent);}
#subtoolbar .val{font-size:10px;color:var(--text2);width:22px;}

/* CENTER canvas */
#center{grid-row:3;position:relative;display:flex;align-items:center;justify-content:center;
  background:var(--face-dark);overflow:auto;padding:16px;}
#canvasWrap{position:relative;box-shadow:0 0 0 1px #000,inset 0 0 0 1px var(--hi);
  background:
  linear-gradient(45deg,#ddd 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(-45deg,#ddd 25%,transparent 25%) 0 0/16px 16px,
  linear-gradient(45deg,transparent 75%,#ddd 75%) 0 0/16px 16px,
  linear-gradient(-45deg,transparent 75%,#ddd 75%) 0 0/16px 16px,
  var(--canvas-bg);
}
#gridCanvas,#drawCanvas{position:absolute;top:0;left:0;image-rendering:pixelated;}
#drawCanvas{cursor:crosshair;}

/* RIGHT dock: gradient + layers as mini sub-windows */
#right{grid-row:3;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
.dock{background:var(--face);border:1px solid var(--sh);display:flex;flex-direction:column;}
.dock-title{background:linear-gradient(90deg,var(--title1),var(--title2));color:#fff;font-size:10px;letter-spacing:1px;padding:3px 6px;text-transform:uppercase;}
.dock-body{padding:6px;}

.grad-row{display:flex;gap:6px;align-items:center;}
#gradStart,#gradEnd{width:26px;height:22px;border:1px solid var(--sh);padding:0;cursor:pointer;}
.grad-preview{flex:1;height:22px;border:1px solid var(--sh);}

#layerList{display:flex;flex-direction:column-reverse;gap:2px;margin-bottom:6px;max-height:180px;overflow-y:auto;}
.layer{background:#fff;padding:3px 5px;display:flex;align-items:center;gap:5px;cursor:pointer;box-shadow:inset -1px -1px 0 var(--hi),inset 1px 1px 0 var(--sh);}
.layer.active{background:#dce8fb;box-shadow:inset -1px -1px 0 var(--sh),inset 1px 1px 0 var(--hi);}
.layer .vis{cursor:pointer;width:14px;text-align:center;color:var(--text2);font-size:11px;}
.layer .vis.off{opacity:.3;}
.layer .lname{flex:1;font-size:10px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.layer .thumb{width:18px;height:18px;border:1px solid var(--sh);image-rendering:pixelated;background:
  linear-gradient(45deg,#bbb 25%,transparent 25%) 0 0/6px 6px,
  linear-gradient(-45deg,#bbb 25%,transparent 25%) 0 0/6px 6px,#eee;
}
.layer .del{cursor:pointer;color:var(--text3);font-size:11px;}
.layer .del:hover{color:var(--danger);}
.opacity-row{display:flex;align-items:center;gap:6px;margin-top:4px;}
.opacity-row input{flex:1;accent-color:var(--accent);}
.layer-actions{display:flex;gap:4px;margin-bottom:8px;}
.layer-actions button{flex:1;}

button.btn{background:var(--face);color:var(--text);padding:4px 6px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.5px;
  box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh);border:1px solid var(--outer);}
button.btn:active{box-shadow:inset -1px -1px 0 var(--hi),inset 1px 1px 0 var(--sh);}

/* BOTTOM: palette strip */
#palette{grid-row:4;grid-column:1/-1;background:var(--face);border:1px solid var(--sh);display:flex;align-items:center;gap:8px;padding:4px 8px;}
#curColor{position:relative;width:34px;height:30px;flex:0 0 auto;margin-right:2px;}
#curColor .back{position:absolute;width:20px;height:20px;bottom:0;right:0;box-shadow:inset -1px -1px 0 var(--hi),inset 1px 1px 0 var(--sh);background:#000;}
#curColor .front{position:absolute;width:20px;height:20px;top:0;left:0;box-shadow:inset -1px -1px 0 var(--hi),inset 1px 1px 0 var(--sh);cursor:pointer;
  border:none;padding:0;background:none;-webkit-appearance:none;appearance:none;}
#curColor .front::-webkit-color-swatch-wrapper{padding:0;}
#curColor .front::-webkit-color-swatch{border:none;}
#fixedPalette{display:grid;grid-template-columns:repeat(14,16px);grid-template-rows:repeat(2,15px);gap:1px;}
#fixedPalette .fp{width:16px;height:15px;cursor:pointer;box-shadow:inset -1px -1px 0 var(--sh),inset 1px 1px 0 var(--hi);}
#swatches{display:grid;grid-template-columns:repeat(auto-fill,16px);grid-template-rows:repeat(2,15px);gap:1px;margin-left:6px;grid-auto-flow:column;max-width:150px;overflow-x:auto;}
.swatch{width:16px;height:15px;box-shadow:inset -1px -1px 0 var(--sh),inset 1px 1px 0 var(--hi);cursor:pointer;}
.swatch.active{outline:2px solid var(--accent);outline-offset:-1px;}
.swatch.add-swatch{display:flex;align-items:center;justify-content:center;color:var(--text2);background:#fff;font-size:11px;}
#colorHex{width:70px;background:#fff;box-shadow:inset 1px 1px 0 var(--sh),inset -1px -1px 0 var(--hi);border:none;color:var(--text);font-family:var(--mono);font-size:10px;padding:4px 5px;margin-left:auto;}

/* STATUS BAR */
#footer{grid-row:5;grid-column:1/-1;display:flex;align-items:center;gap:3px;background:var(--face);border:1px solid var(--sh);padding:2px 4px;font-size:10px;color:var(--text2);}
#footer > span{flex:1;box-shadow:inset 1px 1px 0 var(--sh),inset -1px -1px 0 var(--hi);padding:2px 6px;}
#footer .fixed{flex:0 0 auto;}
#footer b{color:var(--text);}

::-webkit-scrollbar{width:14px;height:14px;}
::-webkit-scrollbar-track{background:var(--face);}
::-webkit-scrollbar-thumb{background:var(--face);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--sh);}

@media (max-width:768px){
  #app{grid-template-columns:56px 1fr;grid-template-rows:30px 22px auto 1fr auto 46px 22px;height:auto;min-height:100vh;}
  #subtoolbar{grid-column:1/-1;}
  #toolbox{grid-row:3;grid-column:1;}
  #center{grid-row:4;grid-column:1/-1;min-height:44vh;}
  #right{grid-row:5;grid-column:1/-1;flex-direction:row;flex-wrap:wrap;}
  #palette{grid-row:6;}
  #footer{grid-row:7;}
}
</style>
</head>

<script>
(function(){
  const N = 64; // grid size
  let zoom = 8;
  const MIN_ZOOM=2, MAX_ZOOM=24;

  const gridCanvas = document.getElementById('gridCanvas');
  const drawCanvas = document.getElementById('drawCanvas');
  const gctx = gridCanvas.getContext('2d');
  const dctx = drawCanvas.getContext('2d', {willReadFrequently:true});
  const wrap = document.getElementById('canvasWrap');

  let layers = [];
  let activeLayer = 0;
  let tool = 'pencil';
  let brushSize = 1;
  let color = '#000080';
  let history = [];

  function blankLayer(name){
    const c = document.createElement('canvas');
    c.width = N; c.height = N;
    return {name, canvas:c, ctx:c.getContext('2d',{willReadFrequently:true}), visible:true, opacity:1};
  }

  function newDoc(){
    layers = [blankLayer('Layer 1')];
    activeLayer = 0;
    history = [];
    renderLayerList();
    composite();
  }

  function resizeCanvases(){
    const px = N*zoom;
    [gridCanvas, drawCanvas].forEach(c=>{c.width=px;c.height=px;c.style.width=px+'px';c.style.height=px+'px';});
    wrap.style.width = px+'px'; wrap.style.height = px+'px';
    drawGrid();
    composite();
    document.getElementById('zoomVal').textContent = zoom+'×';
  }

  function drawGrid(){
    gctx.clearRect(0,0,gridCanvas.width,gridCanvas.height);
    if(zoom < 4) return;
    gctx.strokeStyle = 'rgba(212,130,74,0.10)';
    gctx.lineWidth = 1;
    for(let i=0;i<=N;i++){
      const p = i*zoom + .5;
      gctx.beginPath(); gctx.moveTo(p,0); gctx.lineTo(p,N*zoom); gctx.stroke();
      gctx.beginPath(); gctx.moveTo(0,p); gctx.lineTo(N*zoom,p); gctx.stroke();
    }
    // 8px major lines
    gctx.strokeStyle = 'rgba(212,130,74,0.22)';
    for(let i=0;i<=N;i+=8){
      const p = i*zoom + .5;
      gctx.beginPath(); gctx.moveTo(p,0); gctx.lineTo(p,N*zoom); gctx.stroke();
      gctx.beginPath(); gctx.moveTo(0,p); gctx.lineTo(N*zoom,p); gctx.stroke();
    }
  }

  function composite(){
    dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
    dctx.imageSmoothingEnabled = false;
    layers.forEach(l=>{
      if(!l.visible) return;
      dctx.globalAlpha = l.opacity;
      dctx.drawImage(l.canvas, 0, 0, N, N, 0, 0, drawCanvas.width, drawCanvas.height);
    });
    dctx.globalAlpha = 1;
    renderLayerThumbs();
  }

  function pushHistory(){
    const l = layers[activeLayer];
    history.push({idx:activeLayer, data:l.ctx.getImageData(0,0,N,N)});
    if(history.length>50) history.shift();
  }

  function undo(){
    const h = history.pop();
    if(!h) return;
    layers[h.idx].ctx.putImageData(h.data,0,0);
    composite();
  }

  // ---- pixel ops on active layer (N x N space) ----
  function setPixel(x,y,rgba){
    if(x<0||y<0||x>=N||y>=N) return;
    const ctx = layers[activeLayer].ctx;
    ctx.clearRect(x,y,1,1);
    if(rgba){ ctx.fillStyle = rgba; ctx.fillRect(x,y,1,1); }
  }

  function getPixel(x,y,ctx){
    ctx = ctx || layers[activeLayer].ctx;
    if(x<0||y<0||x>=N||y>=N) return [0,0,0,0];
    const d = ctx.getImageData(x,y,1,1).data;
    return [d[0],d[1],d[2],d[3]];
  }

  function colorEq(a,b){ return a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]&&a[3]===b[3]; }

  function hexToRgba(hex, a=255){
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    return [r,g,b,a];
  }

  function brushStamp(cx,cy,rgba){
    const r = Math.floor(brushSize/2);
    for(let dy=-r; dy<=r; dy++){
      for(let dx=-r; dx<=r; dx++){
        if(brushSize>2 && Math.hypot(dx,dy) > brushSize/2 + .2) continue;
        setPixel(cx+dx, cy+dy, rgba);
      }
    }
  }

  function floodFill(sx,sy,rgba){
    const ctx = layers[activeLayer].ctx;
    const img = ctx.getImageData(0,0,N,N);
    const data = img.data;
    const idx = (x,y)=>(y*N+x)*4;
    const target = [data[idx(sx,sy)],data[idx(sx,sy)+1],data[idx(sx,sy)+2],data[idx(sx,sy)+3]];
    const fill = hexToRgba(rgba,255);
    if(colorEq(target,fill)) return;
    const stack = [[sx,sy]];
    const visited = new Uint8Array(N*N);
    while(stack.length){
      const [x,y] = stack.pop();
      if(x<0||y<0||x>=N||y>=N) continue;
      const vi = y*N+x;
      if(visited[vi]) continue;
      const i = idx(x,y);
      const cur = [data[i],data[i+1],data[i+2],data[i+3]];
      if(!colorEq(cur,target)) continue;
      visited[vi]=1;
      data[i]=fill[0]; data[i+1]=fill[1]; data[i+2]=fill[2]; data[i+3]=fill[3];
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    ctx.putImageData(img,0,0);
  }

  function applyGradient(x0,y0,x1,y1){
    // gradient-fills the contiguous same-color region under the start point
    // (same connectivity rule as the bucket tool) so transparent areas
    // elsewhere on the layer are left untouched.
    const ctx = layers[activeLayer].ctx;
    const img = ctx.getImageData(0,0,N,N);
    const data = img.data;
    const idx = (x,y)=>(y*N+x)*4;
    const target = [data[idx(x0,y0)],data[idx(x0,y0)+1],data[idx(x0,y0)+2],data[idx(x0,y0)+3]];
    const c0 = hexToRgba(document.getElementById('gradStart').value);
    const c1 = hexToRgba(document.getElementById('gradEnd').value);
    const dx = x1-x0, dy = y1-y0;
    const len2 = dx*dx+dy*dy || 1;
    const stack = [[x0,y0]];
    const visited = new Uint8Array(N*N);
    while(stack.length){
      const [x,y] = stack.pop();
      if(x<0||y<0||x>=N||y>=N) continue;
      const vi = y*N+x;
      if(visited[vi]) continue;
      const i = idx(x,y);
      const cur = [data[i],data[i+1],data[i+2],data[i+3]];
      if(!colorEq(cur,target)) continue;
      visited[vi]=1;
      let t = ((x-x0)*dx + (y-y0)*dy) / len2;
      t = Math.max(0, Math.min(1, t));
      data[i] = Math.round(c0[0] + (c1[0]-c0[0])*t);
      data[i+1] = Math.round(c0[1] + (c1[1]-c0[1])*t);
      data[i+2] = Math.round(c0[2] + (c1[2]-c0[2])*t);
      data[i+3] = Math.round(c0[3] + (c1[3]-c0[3])*t);
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    ctx.putImageData(img,0,0);
  }

  function drawLine(x0,y0,x1,y1,rgba){
    const dx = Math.abs(x1-x0), sx = x0<x1?1:-1;
    const dy = -Math.abs(y1-y0), sy = y0<y1?1:-1;
    let err = dx+dy;
    while(true){
      brushStamp(x0,y0,rgba);
      if(x0===x1 && y0===y1) break;
      const e2 = 2*err;
      if(e2>=dy){ err+=dy; x0+=sx; }
      if(e2<=dx){ err+=dx; y0+=sy; }
    }
  }

  // ---- pointer handling ----
  let drawing = false;
  let gradStart = null;
  let lineStart = null;
  let lastPos = null;

  function toGrid(e){
    const rect = drawCanvas.getBoundingClientRect();
    const cx = (e.clientX ?? e.touches[0].clientX) - rect.left;
    const cy = (e.clientY ?? e.touches[0].clientY) - rect.top;
    const x = Math.floor(cx / zoom);
    const y = Math.floor(cy / zoom);
    return [x,y];
  }

  function pointerDown(e){
    e.preventDefault();
    const [x,y] = toGrid(e);
    document.getElementById('pixelCoord').textContent = x+','+y;
    if(x<0||y<0||x>=N||y>=N) return;
    drawing = true;
    pushHistory();
    if(tool==='pencil'){ brushStamp(x,y,color); composite(); }
    else if(tool==='eraser'){ brushStamp(x,y,null); composite(); }
    else if(tool==='fill'){ floodFill(x,y,color); composite(); }
    else if(tool==='picker'){
      const p = getPixel(x,y);
      if(p[3]>0){
        const hex = '#'+[p[0],p[1],p[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
        setColor(hex);
      }
      history.pop();
      drawing = false;
    }
    else if(tool==='gradient'){ gradStart = [x,y]; }
    else if(tool==='line'){ lineStart = [x,y]; }
    lastPos = [x,y];
  }

  function pointerMove(e){
    const [x,y] = toGrid(e);
    document.getElementById('pixelCoord').textContent = (x>=0&&x<N&&y>=0&&y<N) ? x+','+y : '—,—';
    if(!drawing) return;
    if(x<0||y<0||x>=N||y>=N) return;
    if(tool==='pencil' || tool==='eraser'){
      const rgba = tool==='eraser' ? null : color;
      if(lastPos) drawLine(lastPos[0],lastPos[1],x,y,rgba);
      else brushStamp(x,y,rgba);
      composite();
    }
    lastPos = [x,y];
  }

  function pointerUp(e){
    if(!drawing) return;
    if(tool==='gradient' && gradStart){
      const [x,y] = lastPos || gradStart;
      applyGradient(gradStart[0],gradStart[1],x,y);
      composite();
      gradStart = null;
    }
    else if(tool==='line' && lineStart){
      const [x,y] = lastPos || lineStart;
      drawLine(lineStart[0],lineStart[1],x,y,color);
      composite();
      lineStart = null;
    }
    drawing = false;
    lastPos = null;
  }

  drawCanvas.addEventListener('mousedown', pointerDown);
  drawCanvas.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);
  drawCanvas.addEventListener('touchstart', pointerDown, {passive:false});
  drawCanvas.addEventListener('touchmove', pointerMove, {passive:false});
  window.addEventListener('touchend', pointerUp);

  drawCanvas.parentElement.parentElement.addEventListener('wheel', (e)=>{
    e.preventDefault();
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom + (e.deltaY<0?1:-1)));
    resizeCanvases();
  }, {passive:false});

  function zoomBy(delta){
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom + delta));
    resizeCanvases();
  }
  document.getElementById('btnZoomIn').addEventListener('click', ()=>zoomBy(1));
  document.getElementById('btnZoomOut').addEventListener('click', ()=>zoomBy(-1));

  // ---- menu bar (delegates to the real toolbar buttons/actions) ----
  function closeMenus(){ document.querySelectorAll('.menu[open]').forEach(m=>m.removeAttribute('open')); }
  document.getElementById('mNew').addEventListener('click', ()=>{ closeMenus(); document.getElementById('btnNew').click(); });
  document.getElementById('mExport').addEventListener('click', ()=>{ closeMenus(); document.getElementById('btnExport').click(); });
  document.getElementById('mUndo').addEventListener('click', ()=>{ closeMenus(); document.getElementById('btnUndo').click(); });
  document.getElementById('mClear').addEventListener('click', ()=>{ closeMenus(); document.getElementById('btnClear').click(); });
  document.getElementById('mZoomIn').addEventListener('click', ()=>{ closeMenus(); zoomBy(1); });
  document.getElementById('mZoomOut').addEventListener('click', ()=>{ closeMenus(); zoomBy(-1); });
  document.getElementById('mAbout').addEventListener('click', ()=>{
    closeMenus();
    alert('Pixel Forge\n\nA tiny pixel-art editor for logos and favicons.\n64×64 transparent canvas · layers · gradients · PNG export.');
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.menu')) closeMenus();
  });

  // ---- tools UI ----
  document.querySelectorAll('.tool-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      tool = btn.dataset.tool;
      document.getElementById('toolLabel').textContent = tool.toUpperCase();
      drawCanvas.style.cursor = tool==='picker' ? 'copy' : 'crosshair';
    });
  });

  const brushSizeEl = document.getElementById('brushSize');
  brushSizeEl.addEventListener('input', ()=>{
    brushSize = +brushSizeEl.value;
    document.getElementById('brushVal').textContent = brushSize+'px';
  });

  // ---- color ----
  const colorPick = document.getElementById('colorPick');
  const colorHex = document.getElementById('colorHex');
  const SWATCH_KEY = 'pixelforge_swatches';
  let swatches = JSON.parse(localStorage.getItem(SWATCH_KEY) || '["#d4824a","#ffb066","#7ec87e","#e8d4b8"]');

  const FIXED_PALETTE = [
    '#000000','#808080','#800000','#808000','#008000','#008080','#000080','#800080','#808040','#004040','#0080ff','#004080','#4000ff','#8000ff',
    '#ffffff','#c0c0c0','#ff0000','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff','#ffff80','#00ff80','#80ffff','#8080ff','#ff0080','#ff8040'
  ];
  (function renderFixedPalette(){
    const box = document.getElementById('fixedPalette');
    FIXED_PALETTE.forEach(hex=>{
      const s = document.createElement('div');
      s.className = 'fp'; s.style.background = hex; s.title = hex;
      s.addEventListener('click', ()=>setColor(hex));
      box.appendChild(s);
    });
  })();

  function setColor(hex){
    color = hex;
    colorPick.value = hex;
    colorHex.value = hex;
    document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('active', s.dataset.hex===hex));
  }
  colorPick.addEventListener('input', ()=>setColor(colorPick.value));
  colorHex.addEventListener('change', ()=>{
    let v = colorHex.value.trim();
    if(!v.startsWith('#')) v = '#'+v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)) setColor(v);
  });

  function renderSwatches(){
    const box = document.getElementById('swatches');
    box.innerHTML = '';
    swatches.forEach(hex=>{
      const s = document.createElement('div');
      s.className = 'swatch'; s.dataset.hex = hex;
      s.style.background = hex;
      s.title = hex + ' (shift-click to remove)';
      s.addEventListener('click', (e)=>{
        if(e.shiftKey){
          swatches = swatches.filter(h=>h!==hex);
          localStorage.setItem(SWATCH_KEY, JSON.stringify(swatches));
          renderSwatches();
        } else setColor(hex);
      });
      box.appendChild(s);
    });
    const add = document.createElement('div');
    add.className = 'swatch add-swatch';
    add.textContent = '+';
    add.title = 'Save current color';
    add.addEventListener('click', ()=>{
      if(!swatches.includes(color)){
        swatches.push(color);
        localStorage.setItem(SWATCH_KEY, JSON.stringify(swatches));
        renderSwatches();
      }
    });
    box.appendChild(add);
  }
  renderSwatches();

  // gradient preview
  function updateGradPreview(){
    const s = document.getElementById('gradStart').value;
    const e = document.getElementById('gradEnd').value;
    document.getElementById('gradPreview').style.background = `linear-gradient(90deg, ${s}, ${e})`;
  }
  document.getElementById('gradStart').addEventListener('input', updateGradPreview);
  document.getElementById('gradEnd').addEventListener('input', updateGradPreview);
  updateGradPreview();

  // ---- layers UI ----
  function renderLayerList(){
    const list = document.getElementById('layerList');
    list.innerHTML = '';
    layers.forEach((l, i)=>{
      const row = document.createElement('div');
      row.className = 'layer' + (i===activeLayer ? ' active' : '');
      row.innerHTML = `
        <span class="vis ${l.visible?'':'off'}" data-i="${i}">${l.visible?'◉':'○'}</span>
        <canvas class="thumb" width="${N}" height="${N}"></canvas>
        <span class="lname">${l.name}</span>
        <span class="del" data-i="${i}">✕</span>
      `;
      row.addEventListener('click', (e)=>{
        if(e.target.classList.contains('vis') || e.target.classList.contains('del')) return;
        activeLayer = i;
        document.getElementById('layerOpacity').value = Math.round(layers[i].opacity*100);
        document.getElementById('layerOpacityVal').textContent = Math.round(layers[i].opacity*100)+'%';
        renderLayerList();
      });
      row.querySelector('.vis').addEventListener('click', (e)=>{
        e.stopPropagation();
        l.visible = !l.visible;
        renderLayerList(); composite();
      });
      row.querySelector('.del').addEventListener('click', (e)=>{
        e.stopPropagation();
        if(layers.length<=1) return;
        layers.splice(i,1);
        if(activeLayer>=layers.length) activeLayer = layers.length-1;
        renderLayerList(); composite();
      });
      list.appendChild(row);
    });
    renderLayerThumbs();
  }

  function renderLayerThumbs(){
    document.querySelectorAll('#layerList .layer').forEach((row,i)=>{
      const thumb = row.querySelector('.thumb');
      if(!thumb) return;
      const tctx = thumb.getContext('2d');
      tctx.clearRect(0,0,N,N);
      tctx.drawImage(layers[i].canvas,0,0);
    });
  }

  document.getElementById('btnAddLayer').addEventListener('click', ()=>{
    layers.push(blankLayer('Layer '+(layers.length+1)));
    activeLayer = layers.length-1;
    renderLayerList(); composite();
  });
  document.getElementById('btnDupLayer').addEventListener('click', ()=>{
    const src = layers[activeLayer];
    const dup = blankLayer(src.name+' copy');
    dup.ctx.drawImage(src.canvas,0,0);
    dup.opacity = src.opacity;
    layers.splice(activeLayer+1, 0, dup);
    activeLayer++;
    renderLayerList(); composite();
  });

  const opacitySlider = document.getElementById('layerOpacity');
  opacitySlider.addEventListener('input', ()=>{
    layers[activeLayer].opacity = +opacitySlider.value/100;
    document.getElementById('layerOpacityVal').textContent = opacitySlider.value+'%';
    composite();
  });

  // ---- canvas actions ----
  document.getElementById('btnUndo').addEventListener('click', undo);
  document.getElementById('btnClear').addEventListener('click', ()=>{
    pushHistory();
    layers[activeLayer].ctx.clearRect(0,0,N,N);
    composite();
  });
  document.getElementById('btnNew').addEventListener('click', ()=>{
    if(confirm('Start a new canvas? This clears all layers.')) newDoc();
  });

  window.addEventListener('keydown', (e)=>{
    if((e.ctrlKey||e.metaKey) && e.key==='z'){ e.preventDefault(); undo(); }
  });

  // ---- export ----
  const exportScale = document.getElementById('exportScale');
  exportScale.addEventListener('input', ()=>{
    document.getElementById('exportScaleVal').textContent = exportScale.value+'×';
  });

  document.getElementById('btnExport').addEventListener('click', ()=>{
    const scale = +exportScale.value;
    const out = document.createElement('canvas');
    out.width = N*scale; out.height = N*scale;
    const octx = out.getContext('2d');
    octx.imageSmoothingEnabled = false;
    layers.forEach(l=>{
      if(!l.visible) return;
      octx.globalAlpha = l.opacity;
      octx.drawImage(l.canvas, 0,0,N,N, 0,0, out.width, out.height);
    });
    octx.globalAlpha = 1;
    const a = document.createElement('a');
    a.download = 'pixel-forge-logo.png';
    a.href = out.toDataURL('image/png');
    a.click();
  });

  // init
  resizeCanvases();
  newDoc();
})();
</script>
</body>
</html>
