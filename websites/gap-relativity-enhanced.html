<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gap Relativity</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="./other/logo/GapViz.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#080608;font-family:'DM Mono',monospace;}

/* ── INPUT SCREEN ── */
#inputScreen{
  position:fixed;inset:0;
  background:radial-gradient(ellipse at 50% 60%,#120a1a 0%,#070508 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:20;transition:opacity .9s,transform .9s;
  padding:24px;overflow-y:auto;
}
#inputScreen.hide{opacity:0;transform:scale(1.05);pointer-events:none;}

.logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(44px,10vw,80px);
  letter-spacing:8px;color:#e8d0ff;
  line-height:1;text-align:center;margin-bottom:4px;
}
.logo-sub{
  font-size:10px;letter-spacing:6px;color:rgba(232,208,255,.25);
  text-align:center;margin-bottom:36px;text-transform:uppercase;
}

.input-card{
  background:rgba(255,255,255,.03);border:1px solid rgba(232,208,255,.1);
  border-radius:8px;padding:28px;width:min(520px,95vw);
  display:flex;flex-direction:column;gap:18px;
}

.input-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:120px;}
.field label{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.3);text-transform:uppercase;}

input[type="text"]{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:#fff;font-family:'DM Mono',monospace;font-size:13px;
  padding:10px 14px;outline:none;border-radius:4px;transition:border-color .2s;width:100%;
}
input[type="text"]::placeholder{color:rgba(255,255,255,.2);}
input[type="text"]:focus{border-color:rgba(232,208,255,.5);}
input[type="text"].ok{border-color:rgba(120,220,140,.5);}
input[type="text"].error{border-color:rgba(220,100,100,.5);}

.alive-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.toggle-wrap{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;flex-shrink:0;}
.toggle-wrap input{display:none;}
.toggle-box{width:36px;height:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;position:relative;transition:background .2s;}
.toggle-box::after{content:'';width:14px;height:14px;background:rgba(255,255,255,.4);border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .2s,background .2s;}
input:checked~.toggle-box{background:rgba(160,120,220,.4);border-color:rgba(200,160,255,.4);}
input:checked~.toggle-box::after{transform:translateX(16px);background:#e8d0ff;}
.toggle-label{font-size:11px;color:rgba(255,255,255,.3);}

.death-wrap{transition:opacity .2s;overflow:hidden;flex:1;}
.death-wrap.hidden{opacity:0;pointer-events:none;max-height:0;}
.death-wrap.visible{opacity:1;max-height:80px;}

.add-btn{
  background:rgba(200,160,255,.15);border:1px solid rgba(200,160,255,.3);
  color:#e8d0ff;font-family:'DM Mono',monospace;font-size:12px;
  letter-spacing:3px;text-transform:uppercase;
  padding:11px 20px;cursor:pointer;border-radius:4px;
  transition:background .2s;white-space:nowrap;flex-shrink:0;
}
.add-btn:hover{background:rgba(200,160,255,.28);}

.people-chips{
  display:flex;flex-wrap:wrap;gap:8px;min-height:30px;
  padding-top:4px;border-top:1px solid rgba(255,255,255,.06);
}
.chip{
  display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  padding:5px 10px 5px 12px;border-radius:20px;font-size:11px;color:rgba(255,255,255,.7);
}
.chip .cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.chip .cx{cursor:pointer;background:none;border:none;color:rgba(255,255,255,.3);font-size:14px;line-height:1;font-family:inherit;padding:0 2px;}
.chip .cx:hover{color:#e87070;}
.chip-you{border-color:rgba(200,160,255,.3);}

.start-btn{
  background:linear-gradient(135deg,rgba(200,160,255,.2),rgba(160,120,230,.3));
  border:1px solid rgba(200,160,255,.4);color:#e8d0ff;
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:6px;
  padding:16px 48px;cursor:pointer;border-radius:6px;
  transition:background .2s,transform .15s,box-shadow .2s;
  align-self:center;box-shadow:0 0 0 rgba(200,160,255,0);
}
.start-btn:hover:not(:disabled){background:linear-gradient(135deg,rgba(200,160,255,.3),rgba(160,120,230,.45));box-shadow:0 0 40px rgba(200,160,255,.2);transform:scale(1.02);}
.start-btn:disabled{opacity:.3;cursor:default;}
.hint{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.18);text-align:center;}

/* ── STAGE ── */
#stage{position:fixed;inset:0;display:none;}
#stage.active{display:block;}

.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;overflow:hidden;}
.slide.current{opacity:1;pointer-events:all;}
.sEnter{animation:sIn .65s cubic-bezier(.16,1,.3,1) forwards;}
.sExit{animation:sOut .4s cubic-bezier(.4,0,1,1) forwards;}
.sEnterBack{animation:sInB .65s cubic-bezier(.16,1,.3,1) forwards;}
.sExitBack{animation:sOutB .4s cubic-bezier(.4,0,1,1) forwards;}
@keyframes sIn{from{opacity:0;transform:translateY(60px);}to{opacity:1;transform:translateY(0);}}
@keyframes sOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-50px);}}
@keyframes sInB{from{opacity:0;transform:translateY(-60px);}to{opacity:1;transform:translateY(0);}}
@keyframes sOutB{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(50px);}}

/* ── DOTS ── */
#dots{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:999;max-width:90vw;flex-wrap:wrap;justify-content:center;}
.dot{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.15);transition:background .4s,width .4s;}
.dot.done{background:rgba(255,255,255,.5);}
.dot.active{background:#e8d0ff;width:32px;}

#navHint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:9px;color:rgba(255,255,255,.18);letter-spacing:3px;z-index:999;pointer-events:none;white-space:nowrap;}
#tapLeft,#tapRight{position:fixed;top:0;bottom:0;width:45%;z-index:998;cursor:pointer;}
#tapLeft{left:0;}#tapRight{right:0;}

#pCanvas{position:fixed;inset:0;pointer-events:none;z-index:997;}

#restartBtn{display:none;position:fixed;bottom:24px;right:28px;z-index:999;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.4);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;padding:8px 16px;cursor:pointer;border-radius:4px;transition:background .2s;}
#restartBtn:hover{background:rgba(255,255,255,.12);}

/* ── SLIDE COMPONENTS ── */
.s-eyebrow{font-size:clamp(9px,1.5vw,11px);letter-spacing:6px;color:rgba(255,255,255,.3);text-align:center;margin-bottom:16px;text-transform:uppercase;}
.s-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(54px,11vw,130px);letter-spacing:4px;line-height:.9;text-align:center;opacity:0;transform:scale(.7) translateY(20px);transition:opacity .8s,transform .9s cubic-bezier(.16,1,.3,1);}
.s-name.in{opacity:1;transform:scale(1) translateY(0);}
.s-big{font-family:'Bebas Neue',sans-serif;font-size:clamp(90px,18vw,220px);line-height:.85;text-align:center;opacity:0;transform:scale(.6);transition:opacity .6s,transform 1.1s cubic-bezier(.16,1,.3,1);}
.s-big.in{opacity:1;transform:scale(1);}
.s-label{font-size:clamp(11px,2vw,15px);letter-spacing:5px;color:rgba(255,255,255,.35);text-align:center;margin-top:20px;}
.s-sub{font-size:clamp(12px,1.8vw,15px);letter-spacing:3px;color:rgba(255,255,255,.4);text-align:center;margin-top:12px;line-height:1.8;}
.reveal-line{overflow:hidden;}
.reveal-line span{display:block;transform:translateY(110%);transition:transform .9s cubic-bezier(.16,1,.3,1);}
.reveal-line.in span{transform:translateY(0);}

.intro-ring{position:absolute;border-radius:50%;border:1px solid rgba(232,208,255,.07);left:50%;top:50%;animation:pring 4s ease-in-out infinite;}
@keyframes pring{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.5;}50%{transform:translate(-50%,-50%) scale(1.07);opacity:.15;}}
.intro-ghost{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-family:'Bebas Neue',sans-serif;font-size:clamp(80px,18vw,200px);color:rgba(232,208,255,.04);letter-spacing:4px;white-space:nowrap;pointer-events:none;}

.gap-context{font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(15px,2.5vw,22px);color:rgba(255,255,255,.45);text-align:center;margin-top:20px;line-height:1.7;max-width:580px;padding:0 20px;opacity:0;transition:opacity .8s .4s;}
.gap-context.in{opacity:1;}

.ring-wrap{position:relative;width:180px;height:180px;margin:16px auto 0;}
.ring-svg{transform:rotate(-90deg);}
.ring-bg-circle{fill:none;stroke:rgba(255,255,255,.07);}
.ring-fill-circle{fill:none;stroke-linecap:round;stroke-dasharray:452;stroke-dashoffset:452;transition:stroke-dashoffset 1.8s cubic-bezier(.16,1,.3,1) .4s;}
.ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-num{font-family:'Bebas Neue',sans-serif;font-size:clamp(46px,8vw,72px);line-height:1;}
.ring-unit{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,.3);margin-top:2px;}

.mini-events{margin-top:20px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:580px;padding:0 20px;}
.mini-evt{font-size:9px;letter-spacing:1.5px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.35);}

.sum-card{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:28px;background:rgba(255,255,255,.03);width:min(460px,90vw);display:flex;flex-direction:column;gap:0;}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.sum-row:last-child{border-bottom:none;}
.sum-key{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,.3);text-transform:uppercase;}
.sum-name{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.22);margin-top:3px;}
.sum-val{font-family:'Bebas Neue',sans-serif;font-size:clamp(22px,4vw,36px);letter-spacing:2px;}
.sum-note{font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.2);margin-top:2px;text-align:right;}

/* ── LIFE DETAIL SLIDE ── */
.life-detail-wrap{
  display:flex;flex-direction:column;align-items:center;
  width:min(600px,95vw);gap:0;
}
.life-stat-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  border-radius:10px;overflow:hidden;width:100%;margin-top:20px;
}
.life-stat{
  background:#0a0808;padding:18px 20px;
  opacity:0;transform:translateY(12px);
  transition:opacity .5s,transform .5s;
}
.life-stat.in{opacity:1;transform:translateY(0);}
.life-stat-key{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.28);text-transform:uppercase;margin-bottom:6px;}
.life-stat-val{font-family:'Bebas Neue',sans-serif;font-size:clamp(22px,4vw,36px);letter-spacing:2px;line-height:1;}
.life-stat-note{font-size:9px;color:rgba(255,255,255,.25);margin-top:4px;letter-spacing:1px;}

/* ── LIFE DECADE BAR ── */
.decade-bar-wrap{
  width:100%;margin-top:22px;
  opacity:0;transition:opacity .6s .3s;
}
.decade-bar-wrap.in{opacity:1;}
.decade-bar-label{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.25);margin-bottom:8px;text-transform:uppercase;}
.decade-bar{display:flex;height:24px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.04);position:relative;}
.decade-seg{height:100%;transition:width 1.4s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden;}
.decade-seg::after{content:attr(data-year);position:absolute;top:50%;left:6px;transform:translateY(-50%);font-size:8px;letter-spacing:1px;color:rgba(255,255,255,.5);white-space:nowrap;}
.decade-tick-row{display:flex;margin-top:4px;}
.decade-tick{flex:1;font-size:7px;letter-spacing:1px;color:rgba(255,255,255,.2);text-align:left;}

/* ── TIMELINE SLIDE ── */
.tl-wrap{
  width:min(700px,96vw);max-height:85vh;overflow-y:auto;
  padding:0 8px 20px;
}
.tl-wrap::-webkit-scrollbar{width:3px;}
.tl-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px;}
.tl-axis{position:relative;margin-top:28px;}
.tl-ruler{
  position:relative;height:2px;background:rgba(255,255,255,.08);
  margin:0 40px;border-radius:1px;
}
.tl-ruler-tick{
  position:absolute;top:-16px;transform:translateX(-50%);
  font-size:8px;letter-spacing:1px;color:rgba(255,255,255,.25);
}
.tl-ruler-tick::after{content:'';position:absolute;top:22px;left:50%;width:1px;height:8px;background:rgba(255,255,255,.12);}
.tl-person-row{
  display:flex;align-items:center;margin:10px 0;position:relative;
  opacity:0;transform:translateX(-16px);
  transition:opacity .5s,transform .5s;
}
.tl-person-row.in{opacity:1;transform:translateX(0);}
.tl-person-label{
  width:36px;flex-shrink:0;font-size:9px;letter-spacing:1px;
  color:rgba(255,255,255,.3);text-align:right;padding-right:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tl-bar-track{flex:1;height:28px;position:relative;border-radius:3px;background:rgba(255,255,255,.03);}
.tl-bar{
  position:absolute;top:4px;height:20px;border-radius:3px;
  display:flex;align-items:center;overflow:hidden;
  transition:width 1.2s cubic-bezier(.16,1,.3,1),left 1.2s cubic-bezier(.16,1,.3,1);
}
.tl-bar-inner{position:absolute;inset:0;}
.tl-bar-name{
  position:absolute;left:8px;font-size:9px;letter-spacing:1.5px;
  color:rgba(255,255,255,.75);white-space:nowrap;pointer-events:none;
  text-shadow:0 1px 4px rgba(0,0,0,.5);
}
.tl-bar-years{
  position:absolute;right:6px;font-size:8px;letter-spacing:1px;
  color:rgba(255,255,255,.45);white-space:nowrap;pointer-events:none;
}
.tl-overlap-band{
  position:absolute;top:0;height:100%;border-radius:2px;
  opacity:0;transition:opacity .6s 1.8s;
  pointer-events:none;
}
.tl-overlap-band.in{opacity:1;}
.tl-you-line{
  position:absolute;top:-6px;bottom:-6px;width:2px;background:#e8d0ff;
  border-radius:1px;opacity:0;transition:opacity .5s 2s;
  pointer-events:none;
}
.tl-you-line.in{opacity:.6;}
.tl-you-line-label{
  position:absolute;top:-22px;left:50%;transform:translateX(-50%);
  font-size:8px;letter-spacing:2px;color:rgba(232,208,255,.5);
  white-space:nowrap;
}
.tl-era-band{
  position:absolute;top:0;bottom:0;opacity:.04;pointer-events:none;
}
.tl-era-label{
  position:absolute;bottom:-18px;font-size:7px;letter-spacing:2px;
  color:rgba(255,255,255,.2);transform:translateX(-50%);
}
</style>
</head>
<body>

<div id="inputScreen">
  <div class="logo">GAP RELATIVITY</div>
  <div class="logo-sub">How long did the world exist without you</div>

  <div class="input-card">
    <div class="input-row">
      <div class="field" style="flex:2;">
        <label>Name</label>
        <input type="text" id="nameInput" placeholder="e.g. Grandma Rose" />
      </div>
      <div class="field" style="flex:1.5;">
        <label>Birth Date <span style="opacity:.4;font-size:9px;">dd mm yyyy</span></label>
        <input type="text" id="birthInput" placeholder="22 12 1944" />
      </div>
    </div>

    <div class="alive-row">
      <label class="toggle-wrap">
        <input type="checkbox" id="aliveToggle" checked />
        <span class="toggle-box"></span>
        <span class="toggle-label">Still alive</span>
      </label>
      <div class="death-wrap hidden" id="deathWrap">
        <div class="field">
          <label>Death Date <span style="opacity:.4;font-size:9px;">dd mm yyyy</span></label>
          <input type="text" id="deathInput" placeholder="14 03 2019" />
        </div>
      </div>
      <button class="add-btn" id="addBtn">+ Add</button>
    </div>

    <div class="people-chips" id="chips">
      <div style="font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.2);padding:4px 0;align-self:center;">Add yourself first, then the people around you</div>
    </div>

    <button class="start-btn" id="startBtn" disabled>REVEAL →</button>
    <div class="hint">need at least 2 people to begin</div>
  </div>
</div>

<div id="stage">
  <div id="dots"></div>
  <div id="navHint">TAP TO ADVANCE &nbsp;·&nbsp; ← → KEYS</div>
  <div id="tapLeft" onclick="prevSlide()"></div>
  <div id="tapRight" onclick="nextSlide()"></div>
  <div id="slidesContainer"></div>
</div>

<button id="restartBtn" onclick="restartApp()">↺ START OVER</button>
<canvas id="pCanvas"></canvas>

<script>
const TODAY=new Date();TODAY.setHours(0,0,0,0);

const SLIDE_COLORS=[
  {main:'#c8a0ff',glow:'rgba(200,160,255,.15)'},
  {main:'#70c8ff',glow:'rgba(112,200,255,.12)'},
  {main:'#ff9888',glow:'rgba(255,152,136,.12)'},
  {main:'#70ffb8',glow:'rgba(112,255,184,.12)'},
  {main:'#ffc870',glow:'rgba(255,200,112,.12)'},
  {main:'#ff80c0',glow:'rgba(255,128,192,.12)'},
];

const MONTH_NAMES={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,january:1,february:2,march:3,april:4,june:6,july:7,august:8,september:9,october:10,november:11,december:12};

const WORLD_EVENTS=[
  [1903,'First powered flight'],[1912,'Titanic sinks'],[1914,'WWI begins'],[1918,'WWI ends / Spanish flu'],
  [1929,'Great Depression'],[1939,'WWII begins'],[1945,'WWII ends / atomic bomb'],
  [1950,'Korean War'],[1953,'DNA discovered'],[1957,'Sputnik launched'],
  [1963,'JFK assassinated'],[1969,'Moon landing'],[1973,'Oil crisis'],
  [1979,'Iranian Revolution'],[1981,'AIDS crisis begins'],[1986,'Chernobyl'],
  [1989,'Berlin Wall falls'],[1991,'USSR dissolves'],[1994,'World Wide Web'],
  [2001,'9/11 attacks'],[2008,'Financial crisis'],[2020,'COVID-19 pandemic'],
  [2022,'Ukraine war begins'],[2023,'AI revolution'],
];

const ERA_NAMES=[
  [1900,1920,'Early 1900s'],[1920,1940,'Interwar'],[1940,1960,'Post-War'],
  [1960,1980,'Cold War'],[1980,2000,'Late 20th C'],[2000,2020,'New Millennium'],[2020,2060,'Now'],
];

let people=[],colorIdx=0,youPerson=null;
let slides=[],currentIdx=0,isAnim=false;

/* ── PARTICLES ── */
const pc=document.getElementById('pCanvas'),px=pc.getContext('2d');
let parts=[];
function rsz(){pc.width=innerWidth;pc.height=innerHeight;}
rsz();addEventListener('resize',rsz);
function burst(cx,cy,color,n=60,spread=1){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(3+Math.random()*10)*spread;parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3*spread,alpha:1,size:2+Math.random()*5,color,decay:.007+Math.random()*.013,grav:.18,shape:Math.random()>.5?'circle':'rect',rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.25});}
}
function rain(color,n=25){
  for(let i=0;i<n;i++)setTimeout(()=>{parts.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*2,vy:3+Math.random()*5,alpha:1,size:3+Math.random()*4,color,decay:.004,grav:.15,shape:'rect',rot:Math.random()*Math.PI*2,rotV:(Math.random()-.5)*.2});},Math.random()*1600);
}
(function animP(){
  px.clearRect(0,0,pc.width,pc.height);
  parts=parts.filter(p=>p.alpha>.01);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=.97;p.vy*=.97;p.alpha-=p.decay;if(p.rot!==undefined)p.rot+=p.rotV||0;px.save();px.globalAlpha=p.alpha;px.fillStyle=p.color;if(p.shape==='rect'){px.translate(p.x,p.y);px.rotate(p.rot||0);px.fillRect(-p.size/2,-p.size/3,p.size,p.size*.6);}else{px.beginPath();px.arc(p.x,p.y,p.size,0,Math.PI*2);px.fill();}px.restore();}
  requestAnimationFrame(animP);
})();

/* ── AUDIO ── */
let ac=null;
function ga(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();return ac;}
function tone(freq,type,vol,dur,delay){try{const ctx=ga(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;o.type=type||'sine';const t=ctx.currentTime+(delay||0);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.001,t+(dur||.12));o.start(t);o.stop(t+(dur||.12));}catch(e){}}
function playReveal(){[523,659,784,1047].forEach((f,i)=>tone(f,'triangle',.09,.3,i*.1));}
function playWhoosh(){tone(80,'sawtooth',.035,.4);tone(160,'sine',.035,.3,.05);}
function playTick(v,mx){tone(200+Math.floor(v/mx*400),'square',.02,.03);}
function playBig(){[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,'triangle',.09,.35,i*.07));}

/* ── DATE PARSING ── */
function parseDate(s){
  if(!s||!s.trim())return null;s=s.trim();
  if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)){const[y,mo,d]=s.split('-').map(Number);return new Date(y,mo-1,d);}
  const tokens=s.split(/[\s\/\.\-,]+/).filter(Boolean);
  let day=null,month=null,year=null;
  tokens.forEach(t=>{const n=parseInt(t,10),lower=t.toLowerCase().replace(/[^a-z]/g,'');if(MONTH_NAMES[lower])month=MONTH_NAMES[lower];else if(!isNaN(n)){if(t.length===4||n>31)year=n;else if(day===null)day=n;else if(month===null)month=n;}});
  if(!year||!month||!day||month<1||month>12||day<1||day>31)return null;
  const dt=new Date(year,month-1,day);dt.setHours(0,0,0,0);return isNaN(dt)?null:dt;
}
function validateDateInput(el){const v=el.value.trim();if(!v){el.classList.remove('ok','error');return;}const d=parseDate(v);el.classList.toggle('ok',!!d);el.classList.toggle('error',!d);}

/* ── UTILS ── */
function daysBetween(a,b){return Math.round(Math.abs(b-a)/86400000);}
function formatDays(d){const y=Math.floor(d/365.25),m=Math.floor((d%365.25)/30.44);if(y>0)return`${y}y ${m}m`;return`${d} days`;}
function fmtNum(n){return n.toLocaleString();}
function countUp(el,from,to,dur,cb){
  const start=performance.now();
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  (function f(now){const p=Math.min((now-start)/dur,1),v=Math.round(from+(to-from)*ease(p));el.textContent=fmtNum(v);if(p<.4||Math.random()<.07)playTick(v,to||1);p<1?requestAnimationFrame(f):(el.textContent=fmtNum(to),cb&&cb());})(start);
}
function getAge(p){
  const end=p.alive?TODAY:p.death;
  let age=end.getFullYear()-p.birth.getFullYear();
  const m=end.getMonth()-p.birth.getMonth();
  if(m<0||(m===0&&end.getDate()<p.birth.getDate()))age--;
  return age;
}
function getDecades(p){
  const start=p.birth.getFullYear();
  const end=(p.alive?TODAY:p.death).getFullYear();
  const total=end-start;
  const decadeStart=Math.floor(start/10)*10;
  const segs=[];
  let cur=decadeStart;
  while(cur<=end){
    const segStart=Math.max(start,cur);
    const segEnd=Math.min(end,cur+10);
    if(segEnd>segStart){segs.push({decade:cur,start:segStart,end:segEnd,years:segEnd-segStart});}
    cur+=10;
  }
  return{segs,total};
}
function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`${r},${g},${b}`;
}

/* ── PEOPLE ── */
function addPerson(){
  const name=document.getElementById('nameInput').value.trim()||'Unknown';
  const birthStr=document.getElementById('birthInput').value.trim();
  const alive=document.getElementById('aliveToggle').checked;
  const deathStr=document.getElementById('deathInput').value.trim();
  if(!birthStr){alert('Please enter a birth date.');return;}
  const birth=parseDate(birthStr);
  if(!birth){document.getElementById('birthInput').classList.add('error');alert('Could not read that date.\nTry: 22 12 1977');return;}
  let death;
  if(alive){death=new Date(TODAY);}
  else{if(!deathStr){alert('Enter a death date or toggle "Still alive".');return;}death=parseDate(deathStr);if(!death){document.getElementById('deathInput').classList.add('error');alert('Could not read that date.');return;}if(death>TODAY){alert('Death date cannot be in the future.');return;}}
  if(death<birth){alert('Death date must be after birth date.');return;}
  const color=SLIDE_COLORS[colorIdx%SLIDE_COLORS.length];colorIdx++;
  const isYou=people.length===0;
  people.push({id:Date.now(),name,birth,death,alive,color,isYou});
  if(isYou)youPerson=people[people.length-1];
  const bi=document.getElementById('birthInput'),di=document.getElementById('deathInput');
  document.getElementById('nameInput').value='';bi.value='';bi.classList.remove('ok','error');di.value='';di.classList.remove('ok','error');
  document.getElementById('aliveToggle').checked=true;
  document.getElementById('deathWrap').className='death-wrap hidden';

  document.getElementById('startBtn').disabled=people.length<2;
}

function removePerson(id){
  people=people.filter(p=>p.id!==id);

  else if(!people.find(p=>p.isYou)){people[0].isYou=true;youPerson=people[0];}
  renderChips();document.getElementById('startBtn').disabled=people.length<2;
}

function renderChips(){
  const el=document.getElementById('chips');
  if(people.length===0){el.innerHTML='<div style="font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.2);padding:4px 0;align-self:center;">Add yourself first, then the people around you</div>';return;}
  el.innerHTML=people.map(p=>`<div class="chip${p.isYou?' chip-you':''}"><div class="cdot" style="background:${p.color.main};"></div><span>${p.name}${p.isYou?'<span style="font-size:9px;color:rgba(255,255,255,.3);margin-left:4px;">YOU</span>':''}</span><span style="color:rgba(255,255,255,.22);font-size:10px;margin-left:2px;">${p.birth.getFullYear()}–${p.alive?'now':p.death.getFullYear()}</span><button class="cx" onclick="removePerson(${p.id})">×</button></div>`).join('');

/* ── COMPUTE ── */
function computeStats(){
  people.forEach(p=>{
    p._total=daysBetween(p.birth,p.death);
    p._age=getAge(p);
    if(p.isYou){p._gap=0;p._overlap=p._total;p._pct=100;return;}
    const yB=youPerson.birth,yD=youPerson.death;
    p._gap=p.birth<yB?daysBetween(p.birth,p.death<yB?p.death:yB):0;
    const olS=new Date(Math.max(p.birth,yB)),olE=new Date(Math.min(p.death,yD));
    p._overlap=olE>olS?daysBetween(olS,olE):0;
    p._pct=p._total>0?Math.round((p._overlap/p._total)*100):0;
  });
}

    const ticksHtml=ticks.map(y=>`<div class="tl-ruler-tick" style="left:${pct(y)}%;"><span>${y}</span></div>`).join('');

    el.innerHTML=`
      <div class="s-eyebrow reveal-line" id="tl_ey" style="margin-bottom:8px;"><span>everyone's life, side by side</span></div>
      <div class="tl-wrap" id="tl_main">
        <div class="tl-axis">
          <div class="tl-ruler" id="tl_ruler">
            ${ticksHtml}
          </div>
          <div style="margin-top:16px;">${rowsHtml}</div>
        </div>
      </div>`;

    setTimeout(()=>document.getElementById('tl_ey')?.classList.add('in'),120);

    // Animate rows in
    allPeople.forEach((_,i)=>{
      setTimeout(()=>{
        const row=document.getElementById(`tlrow_${i}`);
        if(row)row.classList.add('in');
      },400+i*100);
    });

    // Animate bars
    setTimeout(()=>{
      allPeople.forEach((p,i)=>{
        const bar=document.getElementById(`tlbar_${i}`);
        if(!bar)return;
        bar.style.width=bar.dataset.width+'%';

        // If this is YOU, also position the "you" line on others
        if(p.isYou){
          const youLeft=pct(p.birth.getFullYear()+(p.birth.getMonth()/12));
          allPeople.forEach((_,j)=>{
            if(j===i)return;
            const yl=document.getElementById(`tl_youline_${j}`);
            if(yl){yl.style.left=youLeft+'%';setTimeout(()=>yl.classList.add('in'),1200);}
          });
        }
      });
      playReveal();
    },600);

    // Add you-birth line to all other rows
    setTimeout(()=>{
      const youLeft=pct(you.birth.getFullYear()+(you.birth.getMonth()/12));
      allPeople.forEach((p,i)=>{
        if(p.isYou)return;
        const bar=document.getElementById(`tlbar_${i}`);
        if(!bar)return;
        // overlap band
        const yB=you.birth.getFullYear()+(you.birth.getMonth()/12);
        const yD=you.alive?(TODAY.getFullYear()+(TODAY.getMonth()/12)):you.death.getFullYear()+(you.death.getMonth()/12);
        const pB=p.birth.getFullYear()+(p.birth.getMonth()/12);
        const pD=p.alive?(TODAY.getFullYear()+(TODAY.getMonth()/12)):p.death.getFullYear()+(p.death.getMonth()/12);
        const olS=Math.max(yB,pB),olE=Math.min(yD,pD);
        if(olE>olS){
          const band=document.createElement('div');
          band.className='tl-overlap-band';
          band.style.left=pct(olS)+'%';
          band.style.width=((olE-olS)/span*100).toFixed(3)+'%';
          band.style.background=`rgba(${hexToRgb(p.color.main)},.3)`;
          bar.appendChild(band);
          setTimeout(()=>band.classList.add('in'),200);
        }
      });
    },1400);

    setTimeout(()=>{burst(innerWidth*.5,innerHeight*.5,'#c8a0ff',30);},2200);
    setTimeout(()=>document.getElementById('restartBtn').style.display='block',1800);
  }});

  // FINAL: Summary
  defs.push({render(el){
    el.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;';
    el.style.background='radial-gradient(ellipse at 50% 40%,#12101a 0%,#060508 75%)';
    const maxGapP=others.reduce((a,b)=>a._gap>b._gap?a:b,others[0]);
    const maxOlP=others.reduce((a,b)=>a._overlap>b._overlap?a:b,others[0]);
    const avgPct=Math.round(others.reduce((s,p)=>s+p._pct,0)/others.length);
    el.innerHTML=`
      <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(200,160,255,.05) 0%,transparent 60%);pointer-events:none;"></div>
      <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0;width:100%;">
        <div class="s-eyebrow reveal-line" id="sum_ey"><span>the full picture</span></div>
        <div class="sum-card" id="sumcard" style="opacity:0;transition:opacity .7s .3s;">
          <div class="sum-row">
            <div><div class="sum-key">Biggest Gap</div><div class="sum-name">${maxGapP.name} existed</div></div>
            <div style="text-align:right;"><div class="sum-val" style="color:#ff8878;">${formatDays(maxGapP._gap)}</div><div class="sum-note">before you</div></div>
          </div>
          <div class="sum-row">
            <div><div class="sum-key">Most Shared Time</div><div class="sum-name">${maxOlP.name}</div></div>
            <div style="text-align:right;"><div class="sum-val" style="color:${maxOlP.color.main};">${formatDays(maxOlP._overlap)}</div><div class="sum-note">${maxOlP._pct}% of their life</div></div>
          </div>
          <div class="sum-row">
            <div><div class="sum-key">Average Overlap</div><div class="sum-name">across ${others.length} ${others.length===1?'person':'people'}</div></div>
            <div style="text-align:right;"><div class="sum-val" style="color:#a0c8ff;">${avgPct}%</div></div>
          </div>
          <div class="sum-row">
            <div><div class="sum-key">Your Life So Far</div><div class="sum-name">${you.name}</div></div>
            <div style="text-align:right;"><div class="sum-val" style="color:${you.color.main};">${formatDays(you._total)}</div></div>
          </div>
          <div class="sum-row">
            <div><div class="sum-key">Your Age</div><div class="sum-name">${you.name}</div></div>
            <div style="text-align:right;"><div class="sum-val" style="color:${you.color.main};">${you._age} years</div></div>
          </div>
        </div>
      </div>`;
    setTimeout(()=>document.getElementById('sum_ey')?.classList.add('in'),120);
    setTimeout(()=>{
      const sc=document.getElementById('sumcard');if(sc)sc.style.opacity='1';
      playBig();
      burst(innerWidth*.28,innerHeight*.5,'#c8a0ff',50);
      burst(innerWidth*.72,innerHeight*.5,'#a0c8ff',50);
      rain('#c8a0ff',18);rain('#a0c8ff',12);
    },500);
    setTimeout(()=>document.getElementById('restartBtn').style.display='block',1800);
  }});

  return defs;
}

/* ── SLIDE ENGINE ── */
function renderSlide(idx,dir){
  const container=document.getElementById('slidesContainer');
  const old=container.querySelector('.current');
  if(old){if(old._cleanup)old._cleanup();old.classList.remove('current');old.classList.add(dir>=0?'sExit':'sExitBack');setTimeout(()=>old.remove(),450);}
  const el=document.createElement('div');
  el.className='slide current '+(dir>=0?'sEnter':'sEnterBack');
  container.appendChild(el);slides[idx].render(el);playWhoosh();
  document.querySelectorAll('.dot').forEach((d,i)=>{d.className='dot'+(i<idx?' done':i===idx?' active':'');});
}
function nextSlide(){if(isAnim||currentIdx>=slides.length-1)return;isAnim=true;currentIdx++;renderSlide(currentIdx,1);setTimeout(()=>isAnim=false,650);}
function prevSlide(){if(isAnim||currentIdx<=0)return;isAnim=true;currentIdx--;renderSlide(currentIdx,-1);setTimeout(()=>isAnim=false,650);}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')nextSlide();if(e.key==='ArrowLeft')prevSlide();});

/* ── APP FLOW ── */
function startApp(){
  if(people.length<2)return;
  slides=buildSlides();currentIdx=0;
  document.getElementById('dots').innerHTML=slides.map((_,i)=>`<div class="dot${i===0?' active':''}"></div>`).join('');
  document.getElementById('inputScreen').classList.add('hide');
  document.getElementById('restartBtn').style.display='none';
  setTimeout(()=>{document.getElementById('stage').classList.add('active');renderSlide(0,1);},800);
}
function restartApp(){
  document.getElementById('stage').classList.remove('active');
  document.getElementById('inputScreen').classList.remove('hide');
  document.getElementById('restartBtn').style.display='none';
  document.getElementById('slidesContainer').innerHTML='';
  people=[];youPerson=null;colorIdx=0;slides=[];currentIdx=0;
  renderChips();document.getElementById('startBtn').disabled=true;
}

/* ── EVENTS ── */
document.getElementById('addBtn').addEventListener('click',addPerson);
document.getElementById('startBtn').addEventListener('click',startApp);
document.getElementById('aliveToggle').addEventListener('change',function(){
  const w=document.getElementById('deathWrap');
  w.className='death-wrap '+(this.checked?'hidden':'visible');
});
document.getElementById('birthInput').addEventListener('input',function(){validateDateInput(this);});
document.getElementById('deathInput').addEventListener('input',function(){validateDateInput(this);});
document.getElementById('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('birthInput').focus();});
document.getElementById('birthInput').addEventListener('keydown',e=>{if(e.key==='Enter'){const alive=document.getElementById('aliveToggle').checked;if(!alive)document.getElementById('deathInput').focus();else addPerson();}});
document.getElementById('deathInput').addEventListener('keydown',e=>{if(e.key==='Enter')addPerson();});
</script>
