<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>KOIA — Yin & Yang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg:#05060d; --yang:#34e3ff; --yin:#ff4d9d; --seam:#f4faff; --gold:#ffd24a;
    --dim:rgba(244,250,255,0.55);
    --display:"Orbitron","Arial Black",system-ui,sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; width:100%; overflow:hidden; background:var(--bg); }
  body {
    font-family:var(--body);
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
  }
  #bg { display:block; position:fixed; inset:0; width:100%; height:100%; z-index:0;
        filter:blur(28px) brightness(.5) saturate(1.15); transform:scale(1.18); }
  #game { display:block; position:fixed; z-index:1; touch-action:none;
          box-shadow:0 0 50px rgba(0,0,0,.55); }

  /* —— nakładki UI (menu / sklep / koniec) —— */
  .screen{
    position:fixed; inset:0; z-index:10;
    display:none; flex-direction:column; align-items:center;
    padding:max(28px,6vh) 24px max(34px,7vh);
    text-align:center;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(52,227,255,0.10), transparent 60%),
      radial-gradient(120% 70% at 50% 100%, rgba(255,77,157,0.10), transparent 60%),
      linear-gradient(180deg, rgba(5,6,13,0.72) 0%, rgba(5,6,13,0.30) 42%, rgba(5,6,13,0.30) 58%, rgba(5,6,13,0.82) 100%);
    animation:fade .25s ease both;
  }
  @keyframes fade{ from{opacity:0} to{opacity:1} }

  .wordmark{
    font-family:var(--display); font-weight:900;
    font-size:clamp(46px,15vw,96px); letter-spacing:.14em; color:var(--seam);
    text-shadow:0 0 24px rgba(244,250,255,.55), 0 0 60px rgba(52,227,255,.35);
    line-height:1;
  }
  .tagline{ margin-top:14px; color:var(--dim); font-size:clamp(12px,3.4vw,15px); letter-spacing:.22em; text-transform:uppercase; }
  .seamrule{ width:min(72%,360px); height:2px; margin:20px 0 0;
    background:linear-gradient(90deg,transparent,var(--seam),transparent);
    box-shadow:0 0 14px rgba(244,250,255,.6); }
  .spacer{ flex:1 1 auto; min-height:18px; }
  .hint{ color:var(--dim); font-size:clamp(11px,3vw,13px); letter-spacing:.06em; margin-bottom:18px; }
  .actions{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px; }

  .btn{
    font-family:var(--display); font-weight:700;
    font-size:clamp(15px,4.4vw,19px); letter-spacing:.16em; text-transform:uppercase;
    padding:18px 22px; border-radius:999px; border:2px solid var(--seam);
    color:var(--seam); background:rgba(244,250,255,.05); cursor:pointer;
    transition:transform .08s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{
    border-color:var(--yang); color:#eafaff;
    background:linear-gradient(100deg, rgba(52,227,255,.22), rgba(255,77,157,.22));
    box-shadow:0 0 22px rgba(52,227,255,.4), inset 0 0 18px rgba(255,77,157,.15);
  }
  .btn-gold{ border-color:var(--gold); color:var(--gold); background:rgba(255,210,74,.06); }
  .btn-ghost{ border-color:rgba(244,250,255,.35); color:var(--dim); }

  .goldbar{ display:flex; align-items:center; justify-content:center; gap:9px; margin-top:16px; color:var(--gold);
    font-family:var(--display); font-weight:700; letter-spacing:.1em; font-size:clamp(14px,4vw,17px); }
  .coin{ width:15px; height:15px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); }

  /* sklep */
  .panel-title{ font-family:var(--display); font-weight:900; font-size:clamp(28px,8vw,42px);
    letter-spacing:.12em; color:var(--seam); text-shadow:0 0 18px rgba(244,250,255,.4); }
  .shoplist{ width:100%; max-width:440px; display:flex; flex-direction:column; gap:12px;
    margin:18px 0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .skin{
    display:flex; align-items:center; gap:14px; padding:14px 16px;
    border-radius:18px; border:2px solid rgba(244,250,255,.14);
    background:rgba(244,250,255,.04); cursor:pointer; transition:border-color .2s, background .2s;
  }
  .skin.owned{ border-color:rgba(244,250,255,.28); }
  .skin.selected{ border-color:var(--seam); background:rgba(244,250,255,.09); box-shadow:0 0 18px rgba(244,250,255,.2); }
  .swatches{ display:flex; gap:6px; flex:0 0 auto; }
  .dot{ width:20px; height:20px; border-radius:50%; box-shadow:0 0 8px currentColor; }
  .skin-name{ flex:1 1 auto; text-align:left; font-weight:700; color:var(--seam); font-size:clamp(15px,4.2vw,18px); }
  .skin-status{ font-family:var(--display); font-weight:700; font-size:clamp(12px,3.4vw,14px); letter-spacing:.08em; white-space:nowrap; }
  .st-price{ color:var(--gold); } .st-price.cant{ color:rgba(255,210,74,.35); }
  .st-pick{ color:var(--dim); } .st-sel{ color:var(--seam); }

  /* koniec gry */
  .over-score{ font-family:var(--display); font-weight:900; font-size:clamp(72px,24vw,150px); line-height:.9; color:var(--seam);
    text-shadow:0 0 30px rgba(244,250,255,.4); }
  .over-sub{ color:var(--dim); margin-top:10px; font-size:clamp(13px,3.6vw,16px); letter-spacing:.04em; }
  .over-gold{ color:var(--gold); margin-top:6px; font-size:clamp(13px,3.6vw,16px); font-weight:700; }
  .ver{ color:rgba(244,250,255,.25); font-size:11px; letter-spacing:.2em; margin-top:16px; }

  /* przycisk dźwięku */
  #mute{
    position:fixed; top:14px; right:14px; z-index:20;
    width:46px; height:46px; border-radius:50%;
    border:2px solid rgba(244,250,255,.3); background:rgba(5,6,13,.5);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #mute svg{ width:22px; height:22px; }
  #mute .slash{ display:none; }
  #mute.off{ border-color:rgba(255,106,106,.7); }
  #mute.off .note{ opacity:.4; }
  #mute.off .slash{ display:block; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="game"></canvas>

<div id="menu" class="screen">
  <div class="wordmark">KOIA</div>
  <div class="tagline">dwie koi · jedna równowaga</div>
  <div class="seamrule"></div>
  <div class="spacer"></div>
  <div class="hint">przesuń palcem — dolna ryba to odbicie</div>
  <div class="actions">
    <button id="btnPlay" class="btn btn-primary">Graj</button>
    <button id="btnShop" class="btn btn-gold">Sklep</button>
    <div class="goldbar"><span class="coin"></span><span id="menuGold">0</span></div>
  </div>
</div>

<div id="shop" class="screen">
  <div class="panel-title">Sklep</div>
  <div class="goldbar"><span class="coin"></span><span id="shopGold">0</span></div>
  <div id="shopList" class="shoplist"></div>
  <div class="actions"><button id="btnBack" class="btn btn-ghost">Wróć</button></div>
</div>

<div id="over" class="screen">
  <div class="spacer"></div>
  <div class="panel-title">Niepopad</div>
  <div class="over-score" id="overScore">0</div>
  <div class="over-sub" id="overSub">świat trwał 0 chwil · rekord 0</div>
  <div class="over-gold" id="overGold">złoto z gry: 0 · bank: 0</div>
  <div class="spacer"></div>
  <div class="actions">
    <button id="btnAgain" class="btn btn-primary">Jeszcze raz</button>
    <button id="btnShop2" class="btn btn-gold">Sklep</button>
  </div>
  <div class="ver">KOIA · v14</div>
</div>

<button id="mute" aria-label="dźwięk">
  <svg viewBox="0 0 24 24" fill="none">
    <path class="note" fill="#f4faff" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    <line class="slash" x1="4" y1="4" x2="20" y2="20" stroke="#ff6a6a" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
</button>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const bg = document.getElementById('bg');
  const bgctx = bg.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Yin (dół, mrok) + Yang (góra, światło) — kolory aury
  const COL = {
    bg:'#05060d', yang:'#34e3ff', yin:'#ff4d9d', seam:'#f4faff',
    gold:'#ffd24a', dim:'rgba(244,250,255,0.55)'
  };

  // —— lore: fragmenty mitu na progach punktowych ——
  const BEATS = [
    [1,  'Na początku był Splot.'],
    [3,  'Dwie ryby ścigają się od zawsze. Nikt nie wie po co.'],
    [6,  'Yin płynie w dół. Yang płynie w górę. Tak już jest.'],
    [10, 'Świat trwa, dopóki obie płyną.'],
    [15, 'Podobno jedna z nich myśli, że to wyścig.'],
    [21, 'Wszechświat wstrzymuje oddech.'],
    [28, 'Mówią, że gdy się spotkają — zacznie się od nowa.'],
    [36, 'Ale one wolą po prostu pływać.'],
    [46, 'Równowaga to nie cel. To pływanie.']
  ];

  let W=0,H=0,dpr=1,ayA=0,ayB=0,seamY=0;
  const DOT_R = () => Math.max(9, Math.min(W,H)*0.026);

  const ASPECT = 0.462; // szer/wys docelowe pole gry (~19.5:9, telefon pionowo)
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    const vw = window.innerWidth, vh = window.innerHeight;
    // dopasuj stałe proporcje do ekranu (contain) — reszta to listewki
    let pfW, pfH;
    if(vw/vh > ASPECT){ pfH = vh; pfW = Math.round(vh*ASPECT); }
    else { pfW = vw; pfH = Math.round(vw/ASPECT); }
    W = pfW; H = pfH;
    canvas.width = Math.floor(pfW*dpr); canvas.height = Math.floor(pfH*dpr);
    canvas.style.width = pfW+'px'; canvas.style.height = pfH+'px';
    canvas.style.left = Math.round((vw-pfW)/2)+'px';
    canvas.style.top  = Math.round((vh-pfH)/2)+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    // tło: niska rozdzielczość (i tak rozmyte) na cały ekran
    bg.width = Math.max(1, Math.floor(vw/4));
    bg.height = Math.max(1, Math.floor(vh/4));
    seamY = H/2; ayA = seamY - H*0.16; ayB = seamY + H*0.16;
    targetX = clampX(targetX||W/2); playerX = clampX(playerX||W/2);
    initAmbient();
  }

  let state='start';
  let playerX=0, targetX=0, prevX=0, dirA=1;
  let bars=[], particles=[], trailA=[], trailB=[];
  let score=0, best=0, spawnTimer=0, lastLane='B';
  let shake=0, seamFlash=0, deathT=0, deadLane=null;
  let beat=null, beatT=0, nextBeat=0, last=0;
  let ambient=[];
  let gold=[], floaters=[], goldCount=0, goldTimer=0;

  // —— sklep: skórki ryb + style przeszkód, kupowane za zebrane złoto ——
  const PALETTES = [
    {id:'klasyk', name:'Yin & Yang', price:0,  yang:'#34e3ff', yin:'#ff4d9d'},
    {id:'zloto',  name:'Złote Koi',  price:40, yang:'#ffd24a', yin:'#ff7a3c'},
    {id:'widmo',  name:'Widma',      price:60, yang:'#9b7bff', yin:'#3cf0c8'},
    {id:'ogien',  name:'Ogień i Lód',price:90, yang:'#5ad1ff', yin:'#ff5a4d'}
  ];
  const OBSTACLES = [
    {id:'kreski', name:'Kreski', price:0},
    {id:'kolka',  name:'Kółka',  price:50}
  ];
  let totalGold=0, owned=new Set(['klasyk','kreski']), selPal='klasyk', selObs='kreski';
  let musicOn=true;
  let hits=[];  // klikalne pola UI, budowane co klatkę
  const SAVE='koia_save_v1';
  function persist(){
    try{ localStorage.setItem(SAVE, JSON.stringify(
      {gold:totalGold, owned:[...owned], pal:selPal, obs:selObs, best:best, music:musicOn})); }catch(e){}
  }
  function loadSave(){
    try{ const s=localStorage.getItem(SAVE); if(s){
      const d=JSON.parse(s);
      totalGold=d.gold||0; owned=new Set(d.owned||['klasyk','kreski']);
      selPal=d.pal||'klasyk'; selObs=d.obs||'kreski'; best=d.best||0;
      if(d.music===false) musicOn=false;
    }}catch(e){}
  }
  function applyPalette(){
    const p=PALETTES.find(x=>x.id===selPal)||PALETTES[0];
    COL.yang=p.yang; COL.yin=p.yin;
  }
  function buyOrSelect(type,it){
    if(owned.has(it.id)){ doSelect(type,it); }
    else if(totalGold>=it.price){ totalGold-=it.price; owned.add(it.id); doSelect(type,it); }
  }
  function doSelect(type,it){
    if(type==='pal'){ selPal=it.id; applyPalette(); } else { selObs=it.id; }
    persist();
  }

  function initAmbient(){
    ambient=[]; if(reduce) return;
    const n=34;
    for(let i=0;i<n;i++){
      const top=i<n/2;
      ambient.push({
        x:Math.random()*W,
        y:top?Math.random()*seamY:seamY+Math.random()*(H-seamY),
        r:1+Math.random()*2.6,
        vx:(Math.random()-0.5)*9,
        vy:(Math.random()-0.5)*11,
        top
      });
    }
  }

  function clampX(x){ const r=DOT_R(); return Math.max(r, Math.min(W-r, x)); }

  let actx=null, musicBuf=null, musicSrc=null, musicGain=null, sfxGain=null, musicWant=false;
  function b64ToBuf(uri){
    const bin=atob(uri.split(',')[1]); const n=bin.length; const a=new Uint8Array(n);
    for(let i=0;i<n;i++) a[i]=bin.charCodeAt(i); return a.buffer;
  }
  function ensureAudio(){
    if(actx) return;
    try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
    musicGain=actx.createGain(); musicGain.gain.value=0.5; musicGain.connect(actx.destination);
    sfxGain=actx.createGain(); sfxGain.gain.value=0.6; sfxGain.connect(actx.destination);
    actx.decodeAudioData(b64ToBuf(MUSIC_DATA)).then(buf=>{
      musicBuf=buf; if(musicWant) startMusic();
    }).catch(()=>{});
  }
  function tone(freq,start,dur,type,vol,slideTo){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,start);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,start+dur);
    g.gain.setValueAtTime(0.0001,start);
    g.gain.exponentialRampToValueAtTime(vol,start+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,start+dur);
    o.connect(g).connect(sfxGain);
    o.start(start); o.stop(start+dur+0.03);
  }
  function sfx(name){
    if(!musicOn) return;
    ensureAudio(); if(!actx) return;
    if(actx.state==='suspended') actx.resume();
    const t0=actx.currentTime;
    if(name==='coin'){ tone(988,t0,0.07,'square',0.16); tone(1319,t0+0.06,0.12,'square',0.16); }
    else if(name==='harmony'){ tone(523,t0,0.1,'triangle',0.16); tone(659,t0+0.08,0.1,'triangle',0.16); tone(784,t0+0.16,0.16,'triangle',0.18); tone(1047,t0+0.24,0.22,'square',0.12); }
    else if(name==='die'){ tone(440,t0,0.55,'sawtooth',0.2,70); }
    else if(name==='tick'){ tone(1280,t0,0.03,'square',0.04); }
    else if(name==='click'){ tone(680,t0,0.05,'square',0.09); }
  }
  function startMusic(){
    if(!musicOn) return;
    musicWant=true; ensureAudio();
    if(actx && actx.state==='suspended') actx.resume();
    if(!musicBuf) return;            // ruszy po zdekodowaniu
    stopMusic();
    musicSrc=actx.createBufferSource(); musicSrc.buffer=musicBuf; musicSrc.loop=true;
    musicSrc.connect(musicGain); musicSrc.start();
  }
  function stopMusic(){ musicWant=false; if(musicSrc){ try{musicSrc.stop();}catch(e){} try{musicSrc.disconnect();}catch(e){} musicSrc=null; } }

  function play(){ reset(); state='play'; startMusic(); }

  function reset(){
    score=0; bars=[]; particles=[]; trailA=[]; trailB=[];
    playerX=targetX=prevX=W/2; dirA=1;
    spawnTimer=0.9; lastLane='B';
    shake=0; seamFlash=0; deathT=0; deadLane=null;
    beat=null; beatT=0; nextBeat=0;
    gold=[]; floaters=[]; goldCount=0; goldTimer=2.4;
  }

  function speed(){ return H*0.34*(1+Math.min(score,70)*0.012); }
  function gapWidth(){ return Math.max(W*0.20, W*0.34 - score*W*0.0016); }
  function spawnEvery(){ return Math.max(0.72, 1.25 - score*0.01); }

  function spawnBar(lane){
    const gw=gapWidth(), m=DOT_R()+6;
    const gc=m+gw/2+Math.random()*(W-gw-2*m);
    bars.push({lane, y:lane==='A'?-28:H+28, gapC:gc, gapW:gw, t:Math.max(16,H*0.022), scored:false});
  }

  function spawnGold(){
    const lane=Math.random()<0.5?'A':'B';
    const m=DOT_R()*2;
    const spawnX=m+Math.random()*(W-2*m);
    gold.push({
      lane, x:spawnX, y:lane==='A'?-20:H+20,
      r:DOT_R()*0.92,
      vx:0,          // będzie aktualizowane w update
      phase:Math.random()*Math.PI*2  // offset sinusoidy
    });
  }

  function burst(x,y,color){
    if(reduce) return;
    for(let i=0;i<30;i++){
      const a=Math.random()*Math.PI*2, sp=80+Math.random()*340;
      particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.6+Math.random()*0.6,max:1.2,color});
    }
  }

  function die(lane){
    state='over'; deathT=0; deadLane=lane;
    stopMusic(); sfx('die');

  }

  function update(dt){

      playerX+=(targetX-playerX)*al; playerX=clampX(playerX);
      const vel=playerX-prevX;
      if(vel>0.25) dirA=1; else if(vel<-0.25) dirA=-1;

      trailA.push({x:playerX,y:ayA}); trailB.push({x:W-playerX,y:ayB});
      if(trailA.length>12) trailA.shift(); if(trailB.length>12) trailB.shift();
    }
    for(const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=360*dt; p.vx*=0.99; p.life-=dt; }
    particles=particles.filter(p=>p.life>0);

    for(const a of ambient){
      a.x+=a.vx*dt; a.y+=a.vy*dt;
      if(a.x<-6) a.x=W+6; else if(a.x>W+6) a.x=-6;
      if(a.top){ if(a.y<-6) a.y=seamY; else if(a.y>seamY) a.y=-6; }
      else { if(a.y<seamY) a.y=H+6; else if(a.y>H+6) a.y=seamY; }
    }

    for(const f of floaters){ f.y-=42*dt; f.life-=dt; }
    floaters=floaters.filter(f=>f.life>0);

    shake*=Math.pow(0.0008,dt); if(shake<0.3) shake=0;
    seamFlash*=Math.pow(0.02,dt);
    if(beat) { beatT+=dt; if(beatT>4.2) beat=null; }

    if(state!=='play'){ deathT+=dt; return; }

    // jeden strumień barier naprzemiennie: nigdy dwie naraz na obu rybach,
    // więc każda sytuacja jest do przejścia (trudność = tempo + odbite sterowanie)
    spawnTimer-=dt;
    if(spawnTimer<=0){
      lastLane = lastLane==='A' ? 'B' : 'A';
      spawnBar(lastLane);
      spawnTimer = spawnEvery();
    }

    const v=speed()*dt, r=DOT_R();
    for(const b of bars){
      b.y+=b.lane==='A'?v:-v;
      const dx=b.lane==='A'?playerX:W-playerX;
      const dy=b.lane==='A'?ayA:ayB;
      const overlap=Math.abs(dy-b.y)<(b.t/2+r);
      const inGap=(dx-r>b.gapC-b.gapW/2)&&(dx+r<b.gapC+b.gapW/2);
      if(overlap&&!inGap){ die(b.lane); return; }
      if(!b.scored){
        const passed=b.lane==='A'?(b.y>dy+b.t/2+r):(b.y<dy-b.t/2-r);
        if(passed){ b.scored=true; score++; seamFlash=Math.max(seamFlash,0.5); sfx('tick');
          if(nextBeat<BEATS.length && score>=BEATS[nextBeat][0]){ beat=BEATS[nextBeat][1]; beatT=0; nextBeat++; }
        }
      }
    }
    bars=bars.filter(b=>b.lane==='A'?(b.y-b.t/2<seamY):(b.y+b.t/2>seamY));

    // złote bąbelki — magnetyzm + sinusoidalny dryf
    goldTimer-=dt;
    if(goldTimer<=0){ spawnGold(); goldTimer=1.8+Math.random()*1.6; }
    const t_now=performance.now()/1000;
    for(const o of gold){
      o.y+=o.lane==='A'?v:-v;
      const fx=o.lane==='A'?playerX:W-playerX;
      // magnetyzm: lekko przyciąga w stronę ryby
      const dx=fx-o.x;
      const dist=Math.abs(dx);
      const pull=Math.min(dist*0.18, 90);  // max 90px/s przyciągania
      o.vx+=(dx>0?1:-1)*pull*dt;
      // sinusoidalny dryf boczny
      o.vx+=Math.sin(t_now*3.2+o.phase)*55*dt;
      // tłumienie żeby nie szalało
      o.vx*=Math.pow(0.18, dt);
      o.x+=o.vx*dt;
      o.x=Math.max(o.r, Math.min(W-o.r, o.x));

      const fy=o.lane==='A'?ayA:ayB;
      if(!o.got && Math.hypot(o.x-fx,o.y-fy) < r*1.7+o.r){
        o.got=true; score+=5; goldCount++; sfx('coin');
        floaters.push({x:o.x,y:o.y,text:'+5',life:0.9,color:COL.gold});
        burst(o.x,o.y,COL.gold);
        seamFlash=Math.max(seamFlash,0.6);
        if(goldCount%5===0){
          score+=10; sfx('harmony');
          floaters.push({x:W/2,y:seamY-DOT_R()*1.4,text:'HARMONIA +10',life:1.4,color:COL.gold});
          burst(playerX,ayA,COL.gold); burst(W-playerX,ayB,COL.gold);
        }
      }
    }
    // znikają ~40px przed Splotem (nie za nim)
    gold=gold.filter(o=>!o.got && (o.lane==='A'?o.y<seamY-o.r*2:o.y>seamY+o.r*2));
  }

  // —— rysowanie ——
  function rr(x,y,w,h,rad){
    const r=Math.min(rad,h/2,w/2);
    ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function drawBar(b){
    const color=b.lane==='A'?COL.yang:COL.yin;
    const gl=b.gapC-b.gapW/2, gr=b.gapC+b.gapW/2, y=b.y-b.t/2;
    ctx.fillStyle=color; ctx.globalAlpha=0.22;
    if(gl>0){ rr(0,y-2,gl,b.t+4,5); ctx.fill(); }
    if(gr<W){ rr(gr,y-2,W-gr,b.t+4,5); ctx.fill(); }
    ctx.globalAlpha=1;
    if(gl>0){ rr(0,y,gl,b.t,4); ctx.fill(); }
    if(gr<W){ rr(gr,y,W-gr,b.t,4); ctx.fill(); }
    ctx.fillStyle=COL.seam; ctx.globalAlpha=0.85;
    ctx.fillRect(gl-2,y,2,b.t); ctx.fillRect(gr,y,2,b.t);
    ctx.globalAlpha=1;
  }

  function drawTrail(tr,color){
    for(let i=0;i<tr.length;i++){
      const p=tr[i], f=i/tr.length;
      ctx.globalAlpha=f*0.4; ctx.fillStyle=color;
      ctx.beginPath(); ctx.arc(p.x,p.y,DOT_R()*(0.25+f*0.6),0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  // koi z migoczącym ogonem; eye = "oczko" yin-yang (kolor przeciwnej ryby)
  function drawFish(cx,cy,dir,glow,eyeCol,t,alpha){
    const r=DOT_R(), L=r*2.7, Bh=r*1.55;
    ctx.save();
    ctx.globalAlpha=alpha==null?1:alpha;
    ctx.translate(cx,cy+Math.sin(t*2+cx)*r*0.12);
    ctx.scale(dir,1);
    ctx.shadowColor=glow; ctx.shadowBlur=reduce?0:20;
    ctx.fillStyle=glow;
    // ogon
    const wob=Math.sin(t*9+cx)*Bh*0.45;
    ctx.beginPath();
    ctx.moveTo(-L*0.28,0);
    ctx.lineTo(-L*0.62, wob-Bh*0.5);
    ctx.quadraticCurveTo(-L*0.5,0,-L*0.62, wob+Bh*0.5);
    ctx.closePath(); ctx.fill();
    // płetwa grzbietowa
    ctx.beginPath();
    ctx.moveTo(-L*0.05,-Bh*0.45);
    ctx.quadraticCurveTo(L*0.05,-Bh*0.95, L*0.18,-Bh*0.4);
    ctx.closePath(); ctx.fill();
    // ciało
    ctx.shadowBlur=reduce?0:14;
    ctx.beginPath(); ctx.ellipse(L*0.02,0,L*0.36,Bh*0.5,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // oczko yin-yang (kolor przeciwieństwa) z kropką w środku
    ctx.fillStyle=eyeCol;
    ctx.beginPath(); ctx.arc(L*0.2,-Bh*0.1,Bh*0.18,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=glow;
    ctx.beginPath(); ctx.arc(L*0.2,-Bh*0.1,Bh*0.07,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function txt(s,x,y,size,color,weight){
    ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=(weight||'900')+' '+size+'px "Arial Black",Arial,sans-serif';
    try{ ctx.letterSpacing=(size*0.05)+'px'; }catch(e){}
    ctx.fillText(s,x,y);
    try{ ctx.letterSpacing='0px'; }catch(e){}
  }

  function wrap(s,x,y,size,color,maxW){
    ctx.font='700 '+size+'px "Arial Black",Arial,sans-serif';
    const words=s.split(' '); const lines=[]; let cur='';
    for(const w of words){
      const test=cur?cur+' '+w:w;
      if(ctx.measureText(test).width>maxW && cur){ lines.push(cur); cur=w; } else cur=test;
    }
    if(cur) lines.push(cur);
    const lh=size*1.25, oy=y-(lines.length-1)*lh/2;
    lines.forEach((ln,i)=>txt(ln,x,oy+i*lh,size,color,'700'));
  }

  // przycisk z polem dotyku
  function btn(label,cx,cy,w,h,color,action,filled){
    hits.push({x:cx-w/2,y:cy-h/2,w,h,action});
    ctx.save();
    if(filled && !reduce){ ctx.shadowColor=color; ctx.shadowBlur=20; }
    rr(cx-w/2,cy-h/2,w,h,h*0.5);
    if(filled){ ctx.globalAlpha=0.14; ctx.fillStyle=color; ctx.fill(); ctx.globalAlpha=1; }
    ctx.lineWidth=2.5; ctx.strokeStyle=color; ctx.stroke();
    ctx.shadowBlur=0;
    txt(label,cx,cy,h*0.36,color);
    ctx.restore();
  }

  // przycisk dźwięku (ikona nuty, róg ekranu)
  function drawMuteBtn(){
    const s=Math.min(W,H)*0.055, cx=W-s*1.5, cy=s*1.5;
    hits.push({x:cx-s,y:cy-s,w:s*2,h:s*2,action:toggleMusic});
    ctx.save();
    ctx.lineWidth=2; ctx.strokeStyle='rgba(244,250,255,0.3)';
    rr(cx-s,cy-s,s*2,s*2,s*0.5); ctx.stroke();
    ctx.fillStyle=musicOn?COL.seam:'rgba(244,250,255,0.4)';
    ctx.beginPath(); ctx.arc(cx-s*0.18,cy+s*0.28,s*0.26,0,Math.PI*2); ctx.fill();
    ctx.fillRect(cx+s*0.05,cy-s*0.45,s*0.1,s*0.75);
    if(!musicOn){ ctx.strokeStyle='#ff6a6a'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(cx-s*0.7,cy-s*0.7); ctx.lineTo(cx+s*0.7,cy+s*0.7); ctx.stroke(); }
    ctx.restore();
  }

  // wiersz sklepu: nazwa + status (cena / WYBIERZ / WYBRANE)
  function shopRow(type,it,y){
    const M=Math.min(W,H), w=W*0.86, h=M*0.082, cx=W/2, x=cx-w/2;
    const isOwned=owned.has(it.id);
    const isSel=(type==='pal'?selPal:selObs)===it.id;
    hits.push({x,y:y-h/2,w,h,action:()=>buyOrSelect(type,it)});
    ctx.save();
    rr(x,y-h/2,w,h,h*0.28);
    ctx.fillStyle='rgba(255,255,255,0.04)'; ctx.fill();
    ctx.lineWidth=2;
    ctx.strokeStyle = isSel?COL.seam : (isOwned?'rgba(244,250,255,0.22)':COL.gold);
    ctx.stroke();
    // skórka: dwie próbki kolorów
    let nameX=x+h*0.42;
    if(type==='pal'){
      ctx.fillStyle=it.yang; ctx.beginPath(); ctx.arc(x+h*0.45,y,h*0.16,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=it.yin;  ctx.beginPath(); ctx.arc(x+h*0.78,y,h*0.16,0,Math.PI*2); ctx.fill();
      nameX=x+h*1.15;
    }
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font='800 '+(h*0.3)+'px Arial,sans-serif';
    ctx.fillStyle=COL.seam; ctx.fillText(it.name,nameX,y);
    // status po prawej
    let st,stc;
    if(isSel){ st='WYBRANE'; stc=COL.seam; }
    else if(isOwned){ st='WYBIERZ'; stc='rgba(244,250,255,0.6)'; }
    else { st=it.price+' zł'; stc=(totalGold>=it.price?COL.gold:'rgba(255,210,74,0.35)'); }
    ctx.textAlign='right';
    ctx.fillStyle=stc; ctx.fillText(st,x+w-h*0.42,y);
    ctx.restore();
  }

  function drawShop(){
    const M=Math.min(W,H);
    ctx.fillStyle='rgba(5,6,13,0.86)'; ctx.fillRect(0,0,W,H);
    txt('SKLEP', W/2, H*0.09, M*0.075, COL.seam);
    txt('ZŁOTO: '+totalGold, W/2, H*0.145, M*0.04, COL.gold);
    let y=H*0.21;
    txt('RYBY — SKÓRKI', W/2, y, M*0.027, COL.dim,'700'); y+=M*0.055;
    for(const p of PALETTES){ shopRow('pal',p,y); y+=M*0.098; }
    btn('WRÓĆ', W/2, y+M*0.05, W*0.5, M*0.08, COL.yang, ()=>{ state='start'; });
  }

  // medalion yin-yang na Splocie
  function drawScore(){
    const r=Math.min(W,H)*0.082, cx=W/2, cy=seamY;
    ctx.save();
    // tarcza
    ctx.shadowColor=COL.seam; ctx.shadowBlur=reduce?0:16;
    ctx.fillStyle='rgba(5,6,13,0.92)';
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // obwódka: górna połowa = Yang, dolna = Yin
    ctx.lineWidth=Math.max(2.5,r*0.07); ctx.lineCap='round';
    ctx.strokeStyle=COL.yang;
    ctx.beginPath(); ctx.arc(cx,cy,r,Math.PI,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=COL.yin;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI); ctx.stroke();
    // liczba
    const sz=r*(score>=100?0.78:score>=10?0.95:1.1);
    ctx.shadowColor=COL.seam; ctx.shadowBlur=reduce?0:10;
    txt(score,cx,cy+r*0.02,sz,COL.seam);
    ctx.restore();
  }

  function draw(){
    ctx.save();
    hits=[];
    if(shake>0) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
    const t=performance.now()/1000;
    const drain=state==='over'?Math.min(deathT/1.3,1):0;

    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#081826'); g.addColorStop(0.49,'#05060d');
    g.addColorStop(0.51,'#05060d'); g.addColorStop(1,'#1c0a1d');
    ctx.fillStyle=g; ctx.fillRect(-40,-40,W+80,H+80);

    // tło — leniwie dryfujące drobinki w obu światach
    for(const a of ambient){
      ctx.globalAlpha=0.13*(1-drain);
      ctx.fillStyle=a.top?COL.yang:COL.yin;
      ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,6.2832); ctx.fill();
    }
    ctx.globalAlpha=1;

    // bariery wtapiają się w Splot — przycięte do swojej połowy
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,seamY); ctx.clip();
    for(const b of bars) if(b.lane==='A') drawBar(b);
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(0,seamY,W,H-seamY); ctx.clip();
    for(const b of bars) if(b.lane==='B') drawBar(b);
    ctx.restore();

    // złote bąbelki
    if(state==='play'){
      for(const o of gold){
        const spin=t*2.8+o.phase;
        const p=0.88+0.12*Math.sin(t*4+o.phase);
        ctx.save();
        ctx.translate(o.x,o.y);
        ctx.shadowColor=COL.gold; ctx.shadowBlur=reduce?0:22;
        ctx.fillStyle=COL.gold; ctx.globalAlpha=0.92;
        ctx.beginPath(); ctx.arc(0,0,o.r*p,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        // obracający się połysk (jak perła)
        const hx=Math.cos(spin)*o.r*0.3;
        const hy=Math.sin(spin)*o.r*0.3;
        ctx.fillStyle='rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(hx-o.r*0.08,hy-o.r*0.08,o.r*0.2,0,Math.PI*2); ctx.fill();
        // mniejszy drugi połysk po przeciwnej stronie
        ctx.fillStyle='rgba(255,220,100,0.5)';
        ctx.beginPath(); ctx.arc(-hx*0.5,-hy*0.5,o.r*0.1,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1;
        ctx.restore();
      }
    }

    // Splot — linia świata (ukryta w sklepie)
    if(state!=='shop'){
      ctx.save();
      const pulse=0.5+0.5*Math.sin(t*1.6);
      ctx.shadowColor=COL.seam; ctx.shadowBlur=reduce?0:(14+seamFlash*40+pulse*6);
      ctx.fillStyle=COL.seam; ctx.globalAlpha=(0.7+seamFlash*0.3)*(1-drain*0.7);
      ctx.fillRect(0,seamY-1,W,2);
      ctx.restore();
    }

    if(state==='play'){
      drawTrail(trailA,COL.yang); drawTrail(trailB,COL.yin);
      drawFish(playerX,ayA, dirA, COL.yang, COL.yin, t);   // Yang
      drawFish(W-playerX,ayB, -dirA, COL.yin, COL.yang, t); // Yin (odbicie)
    }

    // świat osuwa się w niepopad
    if(state==='over'){
      ctx.fillStyle='rgba(8,8,11,'+(0.82*drain)+')'; ctx.fillRect(0,0,W,H);
      const sx=deadLane==='A'?(W-playerX):playerX;
      const sink=Math.min(deathT,2)*H*0.05;
      const sy=(deadLane==='A'?ayB:ayA)+sink;
      const sGlow=deadLane==='A'?COL.yin:COL.yang;
      const sEye=deadLane==='A'?COL.yang:COL.yin;
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(deathT*0.8); ctx.translate(-sx,-sy);
      drawFish(sx,sy, 1, sGlow, sEye, t, Math.max(0,1-drain*0.85));
      ctx.restore();
    }

    for(const p of particles){
      ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,3.2,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;

    // unoszące się napisy (+5, harmonia)
    for(const f of floaters){
      ctx.globalAlpha=Math.max(0,Math.min(1,f.life*1.6));
      txt(f.text, f.x, f.y, Math.min(W,H)*(f.text[0]==='+'?0.045:0.04), f.color, '900');
    }
    ctx.globalAlpha=1;

    if(state==='play'){
      drawScore();
      const M=Math.min(W,H);
      // licznik złota
      const gx=W/2, gy=Math.max(40,H*0.055), ir=M*0.018;
      ctx.save();
      ctx.shadowColor=COL.gold; ctx.shadowBlur=reduce?0:10; ctx.fillStyle=COL.gold;
      ctx.beginPath(); ctx.arc(gx-ir*2.1,gy,ir,0,Math.PI*2); ctx.fill();
      ctx.restore();
      txt(goldCount, gx+ir*0.8, gy, M*0.04, COL.gold);
      // rekord (top score) u góry po lewej
      ctx.save();
      ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.font='700 '+(M*0.03)+'px '+'Arial,sans-serif';
      ctx.fillStyle=COL.dim;
      ctx.fillText('REKORD '+best, M*0.06, gy);
      ctx.restore();
      if(beat){
        const a=Math.min(1,beatT*2)*Math.min(1,(4.2-beatT)*1.2);
        ctx.globalAlpha=Math.max(0,a);
        wrap(beat, W/2, H*0.2, Math.min(W,H)*0.032, COL.seam, W*0.84);
        ctx.globalAlpha=1;
      }
    }

    if(state==='start' || state==='shop'){
      // żywe logo: dwie koi krążące wokół Splotu (za półprzezroczystym panelem HTML)
      const sway=Math.sin(t*0.8)*W*0.07;
      drawFish(W/2+sway, seamY-H*0.115, sway>=0?1:-1, COL.yang, COL.yin, t);
      drawFish(W/2-sway, seamY+H*0.115, sway>=0?-1:1, COL.yin, COL.yang, t);
    }

    if(state==='over' && deathT<1.5){
      ctx.globalAlpha=Math.min(1,deathT*1.6);
      txt('równowaga pękła', W/2, H*0.46, Math.min(W,H)*0.05, COL.seam,'700');
      ctx.globalAlpha=1;
    }

    ctx.restore();
  }

  function frame(tm){
    if(!last) last=tm;
    let dt=(tm-last)/1000; last=tm;
    if(dt>0.05) dt=0.05;
    update(dt); draw();
    // rozmyta kopia gry w listewkach po bokach
    if(bg.width>0 && bg.height>0) bgctx.drawImage(canvas, 0,0, bg.width, bg.height);
    requestAnimationFrame(frame);
  }

  function setTarget(cx){ const r=canvas.getBoundingClientRect(); targetX=clampX(cx-r.left); }
  function onDown(e){
    if(state!=='play') return;
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    targetX=clampX((e.touches?e.touches[0].clientX:e.clientX)-rect.left);
  }
  function onMove(e){ if(state!=='play') return; e.preventDefault(); const x=e.touches?e.touches[0].clientX:e.clientX; setTarget(x); }
  canvas.addEventListener('pointerdown',onDown,{passive:false});
  canvas.addEventListener('pointermove',onMove,{passive:false});
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{ last=0; });

  // —— kontroler UI (nakładki HTML) ——
  const $=id=>document.getElementById(id);
  const elMenu=$('menu'), elShop=$('shop'), elOver=$('over'), elMute=$('mute');
  let lastScreen='';
  function curScreen(){
    if(state==='play') return 'play';
    if(state==='over') return deathT>1.5?'over':'collapsing';
    return state; // start | shop
  }
  function syncUI(s){
    elMenu.style.display = s==='start'?'flex':'none';
    elShop.style.display = s==='shop'?'flex':'none';
    elOver.style.display = s==='over'?'flex':'none';
    if(s==='start') $('menuGold').textContent=totalGold;
    if(s==='shop') renderShop();
    if(s==='over'){
      $('overScore').textContent=score;
      $('overSub').textContent='świat trwał '+score+' chwil · rekord '+best;
      $('overGold').textContent='złoto z gry: '+goldCount+'  ·  bank: '+totalGold;
    }
  }
  function renderShop(){
    $('shopGold').textContent=totalGold;
    const list=$('shopList'); list.innerHTML='';
    for(const p of PALETTES){
      const owned=ownedHas(p.id), sel=selPal===p.id;
      const row=document.createElement('div');
      row.className='skin'+(sel?' selected':(owned?' owned':''));
      let status,cls;
      if(sel){ status='Wybrane'; cls='st-sel'; }
      else if(owned){ status='Wybierz'; cls='st-pick'; }
      else { status=p.price+' zł'; cls='st-price'+(totalGold>=p.price?'':' cant'); }
      row.innerHTML=
        '<div class="swatches"><span class="dot" style="background:'+p.yang+';color:'+p.yang+'"></span>'+
        '<span class="dot" style="background:'+p.yin+';color:'+p.yin+'"></span></div>'+
        '<div class="skin-name">'+p.name+'</div>'+
        '<div class="skin-status '+cls+'">'+status+'</div>';
      row.onclick=()=>{ sfx('click'); buyOrSelect('pal',p); renderShop(); };
      list.appendChild(row);
    }
  }
  function ownedHas(id){ return owned.has(id); }

  $('btnPlay').onclick =()=>{ sfx('click'); play(); };
  $('btnShop').onclick =()=>{ sfx('click'); state='shop'; };
  $('btnBack').onclick =()=>{ sfx('click'); state='start'; };
  $('btnAgain').onclick=()=>{ sfx('click'); play(); };
  $('btnShop2').onclick=()=>{ sfx('click'); bars=[];gold=[];floaters=[]; state='shop'; };
  elMute.onclick=()=>{ toggleMusic(); elMute.classList.toggle('off',!musicOn); };

  // dołącz do pętli: pokaż właściwą nakładkę przy zmianie ekranu
  const _frame=frame;
  frame=function(tm){ _frame(tm); const s=curScreen(); if(s!==lastScreen){ syncUI(s); lastScreen=s; } };

  loadSave();
  applyPalette();
  elMute.classList.toggle('off',!musicOn);
  resize();
  syncUI(curScreen());
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
