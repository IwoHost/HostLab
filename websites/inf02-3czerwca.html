<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INF02 — 3 czerwca</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../other/backbutton.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d0d0d;
  --surface:#111;
  --surface2:#161616;
  --border:#1e1e1e;
  --border2:#2a2a2a;
  --accent:#c8a96e;
  --accent2:#d4b87a;
  --text:#d4d0c8;
  --muted:#555;
  --muted2:#444;
  --green:#3a7a3a;
  --green-text:#6db86d;
  --red:#7a3a3a;
  --red-text:#c46a6a;
}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:14px;}

.app{max-width:680px;margin:0 auto;padding:32px 16px 80px;}

header{border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:28px;}
header h1{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:8px;color:var(--accent);}
.subtitle{font-size:11px;color:var(--muted);letter-spacing:3px;margin-top:4px;text-transform:uppercase;}

.stats{display:flex;gap:0;margin-bottom:28px;border:1px solid var(--border);}
.stat{flex:1;padding:12px 14px;border-right:1px solid var(--border);text-align:center;}
.stat:last-child{border-right:none;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--accent);display:block;}
.stat-lbl{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}

.progress-bar{height:2px;background:var(--border);margin-bottom:28px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);transition:width .4s ease;width:0%;}

.controls{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap;}
.btn{background:transparent;border:1px solid var(--border);color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:2px;padding:8px 14px;cursor:pointer;transition:all .15s;text-transform:uppercase;}
.btn:hover{border-color:var(--border2);color:var(--text);}
.btn.primary{border-color:var(--accent);color:var(--accent);}
.btn.primary:hover{background:var(--accent);color:#0d0d0d;}
.btn.active{background:var(--surface2);border-color:var(--border2);color:var(--text);}

.mode-indicator{font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:20px;padding:8px 0;border-bottom:1px solid var(--border);}
.mode-indicator span{color:var(--accent);}

.question-card{border:1px solid var(--border);background:var(--surface);margin-bottom:12px;}
.q-header{padding:16px 18px 12px;border-bottom:1px solid var(--border);}
.q-num{font-size:10px;color:var(--muted);letter-spacing:3px;margin-bottom:8px;}
.q-text{color:var(--text);line-height:1.6;font-size:13px;}
.q-tag{display:inline-block;font-size:9px;letter-spacing:2px;color:var(--muted);border:1px solid var(--border);padding:2px 7px;margin-top:8px;text-transform:uppercase;}

.options{padding:12px 0 0;}
.option{display:flex;align-items:flex-start;gap:12px;padding:11px 18px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;user-select:none;}
.option:last-child{border-bottom:none;}
.option:hover{background:var(--surface2);}
.opt-key{min-width:20px;color:var(--muted);font-size:12px;padding-top:1px;}
.opt-text{line-height:1.5;font-size:13px;color:var(--text);}

.option.correct{background:#0a1a0a;border-left:3px solid var(--green-text);}
.option.correct .opt-key{color:var(--green-text);}
.option.correct .opt-text{color:var(--green-text);}
.option.wrong{background:#1a0a0a;border-left:3px solid var(--red-text);}
.option.wrong .opt-key{color:var(--red-text);}
.option.wrong .opt-text{color:var(--red-text);}
.option.reveal-correct{background:#0a1a0a;border-left:3px solid var(--green-text);opacity:.7;}
.option.reveal-correct .opt-key,.option.reveal-correct .opt-text{color:var(--green-text);}

.explanation{border-top:1px solid var(--border);padding:14px 18px;background:#0a0a0a;font-size:12px;color:var(--muted2);line-height:1.7;display:none;}
.explanation.show{display:block;}
.explanation strong{color:var(--text);}
.explanation .why-ok{color:var(--green-text);display:block;margin-bottom:6px;}
.explanation .why-not{color:var(--muted);display:block;margin-left:12px;margin-top:3px;}

.quiz-nav{display:flex;gap:8px;justify-content:space-between;margin-top:24px;align-items:center;flex-wrap:wrap;}
.quiz-counter{font-size:11px;color:var(--muted);letter-spacing:2px;}

.result-screen{border:1px solid var(--border);background:var(--surface);padding:40px 24px;text-align:center;display:none;}
.result-screen.show{display:block;}
.result-big{font-family:'Bebas Neue',sans-serif;font-size:80px;color:var(--accent);line-height:1;}
.result-label{font-size:11px;color:var(--muted);letter-spacing:4px;margin-top:8px;margin-bottom:24px;}
.result-grade{font-size:13px;color:var(--text);margin-bottom:28px;letter-spacing:1px;}

#list-mode .question-card{margin-bottom:16px;}

.filter-bar{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
.filter-btn{font-size:10px;letter-spacing:2px;padding:6px 12px;border:1px solid var(--border);color:var(--muted);background:transparent;cursor:pointer;font-family:'Share Tech Mono',monospace;text-transform:uppercase;transition:all .15s;}
.filter-btn.on{border-color:var(--accent);color:var(--accent);background:#1a1508;}
.filter-btn:hover{border-color:var(--border2);color:var(--text);}

.kb-hint{font-size:10px;color:var(--muted2);letter-spacing:1px;margin-top:10px;}
.kb-hint kbd{border:1px solid var(--border2);padding:1px 5px;font-family:'Share Tech Mono',monospace;font-size:9px;color:var(--muted);}

@media(max-width:480px){
  .app{padding:20px 12px 80px;}
  header h1{font-size:24px;letter-spacing:6px;}
  .stats{flex-wrap:wrap;}
  .stat{min-width:50%;}
  .result-big{font-size:60px;}
}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>INF.02</h1>
    <div class="subtitle">Pytania z sesji -- 3 czerwca 2026</div>
  </header>

  <div class="stats">
    <div class="stat"><span class="stat-val" id="s-total">0</span><span class="stat-lbl">Wszystkich</span></div>
    <div class="stat"><span class="stat-val" id="s-done">0</span><span class="stat-lbl">Zrobionych</span></div>
    <div class="stat"><span class="stat-val" id="s-ok">0</span><span class="stat-lbl">Poprawnych</span></div>
    <div class="stat"><span class="stat-val" id="s-pct">--</span><span class="stat-lbl">Wynik</span></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>

  <div class="controls">
    <button class="btn primary" id="btn-quiz" onclick="setMode('quiz')">Quiz</button>
    <button class="btn" id="btn-list" onclick="setMode('list')">Przegladaj</button>
    <button class="btn" id="btn-shuffle" onclick="shuffleQ()">Losuj kolejnosc</button>
    <button class="btn" id="btn-reset" onclick="resetAll()">Reset</button>
  </div>

  <!-- QUIZ MODE -->
  <div id="quiz-mode">
    <div class="mode-indicator">TRYB QUIZ -- pytanie <span id="qm-num">1</span> z <span id="qm-total">0</span></div>
    <div id="quiz-card"></div>
    <div class="quiz-nav">
      <button class="btn" id="btn-prev" onclick="quizPrev()">&#8592; Poprzednie</button>
      <span class="quiz-counter" id="quiz-counter"></span>
      <button class="btn primary" id="btn-next" onclick="quizNext()">Nastepne &#8594;</button>
    </div>
    <div class="kb-hint">Klawiatura: <kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>D</kbd> -- wybierz odpowiedz &nbsp;|&nbsp; <kbd>&#8594;</kbd> nastepne &nbsp;|&nbsp; <kbd>&#8592;</kbd> poprzednie</div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="result-screen" id="result-screen">
    <div class="result-big" id="res-pct">--</div>
    <div class="result-label">poprawnych odpowiedzi</div>
    <div class="result-grade" id="res-grade"></div>
    <button class="btn primary" onclick="resetQuiz()">Zacznij od nowa</button>
  </div>

  <!-- LIST MODE -->
  <div id="list-mode" style="display:none;">
    <div class="mode-indicator">TRYB PRZEGLADANIA -- kliknij odpowiedz zeby sprawdzic</div>
    <div class="filter-bar">
      <button class="filter-btn on" data-cat="all" onclick="filterCat(this,'all')">Wszystkie</button>
      <button class="filter-btn" data-cat="siec" onclick="filterCat(this,'siec')">Siec</button>
      <button class="filter-btn" data-cat="system" onclick="filterCat(this,'system')">System</button>
      <button class="filter-btn" data-cat="sprz" onclick="filterCat(this,'sprz')">Sprzet</button>
      <button class="filter-btn" data-cat="inne" onclick="filterCat(this,'inne')">Inne</button>
    </div>
    <div id="list-container"></div>
  </div>

</div>

<a href="../index.html" class="back-home" title="Powrot do HostLab">
  <img src="../other/logo/HLab_Logo.png" alt="Home">
</a>

<script>
const QUESTIONS = [
  {
    q: "Na egzaminie pojawilo sie odejmowanie 115 - 15. Wykonujac to dzialanie na 8-bitowych liczbach binarnych bez znaku (01110011 - 00001111), jaki wynik binarny otrzymasz?",
    opts: ["01100100", "01100011", "01101100", "01000100"],
    ans: 0,
    cat: "inne",
    exp: {
      ok: "115 - 15 = 100. Binarnie: 64+32+4 = 2^6 + 2^5 + 2^2 = 01100100.",
      not: ["01100011 = 99 -- o 1 za malo", "01101100 = 108 -- bledne obliczenia", "01000100 = 68 -- bledne obliczenia"]
    }
  },
  {
    q: "Ktore urzadzenie tworzy osobne domeny kolizyjne na kazdym porcie, ale utrzymuje jedna domene rozgloszeniowa dla calej sieci?",
    opts: ["Hub", "Switch", "Router", "Repeater"],
    ans: 1,
    cat: "siec",
    exp: {
      ok: "Switch = kazdy port to osobna domena kolizyjna, ale caly switch to jedna domena rozgloszeniowa.",
      not: ["Hub -- jedna wspolna domena kolizyjna dla wszystkich portow", "Router -- dzieli zarowno domeny kolizyjne jak i rozgloszeniowe", "Repeater -- warstwa 1, regeneruje sygnal, nie dzieli domen"]
    }
  },
  {
    q: "Podczas dodawania drukarki w Windows wybrano opcje TCP/IP. Jaka informacje podasz, aby ja zainstalowac?",
    opts: ["Numer seryjny drukarki", "Adres IP drukarki", "Adres MAC komputera", "Numer modelu sterownika"],
    ans: 1,
    cat: "system",
    exp: {
      ok: "Port TCP/IP wymaga podania adresu IP (lub nazwy hosta) drukarki w sieci.",
      not: ["Numer seryjny -- nie jest potrzebny przy instalacji sieciowej", "MAC komputera -- nie ma zwiazku z konfiguracja drukarki", "Model sterownika -- wybierasz go pozniej z listy, nie przy konfiguracji portu"]
    }
  },
  {
    q: "Ktore oprogramowanie chroni komputer przed programami szpiegujacymi zbierajacymi dane bez wiedzy uzytkownika?",
    opts: ["Firewall", "Antyspyware", "Defragmentator dysku", "Kompresja danych"],
    ans: 1,
    cat: "inne",
    exp: {
      ok: "Antyspyware wykrywa i usuwa oprogramowanie szpiegujace (spyware), ktore zbiera dane bez zgody uzytkownika.",
      not: ["Firewall -- blokuje nieautoryzowany ruch sieciowy, nie usuwa spyware z dysku", "Defragmentator -- reorganizuje pliki na dysku, nie chroni prywatnosci", "Kompresja -- zmniejsza rozmiar plikow, nie chroni prywatnosci"]
    }
  },
  {
    q: "Kilka komputerow w sieci nie moze uzyskac adresu IP od serwera DHCP, mimo ze serwer dziala poprawnie. Jaka jest najprawdopodobniejsza przyczyna?",
    opts: ["Zbyt duze MTU na routerze", "Za mala pula adresow DHCP", "Wylaczony protokol DNS", "Brak aktualizacji systemu"],
    ans: 1,
    cat: "siec",
    exp: {
      ok: "Gdy pula adresow DHCP jest mniejsza niz liczba urzadzen w sieci, nowe urzadzenia nie dostana adresu IP.",
      not: ["MTU -- wplywa na fragmentacje pakietow, nie na przydzielanie adresow", "DNS -- brak DNS = nie dziala rozwiazywanie nazw, ale IP nadal jest przydzielane", "Aktualizacje -- nie maja zwiazku z pula DHCP"]
    }
  },
  {
    q: "Jak nazywa sie kopia zapasowa, ktora archiwizuje tylko pliki zmienione od ostatniej kopii pelnej LUB przyrostowej?",
    opts: ["Kopia pelna (Full)", "Kopia roznicowa (Differential)", "Kopia przyrostowa (Incremental)", "Kopia migawkowa (Snapshot)"],
    ans: 2,
    cat: "inne",
    exp: {
      ok: "Kopia przyrostowa = tylko zmiany od ostatniej operacji (pelnej lub przyrostowej). Szybka, ale przywracanie wymaga wielu kopii.",
      not: ["Kopia pelna -- zawiera wszystkie dane za kazdym razem", "Kopia roznicowa -- zmiany od ostatniej PELNEJ kopii (nie przyrostowej)", "Migawka -- zapis stanu systemu w danej chwili, nie klasyczna kopia"]
    }
  },
  {
    q: "Ktory program sluzy do przechwytywania i analizy pakietow w sieci (monitoring ruchu sieciowego)?",
    opts: ["Nmap", "Wireshark", "SuperPi", "HWiNFO"],
    ans: 1,
    cat: "siec",
    exp: {
      ok: "Wireshark to analizator protokolow sieciowych -- przechwytuje pakiety na interfejsie sieciowym i wyswietla ich zawartosc.",
      not: ["Nmap -- skanuje otwarte porty i uslugi w sieci", "SuperPi -- testuje wydajnosc procesora", "HWiNFO -- monitoruje temperature i parametry sprzetu"]
    }
  },
  {
    q: "Ktory element elektroniczny gromadzi i oddaje energie elektryczna, stosowany m.in. w zasilaczach i plytach glownych?",
    opts: ["Rezystor", "Tranzystor", "Kondensator", "Cewka indukcyjna"],
    ans: 2,
    cat: "sprz",
    exp: {
      ok: "Kondensator gromadzi energie w polu elektrycznym i oddaje ja gdy napiecie spada.",
      not: ["Rezystor -- ogranicza prad, zamienia energie na cieplo", "Tranzystor -- wzmacnia sygnal lub przelacza obwod", "Cewka indukcyjna -- magazynuje energie w polu magnetycznym (nie elektrycznym)"]
    }
  },
  {
    q: "Ktory urzad w Polsce sprawuje nadzor nad przestrzeganiem przepisow o ochronie danych osobowych (RODO)?",
    opts: ["UOKiK", "UODO (Urzad Ochrony Danych Osobowych)", "GUS", "KNF"],
    ans: 1,
    cat: "inne",
    exp: {
      ok: "UODO (Urzad Ochrony Danych Osobowych) to polski organ nadzorczy ds. RODO, powolany ustawa z 10 maja 2018 r.",
      not: ["UOKiK -- ochrona konsumentow i konkurencji, nie danych osobowych", "GUS -- statystyki, nie ochrona danych", "KNF -- nadzor nad rynkiem finansowym"]
    }
  },
  {
    q: "Siec 192.168.0.0/24 jest dzielona na podsieci /27. Ile podsieci powstanie?",
    opts: ["4", "6", "8", "16"],
    ans: 2,
    cat: "siec",
    exp: {
      ok: "/24 do /27: pozyczamy 3 bity hosta (27-24=3). 2^3 = 8 podsieci.",
      not: ["4 -- to byloby /26 (2 bity)", "6 -- nie jest potega dwojki, niemozliwe", "16 -- to byloby /28 (4 bity)"]
    }
  },
  {
    q: "Ktore z ponizszych zachowan NIE zapewnia bezpieczenstwa konta uzytkownika?",
    opts: ["Uzywanie uwierzytelniania dwuskladnikowego (2FA)", "Regularne aktualizacje systemu operacyjnego", "Ustawianie krotkiego hasla skladajacego sie tylko z liter", "Stosowanie menedzera hasel"],
    ans: 2,
    cat: "inne",
    exp: {
      ok: "Krotkie haslo z samymi literami jest podatne na ataki slownikowe i brute-force -- jest zla praktyka bezpieczenstwa.",
      not: ["2FA -- dodaje druga warstwe ochrony", "Aktualizacje -- eliminuja znane podatnosci", "Menedzer hasel -- umozliwia uzywanie dlugich, unikalnych hasel"]
    }
  },
  {
    q: "Co oznacza technologia MIMO 3x3 w specyfikacji punktu dostepowego Wi-Fi?",
    opts: ["Maksymalna liczba jednoczesnych uzytkownikow wynosi 3", "Urzadzenie nadaje na 3 roznych czestotliwosciach", "3 anteny nadawcze i 3 anteny odbiorcze do rownolegla transmisji strumieni", "Automatyczne przelaczanie miedzy 3 poziomami szyfrowania"],
    ans: 2,
    cat: "siec",
    exp: {
      ok: "MIMO = Multiple Input Multiple Output. 3x3 = 3 anteny TX + 3 anteny RX. Pozwala na rownolegla transmisje wielu strumieni danych, zwiekszajac przepustowosc.",
      not: ["Liczba uzytkownikow -- nie ma zwiazku z MIMO", "Rozne czestotliwosci -- to dual-band/tri-band, nie MIMO", "Szyfrowanie -- WPA2/WPA3, niezwiazane z MIMO"]
    }
  },
  {
    q: "Na obrazku pokazano interfejs oprogramowania do wirtualizacji z charakterystycznym pomaranczowym logo. Co to za program?",
    opts: ["VMware Workstation", "VirtualBox", "Hyper-V", "QEMU"],
    ans: 1,
    cat: "sprz",
    exp: {
      ok: "Oracle VirtualBox ma charakterystyczne pomaranczowe logo i typowy uklad panelu z lista maszyn wirtualnych po lewej stronie.",
      not: ["VMware -- szaro-niebieski interfejs, inne logo", "Hyper-V -- wbudowany w Windows Server, interfejs w Menedzerze Hyper-V", "QEMU -- glownie narzedzie konsolowe, rzadko GUI"]
    }
  },
  {
    q: "Siec 192.168.1.0/24 jest podzielona na dwie podsieci /25. Ktory adres drugiej podsieci (192.168.1.128/25) jest identyczny z adresem rozgloszeniowym oryginalnej sieci /24?",
    opts: ["Adres sieci (192.168.1.128)", "Adres rozgloszeniowy (192.168.1.255)", "Maska podsieci", "Adres bramy domyslnej"],
    ans: 1,
    cat: "siec",
    exp: {
      ok: "Broadcast drugiej podsieci /25 to 192.168.1.255 -- taki sam jak broadcast oryginalnej sieci /24. Adres sieci zmienil sie (.0 na .128), maska sie zmienila.",
      not: ["Adres sieci -- zmieniil sie z .0 na .128", "Maska -- zmienila sie z /24 na /25", "Brama -- konfigurowana recznie, nie wynika z podzialu"]
    }
  },
  {
    q: "W ktorym narzedziu Windows mozna sprawdzic godziny logowan uzytkownikow do systemu?",
    opts: ["Menedzer urzadzen", "Podglad zdarzen (Event Viewer)", "Menedzer dyskow", "msconfig"],
    ans: 1,
    cat: "system",
    exp: {
      ok: "Podglad zdarzen (eventvwr.msc) rejestruje zdarzenia systemowe, w tym logowania (ID 4624) z data i godzina.",
      not: ["Menedzer urzadzen -- sterowniki i sprzet", "Menedzer dyskow -- partycje i woluminy", "msconfig -- zarzadzanie uslugami i autostartami"]
    }
  },
  {
    q: "Ktore oprogramowanie sluzy do testowania wydajnosci procesora poprzez obliczanie liczby Pi do miliona miejsc po przecinku?",
    opts: ["CPU-Z", "HWiNFO", "SuperPi", "CrystalDiskMark"],
    ans: 2,
    cat: "sprz",
    exp: {
      ok: "SuperPi obciaza procesor intensywnymi obliczeniami matematycznymi -- czas obliczen jest miara wydajnosci CPU.",
      not: ["CPU-Z -- wyswietla parametry procesora i RAM (nie testuje)", "HWiNFO -- monitoruje temperatury i napiecia sprzetu", "CrystalDiskMark -- benchmark predkosci dysku (nie CPU)"]
    }
  },
  {
    q: "Ktore urzadzenie sieciowe laczy siec lokalna (LAN) z internetem?",
    opts: ["Switch", "Hub", "Router", "Access Point"],
    ans: 2,
    cat: "siec",
    exp: {
      ok: "Router trasuje pakiety miedzy roznymi sieciami -- laczy LAN z internetem (WAN) i zarzadza ruchem.",
      not: ["Switch -- przelacza ruch w obrebie jednej sieci LAN", "Hub -- wzmacnia i rozdziela sygnal w sieci LAN", "Access Point -- zapewnia lacznosc bezprzewodowa w sieci LAN"]
    }
  },
  {
    q: "Ktory element plyty glownej przechowuje ustawienia BIOS/UEFI (data, godzina, kolejnosc bootowania) gdy komputer jest wylaczony?",
    opts: ["Pamiec RAM", "Pamiec ROM procesora", "Uklad CMOS zasilany bateria CR2032", "Dysk twardy"],
    ans: 2,
    cat: "sprz",
    exp: {
      ok: "Pamiec CMOS zasilana bateria litowa CR2032 przechowuje ustawienia BIOS nawet bez glownego zasilania. Wyczerpana bateria = reset ustawien.",
      not: ["RAM -- pamiec ulotna, traci dane po wylaczeniu zasilania", "ROM procesora -- przechowuje mikrokod CPU, nie ustawienia BIOS", "Dysk twardy -- przechowuje system i dane, nie ustawienia BIOS"]
    }
  },
  {
    q: "Jakie urzadzenie diagnostyczne sluzy do testowania plyty glownej i wskazywania bledow POST za pomoca kodow na malym wyswietlaczu?",
    opts: ["Multimetr cyfrowy (DMM)", "Karta POST (tester plyty glownej)", "Oscyloskop", "Analizator sieci"],
    ans: 1,
    cat: "sprz",
    exp: {
      ok: "Karta POST (POST card) wkladana w slot PCI/PCI-E wyswietla kody bledow POST -- pozwala zdiagnozowac co uniemozliwia uruchomienie systemu.",
      not: ["Multimetr -- mierzy napiecia, prad, opor -- nie diagnozuje bledow POST", "Oscyloskop -- wizualizuje sygnaly elektryczne na osi czasu", "Analizator sieci -- monitoruje ruch sieciowy"]
    }
  },
  {
    q: "Ktore urzadzenie umozliwia podlaczenie wielu peryferow (mysz, klawiatura, pendrive) do laptopa przez jedno zlacze USB?",
    opts: ["Router bezprzewodowy", "Switch sieciowy", "USB Hub", "Access Point"],
    ans: 2,
    cat: "sprz",
    exp: {
      ok: "USB Hub rozszerza jedno gniazdo USB na kilka -- pozwala podlaczyc wiele urzadzen jednoczesnie, szczegolnie przydatny w laptopach z ograniczona liczba portow.",
      not: ["Router bezprzewodowy -- zarzadza ruchem sieciowym, nie peryferiami", "Switch sieciowy -- przelacza ruch Ethernet, nie USB", "Access Point -- zapewnia Wi-Fi, nie polaczenia USB"]
    }
  },
  {
    q: "Minimalne wymagania sprzettowe programu to: procesor 2 GHz, RAM 4 GB, miejsce na dysku 20 GB. Ktory zestaw spelnia te wymagania?",
    opts: ["CPU 1.5 GHz, RAM 2 GB, HDD 15 GB", "CPU 2.4 GHz, RAM 8 GB, SSD 50 GB", "CPU 2.0 GHz, RAM 3 GB, HDD 20 GB", "CPU 1.8 GHz, RAM 4 GB, SSD 20 GB"],
    ans: 1,
    cat: "sprz",
    exp: {
      ok: "2.4 GHz >= 2 GHz, 8 GB >= 4 GB, 50 GB >= 20 GB -- wszystkie parametry spelniaja lub przekraczaja minimalne wymagania.",
      not: ["A -- CPU 1.5 GHz, RAM 2 GB i 15 GB -- nie spelnia zadnego wymagania", "C -- RAM 3 GB < 4 GB -- nie spelnia wymagania pamieci", "D -- CPU 1.8 GHz < 2 GHz -- nie spelnia wymagania procesora"]
    }
  }
];

let mode = 'quiz';
let order = [...Array(QUESTIONS.length).keys()];
let qIdx = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let listAnswers = {};
let currentCat = 'all';

function init() {
  updateStats();
  setMode('quiz');
}

function updateStats() {
  const total = QUESTIONS.length;
  const done = answers.filter(a => a !== null).length;
  const ok = answers.reduce((acc, a, i) => {
    if (a === null) return acc;
    return acc + (a === QUESTIONS[order[i]].ans ? 1 : 0);
  }, 0);
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-ok').textContent = ok;
  document.getElementById('s-pct').textContent = done > 0 ? Math.round(ok/done*100)+'%' : '--';
  document.getElementById('prog-fill').style.width = (done / total * 100) + '%';
}

function setMode(m) {
  mode = m;
  document.getElementById('quiz-mode').style.display = m === 'quiz' ? 'block' : 'none';
  document.getElementById('list-mode').style.display = m === 'list' ? 'block' : 'none';
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('btn-quiz').classList.toggle('primary', m === 'quiz');
  document.getElementById('btn-list').classList.toggle('primary', m === 'list');
  document.getElementById('btn-quiz').classList.toggle('active', m === 'quiz');
  document.getElementById('btn-list').classList.toggle('active', m === 'list');
  if (m === 'quiz') renderQuizCard();
  if (m === 'list') renderList();
}

function renderQuizCard() {
  const q = QUESTIONS[order[qIdx]];
  const sel = answers[qIdx];
  const revealed = sel !== null;
  const total = order.length;

  document.getElementById('qm-num').textContent = qIdx + 1;
  document.getElementById('qm-total').textContent = total;
  document.getElementById('quiz-counter').textContent = (qIdx+1) + ' / ' + total;

  const keys = ['A','B','C','D'];
  let optsHTML = q.opts.map((o, i) => {
    let cls = 'option';
    if (revealed) {
      if (i === q.ans) cls += ' correct';
      else if (i === sel) cls += ' wrong';
    }
    return '<div class="' + cls + '" onclick="' + (revealed ? '' : 'pickAnswer('+i+')') + '" data-i="' + i + '">' +
      '<span class="opt-key">' + keys[i] + '</span>' +
      '<span class="opt-text">' + o + '</span>' +
      '</div>';
  }).join('');

  let expHTML = '';
  if (revealed && q.exp) {
    const notHTML = q.exp.not.map(n => '<span class="why-not">-- ' + n + '</span>').join('');
    expHTML = '<div class="explanation show"><span class="why-ok">OK: ' + q.exp.ok + '</span>' + notHTML + '</div>';
  }

  document.getElementById('quiz-card').innerHTML =
    '<div class="question-card">' +
      '<div class="q-header">' +
        '<div class="q-num">PYTANIE ' + (qIdx+1) + ' / ' + total + '</div>' +
        '<div class="q-text">' + q.q + '</div>' +
        '<span class="q-tag">' + catLabel(q.cat) + '</span>' +
      '</div>' +
      '<div class="options">' + optsHTML + '</div>' +
      expHTML +
    '</div>';
}

function pickAnswer(i) {
  if (answers[qIdx] !== null) return;
  answers[qIdx] = i;
  updateStats();
  renderQuizCard();
}

function quizNext() {
  if (qIdx < order.length - 1) { qIdx++; renderQuizCard(); }
  else showResult();
}

function quizPrev() {
  if (qIdx > 0) { qIdx--; renderQuizCard(); }
}

function showResult() {
  document.getElementById('quiz-mode').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';
  const done = answers.filter(a => a !== null).length;
  const ok = answers.reduce((acc, a, i) => acc + (a !== null && a === QUESTIONS[order[i]].ans ? 1 : 0), 0);
  const pct = done > 0 ? Math.round(ok/done*100) : 0;
  document.getElementById('res-pct').textContent = pct + '%';
  let grade = pct >= 90 ? 'Swietnie! Zdasz bez problemu.' :
              pct >= 75 ? 'Dobrze! Jeszcze troche powtarzania.' :
              pct >= 50 ? 'Polowa -- powtorz slabsze tematy.' :
                          'Trzeba jeszcze pocwiczyc.';
  document.getElementById('res-grade').textContent = ok + ' / ' + done + ' poprawnych -- ' + grade;
}

function resetQuiz() {
  answers = new Array(QUESTIONS.length).fill(null);
  qIdx = 0;
  updateStats();
  setMode('quiz');
}

function renderList() {
  const container = document.getElementById('list-container');
  const filtered = QUESTIONS.filter(q => currentCat === 'all' || q.cat === currentCat);
  const keys = ['A','B','C','D'];
  container.innerHTML = filtered.map((q, fi) => {
    const gi = QUESTIONS.indexOf(q);
    const sel = listAnswers[gi];
    const revealed = sel !== undefined;
    const optsHTML = q.opts.map((o, i) => {
      let cls = 'option';
      if (revealed) {
        if (i === q.ans) cls += i === sel ? ' correct' : ' reveal-correct';
        else if (i === sel) cls += ' wrong';
      }
      return '<div class="' + cls + '" onclick="listPick(' + gi + ',' + i + ')">' +
        '<span class="opt-key">' + keys[i] + '</span>' +
        '<span class="opt-text">' + o + '</span>' +
        '</div>';
    }).join('');
    let expHTML = '';
    if (revealed && q.exp) {
      const notHTML = q.exp.not.map(n => '<span class="why-not">-- ' + n + '</span>').join('');
      expHTML = '<div class="explanation show"><span class="why-ok">OK: ' + q.exp.ok + '</span>' + notHTML + '</div>';
    }
    return '<div class="question-card">' +
      '<div class="q-header">' +
        '<div class="q-num">PYTANIE ' + (fi+1) + '</div>' +
        '<div class="q-text">' + q.q + '</div>' +
        '<span class="q-tag">' + catLabel(q.cat) + '</span>' +
      '</div>' +
      '<div class="options">' + optsHTML + '</div>' +
      expHTML +
    '</div>';
  }).join('');
}

function listPick(gi, i) {
  if (listAnswers[gi] !== undefined) return;
  listAnswers[gi] = i;
  renderList();
}

function filterCat(el, cat) {
  currentCat = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('on', b === el));
  renderList();
}

function catLabel(c) {
  return {siec:'Siec',system:'System',sprz:'Sprzet',inne:'Inne'}[c] || c;
}

function shuffleQ() {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  answers = new Array(QUESTIONS.length).fill(null);
  qIdx = 0;
  updateStats();
  if (mode === 'quiz') renderQuizCard();
  else renderList();
}

function resetAll() {
  answers = new Array(QUESTIONS.length).fill(null);
  listAnswers = {};
  qIdx = 0;
  order = [...Array(QUESTIONS.length).keys()];
  updateStats();
  if (mode === 'quiz') renderQuizCard();
  else renderList();
}

document.addEventListener('keydown', e => {
  if (mode !== 'quiz') return;
  const map = {a:0,b:1,c:2,d:3,A:0,B:1,C:2,D:3};
  if (e.key in map) pickAnswer(map[e.key]);
  if (e.key === 'ArrowRight') quizNext();
  if (e.key === 'ArrowLeft') quizPrev();
});

init();
</script>
</body>
</html>
