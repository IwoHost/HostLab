<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pliki Wsadowe CMD — HostLab Study</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../other/logo/HLab_Logo.png">
<link rel="stylesheet" href="../other/backbutton.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0900;--surface:#130e00;--surface2:#181100;
  --border:#2e1e00;--border2:rgba(255,179,0,.06);
  --amber:#ffb300;--dim:#885500;--green:#00ff41;
  --text:#f0d890;--muted:#5a3a00;--err:#ff2828;
  --font:'Share Tech Mono',monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;animation:flicker 10s infinite}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.12) 3px,rgba(0,0,0,.12) 4px);pointer-events:none;z-index:9000}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%);pointer-events:none;z-index:8999}
@keyframes flicker{0%,90%,100%{opacity:1}91%{opacity:.88}93%{opacity:1}95%{opacity:.92}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes scanIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.topbar{
  flex-shrink:0;padding:10px 20px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  background:var(--surface);position:relative;z-index:100;
}
.topbar-logo{font-size:10px;letter-spacing:.2em;color:var(--dim);margin-right:auto}
.topbar-logo span{color:var(--amber)}
.chapter-tabs{display:flex;gap:2px;margin-right:8px}
.ch-tab{background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--font);font-size:9px;letter-spacing:.15em;padding:5px 12px;cursor:pointer;transition:all .15s;text-transform:uppercase}
.ch-tab:hover{border-color:var(--dim);color:var(--text)}
.ch-tab.ch-active{border-color:var(--amber);color:var(--amber)}
.lesson-nav{display:flex;align-items:center;gap:10px}
.nav-btn{
  background:none;border:1px solid var(--border);color:var(--muted);
  font-family:var(--font);font-size:11px;padding:5px 14px;
  cursor:pointer;transition:all .15s;letter-spacing:.1em;
}
.nav-btn:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.lesson-counter{font-size:11px;color:var(--dim);letter-spacing:.12em;min-width:80px;text-align:center}
.progress-wrap{width:120px;height:3px;background:var(--border)}
.progress-fill{height:100%;background:var(--amber);transition:width .4s ease;box-shadow:0 0 6px rgba(255,179,0,.4)}

.lesson-bar{
  flex-shrink:0;padding:10px 20px;
  border-bottom:1px solid var(--border);
  background:var(--surface2);position:relative;z-index:50;
}
.lesson-title{font-size:11px;color:var(--amber);letter-spacing:.1em;margin-bottom:4px}
.lesson-task{font-size:11px;color:var(--text);letter-spacing:.04em;line-height:1.55}
.lesson-task code{color:var(--amber);background:rgba(255,179,0,.08);padding:1px 5px}

.split{flex:1;display:flex;overflow:hidden;position:relative;z-index:10}

.editor-panel{
  width:46%;flex-shrink:0;
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);background:var(--bg);
}
.panel-header{
  padding:7px 14px;border-bottom:1px solid var(--border);
  font-size:9px;letter-spacing:.25em;color:var(--muted);
  text-transform:uppercase;display:flex;align-items:center;gap:8px;
  background:var(--surface);flex-shrink:0;
}
.panel-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.panel-dot.lit{background:var(--amber);box-shadow:0 0 4px rgba(255,179,0,.5)}
.editor-body{flex:1;display:flex;overflow:hidden}
.line-nums{
  padding:12px 0;background:var(--surface);
  border-right:1px solid var(--border);min-width:38px;
  font-size:12px;color:var(--muted);line-height:1.6;
  text-align:right;overflow:hidden;flex-shrink:0;user-select:none;
}
.line-nums div{padding:0 8px 0 4px}
textarea#editor{
  flex:1;background:var(--bg);color:var(--amber);
  font-family:var(--font);font-size:12px;line-height:1.6;
  padding:12px 14px;border:none;outline:none;resize:none;
  caret-color:var(--amber);tab-size:2;overflow-y:auto;
  white-space:pre;overflow-x:auto;
}
textarea#editor::selection{background:rgba(255,179,0,.15)}

.terminal-panel{flex:1;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;}
#output{
  flex:1;padding:14px 18px;font-size:12px;line-height:1.65;
  overflow-y:auto;overflow-x:auto;white-space:pre-wrap;word-break:break-word;
}
.line-out{color:var(--text)}
.line-err{color:var(--err)}
.line-sys{color:var(--dim)}
.line-ok{color:var(--amber)}
.cursor-line::after{content:'_';animation:blink 1s infinite;color:var(--amber)}

.bottom-bar{
  flex-shrink:0;padding:9px 20px;
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
  background:var(--surface);position:relative;z-index:50;
}
.btn{
  font-family:var(--font);font-size:11px;letter-spacing:.1em;
  padding:7px 18px;border:1px solid var(--border);
  background:none;color:var(--muted);cursor:pointer;transition:all .15s;
}
.btn-run{border-color:var(--amber);color:var(--amber)}
.btn-run:hover{background:var(--amber);color:var(--bg)}
.btn:hover:not(.btn-run){border-color:var(--dim);color:var(--text)}
.btn-sep{flex:1}
.status-msg{font-size:10px;letter-spacing:.12em;color:var(--muted);transition:color .3s}
.status-msg.ok{color:var(--amber)}
.status-msg.err{color:var(--err)}

.hint-box{
  position:absolute;bottom:64px;right:20px;max-width:310px;
  background:var(--surface2);border:1px solid var(--border);
  padding:14px 16px;font-size:11px;color:var(--text);line-height:1.65;
  z-index:300;display:none;
}
.hint-box.show{display:block}
.hint-box b{color:var(--amber)}
.hint-close{position:absolute;top:6px;right:10px;cursor:pointer;color:var(--muted);font-size:13px}
.hint-close:hover{color:var(--text)}

.success-overlay{
  position:fixed;inset:0;background:rgba(14,9,0,.92);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:5000;
}
.success-overlay.show{display:flex}
.success-box{
  border:1px solid var(--amber);padding:40px 56px;
  text-align:center;position:relative;background:var(--surface);
}
.success-box::before{content:'';position:absolute;inset:6px;border:1px solid var(--border2)}
.success-title{font-size:32px;color:var(--amber);letter-spacing:.08em;text-shadow:0 0 20px rgba(255,179,0,.4);margin-bottom:12px}
.success-msg{font-size:11px;color:var(--muted);letter-spacing:.04em;line-height:1.65;max-width:380px}
.success-next{
  margin-top:24px;font-size:11px;border:1px solid var(--amber);
  color:var(--amber);padding:10px 28px;cursor:pointer;
  background:none;font-family:var(--font);letter-spacing:.12em;transition:all .15s;
}
.success-next:hover{background:var(--amber);color:var(--bg)}

@media(max-width:700px){
  .split{flex-direction:column}
  .editor-panel{width:100%;height:45%;border-right:none;border-bottom:1px solid var(--border)}
  .progress-wrap{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">HOST<span>·</span>LAB // CMD</div>
  <div class="chapter-tabs">
    <button class="ch-tab ch-active" id="ch0-btn" onclick="switchChapter(0)">R1: PODSTAWY</button>
    <button class="ch-tab" id="ch1-btn" onclick="switchChapter(1)">R2: EGZAMIN</button>
  </div>
  <div class="lesson-nav">
    <button class="nav-btn" id="btn-prev" onclick="goLesson(currentLesson-1)">&#8592; PREV</button>
    <span class="lesson-counter" id="lesson-counter">1 / 10</span>
    <button class="nav-btn" id="btn-next" onclick="goLesson(currentLesson+1)">NEXT &#8594;</button>
    <div class="progress-wrap"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
</div>

<div class="lesson-bar" id="lesson-bar">
  <div class="lesson-title" id="lesson-title"></div>
  <div class="lesson-task" id="lesson-task"></div>
</div>

<div class="split">
  <div class="editor-panel">
    <div class="panel-header">
      <div class="panel-dot lit"></div>
      <span>EDYTOR — skrypt.bat</span>
    </div>
    <div class="editor-body">
      <div class="line-nums" id="line-nums"></div>
      <textarea id="editor" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></textarea>
    </div>
  </div>
  <div class="terminal-panel">
    <div class="panel-header">
      <div class="panel-dot"></div>
      <span>WIERSZ POLECEŃ — WYJŚCIE</span>
    </div>
    <div id="output"><span class="line-sys">// Napisz skrypt i kliknij URUCHOM</span>
<span class="cursor-line"></span></div>
  </div>
</div>

<div class="bottom-bar">
  <button class="btn btn-run" onclick="runScript()" title="Uruchom (Ctrl+Enter)">&#9654; URUCHOM</button>
  <button class="btn" onclick="resetEditor()">&#8635; RESETUJ</button>
  <button class="btn" onclick="showHint()">? PODPOWIEDŹ</button>
  <div class="btn-sep"></div>
  <span class="status-msg" id="status-msg">GOTOWY</span>
</div>

<div class="hint-box" id="hint-box">
  <span class="hint-close" onclick="hideHint()">&#x2715;</span>
  <span id="hint-text"></span>
</div>

<div class="success-overlay" id="success-overlay">
  <div class="success-box">
    <div class="success-title">ZALICZONE_</div>
    <div class="success-msg" id="success-msg"></div>
    <button class="success-next" id="success-next-btn">NASTĘPNA LEKCJA &#8594;</button>
  </div>
</div>

<a href="../pages/study.html" class="back-home" title="Study">
  <img src="../other/logo/HLab_Logo.png" alt="HostLab">
</a>

<script>
// ─── CHAPTER 1 LESSONS ─────────────────────────────────────────────────
const LESSONS_CH1 = [
  {
    title: 'LEKCJA 1 — PIERWSZY SKRYPT .BAT',
    task: 'Każdy skrypt .bat zaczyna się od <code>@echo off</code> — wyłącza pokazywanie komend. Użyj <code>echo</code> żeby wypisać <b>Witaj, świecie!</b>',
    starter: '@echo off\n:: Wypisz: Witaj, swiecie!\n\n',
    hint: '<b>@echo off</b> — @ ukrywa tę linię, echo off wyłącza pokazywanie pozostałych poleceń\n<b>echo tekst</b> — wypisuje tekst\n<b>echo.</b> — wypisuje pustą linię\n\nBez @echo off CMD pokazywałby każdą komendę przed wykonaniem.',
    check: (code, out) => out.toLowerCase().includes('witaj'),
    ok: '@echo off to obowiązkowy nagłówek pliku .bat. Bez niego CMD wyświetla każdą linię kodu.'
  },
  {
    title: 'LEKCJA 2 — ZMIENNE SET',
    task: 'Utwórz zmienną <code>set imie=Jan</code> i wypisz ją przez <code>echo Cześć, %imie%!</code>. W CMD zmienne odczytujemy przez <code>%NAZWA%</code>.',
    starter: '@echo off\n:: Utwórz zmienną imie z wartością Jan\n\n:: Wypisz: Czesc, %imie%!\n\n',
    hint: '<b>set ZMIENNA=wartość</b> — przypisanie (bez spacji!)\n<b>%ZMIENNA%</b> — odczyt zmiennej\n\n⚠ Uważaj na spacje:\n<b>set x=5</b> ✓\n<b>set x = 5</b> ✗ (spacja wchodzi w wartość!)\n\n<b>set</b> (bez argumentów) — lista wszystkich zmiennych',
    check: (code, out) => (out.toLowerCase().includes('czesc') || out.toLowerCase().includes('cześć') || /jan/i.test(out)) && /set\s+\w+=/i.test(code) && /%\w+%/.test(code),
    ok: 'Zmienne CMD: set NAZWA=wartość (przypisanie), %NAZWA% (odczyt). Bez spacji wokół = !'
  },
  {
    title: 'LEKCJA 3 — ZMIENNE LICZBOWE',
    task: 'Utwórz zmienne <code>set /a wynik=10+5</code>. Flaga <code>/a</code> włącza tryb arytmetyczny. Wypisz wynik i oblicz kilka działań.',
    starter: '@echo off\n:: Oblicz suma = 10+5, iloczyn = 4*3, reszta = 17%%3\n:: (użyj set /a)\n\n\n:: Wypisz: Suma: %suma%\n\n:: Wypisz: Iloczyn: %iloczyn%\n\n:: Wypisz: Reszta: %reszta%\n\n',
    hint: '<b>set /a wynik=wyrażenie</b> — arytmetyka\nOperatory: + - * / %%\n\n⚠ W pliku .bat modulo to <b>%%</b> (podwójny %)\nW CMD (ręcznie) to tylko <b>%</b>\n\n<b>set /a x=x+1</b> — inkrementacja',
    check: (code, out) => out.includes('Suma:') && out.includes('15') && /set\s+\/a/i.test(code),
    ok: 'set /a włącza arytmetykę. W plikach .bat modulo to %% (podwójny procent, bo % sam służy do zmiennych).'
  },
  {
    title: 'LEKCJA 4 — WARUNEK IF',
    task: 'Sprawdź czy plik istnieje używając <code>if exist</code>. Struktura:\n<code>if exist plik.txt (echo Istnieje) else (echo Brak)</code>\nLub sprawdź wartość zmiennej: <code>if %x%==5 echo Tak</code>',
    starter: '@echo off\nset x=10\n:: Napisz warunek if sprawdzający czy x gtr 5\n:: Jeśli tak: wypisz "Liczba wieksza od 5"\n:: Jeśli nie: wypisz "Liczba mniejsza lub rowna 5"\n\n',
    hint: 'Operatory porównania (tylko te słowa kluczowe!):\n<b>equ</b> (==) | <b>neq</b> (!=) | <b>lss</b> (&lt;) | <b>gtr</b> (&gt;) | <b>leq</b> (&lt;=) | <b>geq</b> (&gt;=)\n\n⚠ W CMD NIE używamy &lt;, &gt;, &lt;=, &gt;= jak w C/Python/Bash!\nTylko: <b>equ neq lss gtr leq geq</b>\n\nSprawdzanie pliku:\n<b>if exist plik.txt echo OK</b>',
    check: (code, out) => (out.includes('wieksza') || out.includes('większa') || out.includes('mniejsza')) && /\bif\b.+\b(gtr|lss|equ|neq|geq|leq)\b/i.test(code),
    ok: 'IF w CMD: operatory equ/neq/lss/gtr/leq/geq. Bloki wieloliniowe przez nawiasy ( ).'
  },
  {
    title: 'LEKCJA 5 — PĘTLA FOR (LISTA)',
    task: 'Wypisz kolory z listy używając pętli for:\n<code>for %%i in (czerwony zielony niebieski) do echo Kolor: %%i</code>\nW pliku .bat używamy <code>%%i</code>, w CMD ręcznie tylko <code>%i</code>.',
    starter: '@echo off\n:: Napisz pętlę for po liście: czerwony zielony niebieski\n:: Wypisz: "Kolor: %%i" dla każdego\n\n',
    hint: '<b>for %%i in (lista) do polecenie</b>\n\nW .bat: <b>%%i</b> (podwójny %)\nW CMD ręcznie: <b>%i</b> (pojedynczy %)\n\nWieloliniowy blok:\n<b>for %%i in (a b c) do (\n  echo %%i\n)</b>',
    check: (code, out) => ['czerwony','zielony','niebieski'].every(c => out.toLowerCase().includes(c)) && /for\s+%%\w/i.test(code),
    ok: 'Pętla for w .bat: %%i (podwójny %), w CMD ręcznie %i. Zawsze pamiętaj o tej różnicy!'
  },
  {
    title: 'LEKCJA 6 — PĘTLA FOR (ZAKRES)',
    task: 'Wypisz liczby od 1 do 5 używając zakresu:\n<code>for /l %%i in (1,1,5) do echo Liczba: %%i</code>\nFormat: <code>(start, krok, koniec)</code>',
    starter: '@echo off\n:: Napisz pętlę for /l od 1 do 5 (krok 1)\n:: Wypisz: "Liczba: %%i" dla każdej liczby\n\n',
    hint: '<b>for /l %%i in (start,krok,koniec)</b>\n\nPrzykłady:\n<b>(1,1,10)</b> — od 1 do 10 co 1\n<b>(0,2,10)</b> — od 0 do 10 co 2\n<b>(10,-1,1)</b> — odliczanie od 10 do 1\n\n/l = loop (liczby)',
    check: (code, out) => [1,2,3,4,5].every(n => out.includes('Liczba: '+n)) && /for\s+\/l\s+%%\w/i.test(code),
    ok: 'for /l to pętla liczbowa: (start, krok, koniec). Idealna do odliczania i iteracji N razy.'
  },
  {
    title: 'LEKCJA 7 — ETYKIETY I GOTO',
    task: 'Etykiety w .bat to <code>:nazwa</code>. Skaczemy do nich przez <code>goto nazwa</code>. Napisz pętlę odliczającą od 3 do 1 używając goto.',
    starter: '@echo off\nset n=3\n:: Napisz pętlę goto: skocz do :petla\n:: Sprawdź czy n < 1, jeśli tak goto koniec\n:: Wypisz: "Odliczanie: %n%"\n:: Zmniejsz n o 1 i wróć do :petla\n\n\n:koniec\necho START!\n',
    hint: '<b>:etykieta</b> — definicja etykiety\n<b>goto etykieta</b> — skok bezwarunkowy\n<b>goto :eof</b> — koniec skryptu\n\nWarunkowy skok:\n<b>if %x%==0 goto koniec</b>\n\n⚠ Etykiety są ignorowane jako polecenia',
    check: (code, out) => out.includes('START!') && out.includes('Odliczanie: 3') && /\bgoto\b/i.test(code) && /^:/m.test(code),
    ok: 'Etykiety :nazwa i goto to podstawa kontroli przepływu w .bat. Ostrożnie z nieskończonymi pętlami!'
  },
  {
    title: 'LEKCJA 8 — PODPROGRAMY CALL',
    task: 'Użyj <code>call :podprogram</code> żeby wywołać podprogram. Zakończ go przez <code>exit /b</code>. Napisz podprogram który wypisuje separator.',
    starter: '@echo off\necho Start skryptu\n:: Wywołaj :separator\n\necho Srodek skryptu\n:: Wywołaj :separator\n\necho Koniec skryptu\ngoto :eof\n\n:separator\n:: Wypisz linię separatora (np. ------------------)\n\nexit /b\n',
    hint: '<b>call :etykieta</b> — wywołanie podprogramu (wraca po exit /b)\n<b>exit /b</b> — powrót z podprogramu\n<b>goto :eof</b> — koniec głównego skryptu\n\nArgumenty podprogramu:\n<b>call :nazwa arg1 arg2</b>\nWewnątrz: <b>%1</b> to arg1, <b>%2</b> to arg2',
    check: (code, out) => out.includes('Start') && out.includes('Koniec') && (out.match(/--+/g)||[]).length>=2 && /call\s+:/i.test(code),
    ok: 'call :etykieta to podprogramy w .bat. exit /b wraca do miejsca wywołania. goto :eof kończy skrypt.'
  },
  {
    title: 'LEKCJA 9 — ARGUMENTY SKRYPTU',
    task: 'Skrypt .bat przyjmuje argumenty: <code>%1</code> to pierwszy, <code>%2</code> drugi, <code>%0</code> to nazwa skryptu. Wypisz je wszystkie.',
    starter: '@echo off\n:: Wypisz: Skrypt: %0\n\n:: Wypisz: Pierwszy argument: %1\n\n:: Wypisz: Drugi argument: %2\n\n:: Wypisz: Trzeci argument: %3\n\n',
    hint: '<b>%0</b> — nazwa skryptu\n<b>%1, %2... %9</b> — kolejne argumenty\n<b>%*</b> — wszystkie argumenty\n\nUruchomienie:\n<b>skrypt.bat Jan Kowalski 25</b>\nWtedy %1=Jan, %2=Kowalski, %3=25\n\n<b>shift</b> — przesuwa argumenty (%2→%1 etc.)',
    check: (code, out) => out.includes('Skrypt:') || out.includes('Pierwszy argument:'),
    ok: 'Argumenty .bat: %1..%9, %0 to nazwa skryptu, %* to wszystkie. Uruchamiasz: skrypt.bat arg1 arg2'
  },
  {
    title: 'LEKCJA 10 — SKRYPT KOŃCOWY',
    task: 'Napisz skrypt który: iteruje po liście owoców pętlą for, używa podprogramu <code>:drukuj</code> do wypisania każdego owocu z numerem, używa zmiennej licznika.',
    starter: '@echo off\nset licznik=0\n:: Napisz pętlę for po liście: jablko gruszka banan kiwi\n:: W pętli: zwiększ licznik i wywołaj :drukuj z %%o\n\n\necho.\necho Razem: %licznik% owocow\ngoto :eof\n\n:drukuj\n:: Wypisz: " - %1"\n\nexit /b\n',
    hint: '<b>set /a licznik=licznik+1</b> — inkrementacja w pętli\n<b>call :drukuj %%o</b> — wywołanie podprogramu z argumentem\n<b>echo.</b> — pusta linia\n\n⚠ W bloku ( ) po for/if zmienne są obliczane raz — jeśli licznik nie rośnie, użyj setlocal enabledelayedexpansion i <b>!licznik!</b>',
    check: (code, out) => (out.includes('jablko') || out.includes('jabłko')) && (out.includes('gruszka') || out.includes('kiwi')),
    ok: 'Brawo! Pętle, podprogramy, zmienne, call z argumentami — to kompletny zestaw do egzaminu INF02!'
  }
];

// ─── CHAPTER 2 LESSONS ─────────────────────────────────────────────────
const LESSONS_CH2 = [
  {
    title: 'LEKCJA 1 — TWORZENIE KATALOGÓW',

  { key: 'c0', name: 'R1: PODSTAWY', lessons: LESSONS_CH1 },
  { key: 'c1', name: 'R2: EGZAMIN',  lessons: LESSONS_CH2 }
];

// ─── STATE ─────────────────────────────────────────────────────────────
let currentChapter = parseInt(localStorage.getItem('hl-batch2-chap') || '0');
let allProgress = [
  JSON.parse(localStorage.getItem('hl-batch2-c0') || '[]'),
  JSON.parse(localStorage.getItem('hl-batch2-c1') || '[]')
];
let currentLesson = 0;

function curLessons() { return CHAPTERS[currentChapter].lessons; }
function curProg()    { return allProgress[currentChapter]; }
function progKey()    { return 'hl-batch2-' + CHAPTERS[currentChapter].key; }
function posKey()     { return 'hl-batch2-' + CHAPTERS[currentChapter].key + '-pos'; }

// ─── BATCH INTERPRETER ─────────────────────────────────────────────────
function runBatch(code) {
  const output = [];
  const env = {};
  let echoOn = true;

  // Virtual File System
  const vfsDirs = new Set();
  const vfsFiles = {};
  let captureFile = null;
  let captureAppend = false;

  function bPath(p) {
    return String(p).replace(/\\/g,'/').replace(/^[A-Za-z]:\//,'').replace(/^\.\//,'');
  }

  function dirList(dirPath) {
    const prefix = dirPath ? (dirPath.endsWith('/') ? dirPath : dirPath+'/') : '';
    const items = new Set();
    vfsDirs.forEach(d => {
      if(!prefix && !d.includes('/')) items.add(d);
      else if(prefix && d.startsWith(prefix)) {
        const rest = d.slice(prefix.length);
        if(rest && !rest.includes('/')) items.add(rest);
      }
    });
    Object.keys(vfsFiles).forEach(f => {
      if(!prefix && !f.includes('/')) items.add(f);
      else if(prefix && f.startsWith(prefix)) {
        const rest = f.slice(prefix.length);
        if(rest && !rest.includes('/')) items.add(rest);
      }
    });
    return [...items].sort();
  }

  function simDate() { return new Date().toLocaleDateString('pl-PL'); }
  function simTime() { return new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'}); }

  function emit(text, cls) {
    if(captureFile !== null) {
      vfsFiles[captureFile] = (vfsFiles[captureFile]||'') + String(text) + '\n';
      return;
    }
    output.push({text:String(text), cls:cls||'line-out'});
  }
  function emitDirect(text, cls) { output.push({text:String(text), cls:cls||'line-out'}); }

  function startCapture(file, append) {
    captureFile = bPath(expandVars(file));
    if(!append) vfsFiles[captureFile] = '';
    captureAppend = append;
  }
  function endCapture() { captureFile = null; captureAppend = false; }

  function expandVars(s) {
    s = String(s);
    // %%VAR for-loop variables (before %VAR%)
    s = s.replace(/%%([a-zA-Z_]\w*)/g, (_, v) => env[v.toUpperCase()] !== undefined ? env[v.toUpperCase()] : '%%'+v);
    // %VAR%
    s = s.replace(/%([^%\n]+)%/g, (_, v) => env[v.toUpperCase()] !== undefined ? env[v.toUpperCase()] : '%'+v+'%');
    return s;
  }

  function setVar(name, value) { env[name.toUpperCase()] = String(value); }
  function getVar(name) { return env[name.toUpperCase()] || ''; }

  function evalArith(expr) {
    try {
      const e = expr
        .replace(/%%/g,'%')
        .replace(/([a-zA-Z_]\w*)/g, v => {
          const n = Number(env[v.toUpperCase()]);
          return isNaN(n) ? '0' : String(n);
        });
      return Math.floor(Function('"use strict";return ('+e+')')());
    } catch(ex) { return 0; }
  }

  function evalCond(parts) {
    const str = parts.join(' ');
    if(/^exist\s/i.test(str)) return true;
    if(/^not exist\s/i.test(str)) return false;
    const numOp = str.match(/^(.+?)\s+(equ|neq|lss|gtr|leq|geq)\s+(.+)$/i);
    if(numOp) {
      const a=Number(expandVars(numOp[1].trim())), b=Number(expandVars(numOp[3].trim())), op=numOp[2].toLowerCase();
      return op==='equ'?a===b:op==='neq'?a!==b:op==='lss'?a<b:op==='gtr'?a>b:op==='leq'?a<=b:a>=b;
    }
    const eqOp = str.match(/^(.+?)==(.+)$/);
    if(eqOp) {
      const a=expandVars(eqOp[1].trim()).replace(/^"|"$/g,'');
      const b=expandVars(eqOp[2].trim()).replace(/^"|"$/g,'');
      return a===b;
    }
    return false;
  }

  function buildLabelMap(lines) {
    const map={};
    lines.forEach((l,idx)=>{
      const t=l.trim();
      if(t.startsWith(':')&&t.length>1) map[t.slice(1).toLowerCase()]=idx;
    });
    return map;
  }

  // check for redirect: returns {cmd, file, append} or null
  function checkRedirect(t) {
    // >> before >
    const appM = /^(.*?)\s+>>\s+(\S+)\s*$/.exec(t);
    if(appM) return {cmd:appM[1].trim(), file:appM[2], append:true};
    const wrtM = /^(.*?)\s+>\s+(\S+)\s*$/.exec(t);
    if(wrtM) return {cmd:wrtM[1].trim(), file:wrtM[2], append:false};
    return null;
  }

  function execSingleCmd(cmd) {
    cmd=cmd.trim();
    if(!cmd) return;
    const redir = checkRedirect(cmd);
    const actualCmd = redir ? redir.cmd.trim() : cmd;

    if(redir) startCapture(redir.file, redir.append);

    if(/^@?echo$/i.test(actualCmd)||/^@?echo\.$/i.test(actualCmd)) { emit(''); }
    else if(/^@?echo\s+/i.test(actualCmd)) {
      const lead=actualCmd.match(/^@?echo\s+/i)[0];
      emit(expandVars(actualCmd.slice(lead.length)));
    }
    else if(/^set\s+\/a\s+/i.test(actualCmd)){
      const m=actualCmd.slice(7).trim().match(/^([a-zA-Z_]\w*)\s*=\s*(.+)$/);
      if(m) setVar(m[1], evalArith(m[2]));
    }
    else if(/^set\s+/i.test(actualCmd)){
      const rest=actualCmd.slice(4).trim(), eqIdx=rest.indexOf('=');
      if(eqIdx>-1) setVar(rest.slice(0,eqIdx), rest.slice(eqIdx+1));
    }
    else if(/^date\s*\/t$/i.test(actualCmd)) { emit(simDate()); }
    else if(/^time\s*\/t$/i.test(actualCmd)) { emit(simTime()); }
    else if(/^hostname$/i.test(actualCmd)) { emit('HOSTLAB-PC'); }
    else if(/^ver$/i.test(actualCmd)) { emit('Microsoft Windows [Version 10.0.19045]'); }
    else if(/^(dir|dir\s+)/i.test(actualCmd)) {
      const parts=actualCmd.split(/\s+/);
      const bare=parts.includes('/b')||parts.includes('/B');
      const dirArg=parts.find(p=>!/^(dir|\/b|\/B|\/w|\/W)$/i.test(p));
      const dirPath=dirArg ? bPath(expandVars(dirArg)) : '';
      const items=dirList(dirPath);
      if(bare){items.forEach(it=>emit(it));}
      else{emit(' Katalog: '+(dirPath||'C:\\'));items.forEach(it=>emit(' '+it));}
    }
    else if(/^(md|mkdir)\s+/i.test(actualCmd)){
      const parts=actualCmd.split(/\s+/);
      const dn=bPath(expandVars(parts[parts.length-1]));
      if(dn) vfsDirs.add(dn);
    }
    else if(/^type\s+/i.test(actualCmd)){
      const f=bPath(expandVars(actualCmd.slice(5).trim()));
      const content=vfsFiles[f];
      if(content!==undefined){
        content.split('\n').filter((l,i,a)=>!(i===a.length-1&&l==='')).forEach(l=>emit(l));
      } else {
        emitDirect('Nie można odnaleźć określonego pliku — '+f,'line-err');
      }
    }

    if(redir) endCapture();
  }

  function execLines(lines, startIdx) {
    const labelMap = buildLabelMap(lines);
    let i = startIdx;
    let execGuard = 0;

    while(i < lines.length && execGuard++ < 3000) {
      const raw=lines[i];
      const t=raw.trim();

      if(!t||/^rem\s/i.test(t)||t.startsWith('::')) { i++; continue; }
      if(t.startsWith(':')) { i++; continue; }

      if(/^@?echo\s+off$/i.test(t)) { echoOn=false; i++; continue; }
      if(/^@?echo\s+on$/i.test(t)) { echoOn=true; i++; continue; }

      // check redirect at top level
      const redir = checkRedirect(t);
      const tcmd = redir ? redir.cmd.trim() : t;

      // echo
      if(/^@?echo$/i.test(tcmd)||/^@?echo\.$/i.test(tcmd)) {
        if(redir) { startCapture(redir.file,redir.append); emit(''); endCapture(); }
        else emit('');
        i++; continue;
      }
      if(/^@?echo\s+/i.test(tcmd)) {
        const lead=tcmd.match(/^@?echo\s+/i)[0];
        const msg=expandVars(tcmd.slice(lead.length));
        if(redir) { startCapture(redir.file,redir.append); emit(msg); endCapture(); }
        else emit(msg);
        i++; continue;
      }

      // set
      if(/^set\s+/i.test(tcmd)) {
        const rest=tcmd.slice(4).trim();
        if(/^\/a\s+/i.test(rest)){
          const expr=rest.slice(3).trim();
          const m=expr.match(/^([a-zA-Z_]\w*)\s*=\s*(.+)$/);
          if(m) setVar(m[1], evalArith(m[2]));
          i++; continue;
        }
        if(/^\/p\s+/i.test(rest)) { i++; continue; }
        const eqIdx=rest.indexOf('=');
        if(eqIdx>-1) setVar(rest.slice(0,eqIdx), rest.slice(eqIdx+1));
        i++; continue;
      }

      // goto
      if(/^goto\s+/i.test(tcmd)) {
        const label=tcmd.slice(5).trim().toLowerCase().replace(/^:/,'');
        if(label==='eof') break;
        const target=labelMap[label];
        if(target!==undefined){i=target+1;continue;}
        i++; continue;
      }

      // exit /b or exit
      if(/^exit(\s+\/b)?$/i.test(tcmd)) break;

      // call :label
      if(/^call\s+:/i.test(tcmd)) {
        const parts=tcmd.slice(5).trim().split(/\s+/);
        const label=parts[0].slice(1).toLowerCase();
        const args=parts.slice(1).map(a=>expandVars(a));
        const savedArgs={};
        args.forEach((a,idx)=>{savedArgs[idx+1]=env[String(idx+1)];env[String(idx+1)]=a;});
        const target=labelMap[label];
        if(target!==undefined) execLines(lines, target+1);
        args.forEach((_,idx)=>{
          if(savedArgs[idx+1]!==undefined)env[String(idx+1)]=savedArgs[idx+1];
          else delete env[String(idx+1)];
        });
        i++; continue;
      }

      // if block
      if(/^if\s+/i.test(tcmd)) {
        const rest=tcmd.slice(3).trim();
        if(rest.includes('(') && !rest.trimEnd().endsWith(')')) {
          i=handleIfBlock(lines, i, labelMap);
          continue;
        }
        const parenMatch=rest.match(/^(.+?)\s+\((.+)\)(?:\s+else\s+\((.+)\))?$/);
        if(parenMatch){
          const cond=parenMatch[1].trim();
          const thenCmd=parenMatch[2].trim();
          const elseCmd=parenMatch[3]?parenMatch[3].trim():null;
          if(evalCond(cond.split(/\s+/)))execSingleCmd(thenCmd);
          else if(elseCmd) execSingleCmd(elseCmd);
          i++;continue;
        }
        // single-line: if VAR op VAL command (handles goto too)
        const condTokens=rest.split(/\s+/);
        const opIdx=condTokens.findIndex(tok=>/^(equ|neq|lss|gtr|leq|geq)$/i.test(tok));
        if(opIdx>0 && opIdx+1<condTokens.length) {
          const condParts=condTokens.slice(0, opIdx+2);
          const cmdStr=expandVars(condTokens.slice(opIdx+2).join(' ').trim());
          if(evalCond(condParts) && cmdStr) {
            if(/^goto\s+/i.test(cmdStr)){
              const lbl=cmdStr.slice(5).trim().toLowerCase().replace(/^:/,'');
              if(lbl==='eof'){i=lines.length;continue;}
              const tgt=labelMap[lbl];
              if(tgt!==undefined){i=tgt+1;continue;}
            } else {
              execSingleCmd(cmdStr);
            }
          }
        }
        i++; continue;
      }

      // for /l (with spaces allowed around commas)
      if(/^for\s+\/l\s+/i.test(tcmd)) {
        const m=tcmd.match(/for\s+\/l\s+%%(\w)\s+in\s+\(\s*(-?\d+)\s*,\s*(-?\d+)\s*,\s*(-?\d+)\s*\)\s+do\s+(.*)/i);
        if(m){
          const varN=m[1], from=parseInt(m[2]), step=parseInt(m[3]), to=parseInt(m[4]);
          let body=m[5].trim();
          if(body.startsWith('(')&&!body.endsWith(')')) {
            i=handleForBlock(lines,i,varN,'range',{from,step,to});continue;
          }
          body=body.startsWith('(')?body.slice(1,-1).trim():body;
          for(let n=from;step>0?n<=to:n>=to;n+=step){
            setVar(varN,String(n));
            execSingleCmd(expandVars(body));
          }
        }
        i++; continue;
      }

      // for /f "tokens=*" %%a in ('cmd') do ...
      if(/^for\s+\/f\s+/i.test(tcmd)) {
        const m=tcmd.match(/for\s+\/f\s+['"'][^'"']*['"']\s+%%(\w)\s+in\s+\('([^']+)'\)\s+do\s+(.*)/i);
        if(m){
          const varN=m[1], cmd=m[2].trim(), body=m[3].trim();
          let result='';
          if(/^date\s*\/t$/i.test(cmd)) result=simDate();
          else if(/^time\s*\/t$/i.test(cmd)) result=simTime();
          else if(/^hostname$/i.test(cmd)) result='HOSTLAB-PC';
          else if(/^ver$/i.test(cmd)) result='Microsoft Windows [Version 10.0.19045]';
          if(result){ setVar(varN,result); execSingleCmd(expandVars(body)); }
        }
        i++; continue;
      }

      // for %%i in (list) do
      if(/^for\s+%%/i.test(tcmd)) {
        const m=tcmd.match(/for\s+%%(\w)\s+in\s+\(([^)]+)\)\s+do\s+(.*)/i);
        if(m){
          const varN=m[1];
          const items=m[2].trim().split(/\s+/);
          let body=m[3].trim();
          if(body.startsWith('(')&&!body.endsWith(')')) {
            i=handleForBlock(lines,i,varN,'list',{items});continue;
          }
          body=body.startsWith('(')?body.slice(1,-1).trim():body;
          for(const item of items){ setVar(varN,item); execSingleCmd(expandVars(body)); }
        }
        i++; continue;
      }

      // system commands at top level (possibly with redirect)
      if(/^(date\s*\/t|time\s*\/t|hostname|ver)$/i.test(tcmd)) {
        if(redir) startCapture(redir.file, redir.append);
        if(/^date/i.test(tcmd)) emit(simDate());
        else if(/^time/i.test(tcmd)) emit(simTime());
        else if(/^hostname/i.test(tcmd)) emit('HOSTLAB-PC');
        else if(/^ver/i.test(tcmd)) emit('Microsoft Windows [Version 10.0.19045]');
        if(redir) endCapture();
        i++; continue;
      }

      if(/^(md|mkdir)\s+/i.test(tcmd)) {
        const parts=tcmd.split(/\s+/);
        const dn=bPath(expandVars(parts[parts.length-1]));
        if(dn) vfsDirs.add(dn);
        i++; continue;
      }

      if(/^type\s+/i.test(tcmd)) {
        const f=bPath(expandVars(tcmd.slice(5).trim()));
        const content=vfsFiles[f];
        if(content!==undefined){
          content.split('\n').filter((l,ix,a)=>!(ix===a.length-1&&l==='')).forEach(l=>emitDirect(l));
        } else {
          emitDirect('Nie można odnaleźć pliku — '+f,'line-err');
        }
        i++; continue;
      }

      if(/^(dir|dir\s+)/i.test(tcmd)) {
        const parts=tcmd.split(/\s+/);
        const bare=parts.some(p=>/^\/b$/i.test(p));
        const dirArg=parts.find(p=>!/^(dir|\/b|\/B|\/w|\/W)$/i.test(p));
        const dirPath=dirArg ? bPath(expandVars(dirArg)) : '';
        const items=dirList(dirPath);
        if(redir) startCapture(redir.file, redir.append);
        if(bare){items.forEach(it=>emit(it));}
        else{emit(' Katalog: '+(dirPath||'C:\\'));items.forEach(it=>emit(' '+it));}
        if(redir) endCapture();
        i++; continue;
      }

      if(/^cls$/i.test(tcmd)) { output.length=0; i++; continue; }
      if(/^pause$/i.test(tcmd)) { emitDirect('Naciśnij dowolny klawisz aby kontynuować...','line-sys'); i++; continue; }
      if(/^title\s/i.test(tcmd)) { i++; continue; }

      i++;
    }
  }

  function handleIfBlock(lines, startIdx, labelMap) {
    const ifLine=lines[startIdx].trim();
    const condMatch=ifLine.match(/^if\s+(.+?)\s+\($/i);
    const cond=condMatch?condMatch[1].trim():'';
    const result=evalCond(cond.split(/\s+/));
    let i=startIdx+1, depth=1;
    const thenLines=[], elseLines=[];
    let inElse=false;
    while(i<lines.length){
      const t=lines[i].trim();
      if(t==='(')depth++;
      if(t===')'){
        depth--;
        if(depth===0){
          i++;
          if(i<lines.length&&/^else\s*\($/i.test(lines[i].trim())){
            inElse=true;i++;depth=1;
            while(i<lines.length){
              const t2=lines[i].trim();
              if(t2===')'){i++;break;}
              elseLines.push(lines[i]);i++;
            }
          }
          break;
        }
      }
      if(t===') else ('){
        inElse=true;i++;depth=1;
        while(i<lines.length){
          const t2=lines[i].trim();
          if(t2===')'){i++;break;}
          elseLines.push(lines[i]);i++;
        }
        break;
      }
      if(depth>0)(inElse?elseLines:thenLines).push(lines[i]);
      i++;
    }
    if(result)execLines(thenLines,0);
    else execLines(elseLines,0);
    return i;
  }

  function handleForBlock(lines, startIdx, varN, type, opts) {
    let i=startIdx+1, depth=1, body=[];
    while(i<lines.length){
      const t=lines[i].trim();
      if(t==='(')depth++;
      if(t===')'){depth--;if(depth===0){i++;break;}}
      body.push(lines[i]);i++;
    }
    const items=type==='range'
      ? (()=>{const r=[];for(let n=opts.from;opts.step>0?n<=opts.to:n>=opts.to;n+=opts.step)r.push(String(n));return r;})()
      : opts.items;
    for(const item of items){ setVar(varN,item); execLines(body,0); }
    return i;
  }

  const lines=code.split('\n');
  for(let i=0;i<=9;i++) env[String(i)]='';
  env['0']='skrypt.bat';
  execLines(lines,0);
  return {output, vfs:{dirs:vfsDirs, files:vfsFiles}};
}

// ─── UI ────────────────────────────────────────────────────────────────
const editorEl=document.getElementById('editor');
const outputEl=document.getElementById('output');
const lineNumsEl=document.getElementById('line-nums');
const progressFill=document.getElementById('progress-fill');
const lessonCounter=document.getElementById('lesson-counter');
const statusMsg=document.getElementById('status-msg');

function updateLineNums(){
  const n=editorEl.value.split('\n').length;
  let html='';
  for(let i=1;i<=n;i++) html+=`<div>${i}</div>`;
  lineNumsEl.innerHTML=html;
  lineNumsEl.scrollTop=editorEl.scrollTop;
}

editorEl.addEventListener('input',updateLineNums);
editorEl.addEventListener('scroll',()=>{lineNumsEl.scrollTop=editorEl.scrollTop;});
editorEl.addEventListener('keydown',e=>{
  if(e.key==='Tab'){
    e.preventDefault();
    const s=editorEl.selectionStart, v=editorEl.value;
    editorEl.value=v.slice(0,s)+'  '+v.slice(editorEl.selectionEnd);
    editorEl.selectionStart=editorEl.selectionEnd=s+2;
    updateLineNums();
  }
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){
    e.preventDefault();
    runScript();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    hideHint();
    document.getElementById('success-overlay').classList.remove('show');
  }
});

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setStatus(msg,cls){statusMsg.textContent=msg;statusMsg.className='status-msg'+(cls?' '+cls:'');}

function switchChapter(idx){
  currentChapter=idx;
  localStorage.setItem('hl-batch2-chap',idx);
  document.getElementById('ch0-btn').classList.toggle('ch-active',idx===0);
  document.getElementById('ch1-btn').classList.toggle('ch-active',idx===1);
  currentLesson=Math.min(parseInt(localStorage.getItem(posKey())||'0'),curLessons().length-1);
  loadLesson();
}

function goLesson(n){
  if(n<0||n>=curLessons().length)return;
  currentLesson=n;
  localStorage.setItem(posKey(),n);
  loadLesson();
}

function loadLesson(){
  const L=curLessons()[currentLesson];
  document.getElementById('lesson-title').textContent=L.title;
  document.getElementById('lesson-task').innerHTML=L.task;
  editorEl.value=L.starter;
  updateLineNums();
  outputEl.innerHTML='<span class="line-sys">// Napisz skrypt i kliknij URUCHOM</span>\n<span class="cursor-line"></span>';
  setStatus('GOTOWY');hideHint();
  document.getElementById('success-overlay').classList.remove('show');
  document.getElementById('btn-prev').disabled=currentLesson===0;
  document.getElementById('btn-next').disabled=currentLesson===curLessons().length-1;
  lessonCounter.textContent=`${currentLesson+1} / ${curLessons().length}`;
  const done=curProg().filter(Boolean).length;
  progressFill.style.width=(done/curLessons().length*100)+'%';
}

function runScript(){
  const code=editorEl.value;
  if(!code.trim()){setStatus('PUSTY SKRYPT','err');return;}
  setStatus('URUCHAMIANIE...','');
  setTimeout(()=>{
    try{
      const {output:lines, vfs}=runBatch(code);
      let html='<span class="line-sys">C:\\Users\\Student&gt; skrypt.bat</span>\n';
      if(lines.length===0){
        html+='<span class="line-sys">// (brak wyjścia)</span>\n';
      } else {
        for(const {text,cls} of lines){
          html+=`<span class="${cls}">${escHtml(text)}</span>\n`;
        }
      }
      html+='<span class="cursor-line"></span>';
      outputEl.innerHTML=html;
      outputEl.scrollTop=outputEl.scrollHeight;
      const outText=lines.map(l=>l.text).join('\n');
      const L=curLessons()[currentLesson];
      if(L.check(code,outText,vfs)){
        setStatus('ZALICZONE!','ok');
        curProg()[currentLesson]=true;
        localStorage.setItem(progKey(),JSON.stringify(curProg()));
        progressFill.style.width=(curProg().filter(Boolean).length/curLessons().length*100)+'%';
        setTimeout(()=>showSuccess(L.ok),700);
      } else {
        setStatus('URUCHOMIONO — SPRAWDŹ WYJŚCIE','');
      }
    }catch(err){
      outputEl.innerHTML+='<span class="line-err">BŁĄD: '+escHtml(err.message)+'</span>\n';
      setStatus('BŁĄD','err');
    }
  },80);
}

function resetEditor(){
  editorEl.value=curLessons()[currentLesson].starter;
  updateLineNums();
  outputEl.innerHTML='<span class="line-sys">// Skrypt zresetowany</span>\n<span class="cursor-line"></span>';
  setStatus('ZRESETOWANO');
}

function showHint(){
  document.getElementById('hint-text').innerHTML=curLessons()[currentLesson].hint;
  document.getElementById('hint-box').classList.add('show');
}
function hideHint(){document.getElementById('hint-box').classList.remove('show');}

function showSuccess(msg){
  document.getElementById('success-msg').textContent=msg;
  const ov=document.getElementById('success-overlay');
  ov.classList.add('show');
  const btn=document.getElementById('success-next-btn');
  if(currentLesson>=curLessons().length-1){
    btn.textContent='KONIEC ROZDZIAŁU ✓';
    btn.onclick=()=>ov.classList.remove('show');
  } else {
    btn.textContent='NASTĘPNA LEKCJA →';
    btn.onclick=nextLesson;
  }
}

function nextLesson(){
  document.getElementById('success-overlay').classList.remove('show');
  if(currentLesson<curLessons().length-1)goLesson(currentLesson+1);
}

// INIT
currentLesson=Math.min(parseInt(localStorage.getItem(posKey())||'0'),curLessons().length-1);
loadLesson();
</script>
