* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height: 100vh;

/* hide side lever + all text labels from the SVG */

#svg1 text { display: none; }

/* Machine wrapper — SVG is 639x432, displayed at 540px wide */
/* scale factor = 540/639 = 0.8451                           */
#machine-wrap {
  position: relative;
  width: 540px;
  display: block;
  filter: drop-shadow(0 20px 60px rgba(0,0,0,0.85));
}
#machine-wrap > svg {
  display: block;
  width: 540px;
  height: auto;
}

/* rect5: x=277.2, y=127.4, w=97.4, h=69.9                 */
/* rect6: x=374.9, y=127.4, w=97.4, h=69.9                 */
/* All * 0.8451 for display pixels:                         */
.reel-overlay {
  position: absolute;
  top:  108px;
  width: 82px;
  height: 59px;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom,
    transparent 0%, black 20%, black 80%, transparent 100%);
  mask-image: linear-gradient(to bottom,
    transparent 0%, black 20%, black 80%, transparent 100%);
}
#reel-0 { left: 150px; }
#reel-1 { left: 234px; }
#reel-2 { left: 317px; }

.reel-strip {
  display: flex;
  flex-direction: column;
  will-change: transform;
}
.reel-item {
  height: 59px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 5px;
  font-size: 9.5px;
  font-weight: 600;
  color: #6a001a;
  letter-spacing: 0.4px;
  line-height: 1.2;
  text-transform: uppercase;
  flex-shrink: 0;
}

/* Result text in the lower body panel (SVG y≈229-297 → display y≈193-251) */
#result-overlay {
  position: absolute;
  left: 145px;
  top: 208px;
  width: 260px;
  text-align: center;
  pointer-events: none;
}
#result-text {
  font-size: 10.5px;
  font-weight: 300;
  color: rgba(255,180,180,0.45);
  letter-spacing: 2px;
  text-transform: uppercase;
  line-height: 1.5;
  transition: all 0.35s;
}
#result-text.revealed {
  color: #ffd100;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-shadow: 0 0 14px rgba(255,209,0,0.45);
}

/* Crank section below the machine */
#crank-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: -5px;
}
.crank-mount {
  width: 58px; height: 15px;
  background: linear-gradient(to bottom, #4a4040, #252020);
  border: 2px solid #181010;
  border-radius: 3px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}
#crank-wrap {
  cursor: pointer;
  margin-top: 3px;
  width: 84px; height: 84px;
}
#crank-wrap svg { width: 84px; height: 84px; transition: filter .2s; }
#crank-wrap:hover svg { filter: drop-shadow(0 0 8px rgba(255,209,0,0.4)); }

#crank-inner { transform-origin: 42px 42px; }
#crank-wrap.cranking #crank-inner {
  animation: spin-full 0.55s cubic-bezier(0.22,1,0.36,1);
}
@keyframes spin-full { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

.spin-hint {
  margin-top: 7px;
  font-size: 9px;
  letter-spacing: 4px;
  color: #6a2020;
  text-transform: uppercase;
}

<script>
const STYLES = [
  'Retro Terminal','Cyberpunk','Vaporwave','Dark Academia','Brutalist',
  'Neon Noir','Minimal Zen','Art Deco','Cottagecore','Memphis',
  'Glassmorphism','Neumorphism','Bauhaus','Psychedelic','Lo-Fi Pixel',
  'Swiss Grid','Bento Grid','Y2K Throwback','Solarpunk','Maximalist',
  'Monochrome Ink','Aurora','Industrial Grit','Kawaii Soft','Steampunk',
  'Futuristic Flat','Organic Blob','Bold Type','Comic Book','Deep Space',
  'Earthy Muted','High Contrast','Glitch Art','Corp. Memphis','Fantasy Map',
  'Isometric 3D','Hand-Drawn','Blueprint','Luxury Black','Paper Cut',
  'Neon Pastel','Retro Future','Analog Noise','Wabi-Sabi','Cybernetic',
  'Ocean Depth','Desert Sand','Nordic Frost','Tokyo Pop','Rainforest'
];
const TYPES = [
  'Dashboard','Portfolio','Social App','Dev Tool','Game',
  'Productivity','Marketplace','Data Viz','Landing Page','Note-Taking',
  'Music Player','Weather App','Habit Tracker','Chat UI','Code Editor'
];
const VIBES = [
  'Dark & Moody','Bright & Fun','Glitchy','Elegant','Chaotic',
  'Calm & Clean','Bold & Loud','Mysterious','Futuristic','Nostalgic',
  'Warm & Cozy','Cold & Sharp'
];

const ALL = [STYLES, TYPES, VIBES];
const ITEM_H = 59;
let spinning = false;

function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [b[i],b[j]]=[b[j],b[i]];
  }
  return b;
}

function initReels() {
  ALL.forEach((items, i) => {
    const strip = document.getElementById('strip-'+i);
    strip.innerHTML = '';
    shuffle(items).slice(0,5).forEach(t => {
      const d = document.createElement('div');
      d.className = 'reel-item'; d.textContent = t;
      strip.appendChild(d);
    });
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
  });
}

function spinReel(i, finalItem, delay, dur) {
  return new Promise(resolve => {
    setTimeout(() => {
      const strip = document.getElementById('strip-'+i);
      const pool = [];
      for (let p = 0; p < 4; p++) pool.push(...shuffle(ALL[i]));
      pool.push(finalItem);

      strip.innerHTML = '';
      pool.forEach(t => {
        const d = document.createElement('div');
        d.className = 'reel-item'; d.textContent = t;
        strip.appendChild(d);
      });

      const startIdx = Math.floor(ALL[i].length * 1.5);
      strip.style.transition = 'none';
      strip.style.transform = `translateY(-${startIdx * ITEM_H}px)`;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        strip.style.transition = `transform ${dur}ms cubic-bezier(0.1,0.8,0.2,1)`;
        strip.style.transform = `translateY(-${(pool.length-1)*ITEM_H}px)`;
        setTimeout(resolve, dur + 60);
      }));
    }, delay);
  });
}

async function doSpin() {
  if (spinning) return;
  spinning = true;

  const crank = document.getElementById('crank-wrap');
  crank.classList.add('cranking');
  setTimeout(() => crank.classList.remove('cranking'), 580);

  const rt = document.getElementById('result-text');
  rt.className = ''; rt.textContent = '···';

  const picks = ALL.map(arr => arr[Math.floor(Math.random()*arr.length)]);

  await Promise.all([
    spinReel(0, picks[0],   0, 1100),
    spinReel(1, picks[1], 160, 1400),
    spinReel(2, picks[2], 320, 1700),
  ]);

  rt.textContent = picks.join(' × ');
  rt.className = 'revealed';
  spinning = false;
}

initReels();
</script>
