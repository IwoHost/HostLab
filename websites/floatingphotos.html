<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Photos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0a0b0f}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#eceff4}
  #stage{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(1200px 700px at 50% 120%,#16202e,#0a0b0f 70%)}
  .photo{position:absolute;top:0;left:0;border-radius:14px;
    background-size:cover;background-position:center;pointer-events:none;
    box-shadow:0 14px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);
    will-change:transform,opacity;opacity:0}

  /* controls */
  #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    transition:opacity .5s;z-index:10}
  #ui.gone{opacity:0;pointer-events:none}
  .panel{background:rgba(255,255,255,.06);backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.14);
    border-radius:26px;padding:40px 36px;text-align:center;max-width:440px;
    box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .panel h1{font-size:1.7rem;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
  .panel p{color:#9aa3b2;font-size:.95rem;line-height:1.5;margin-bottom:24px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:50px;padding:13px 22px;
    font-size:.95rem;font-weight:500;transition:.15s}
  .primary{background:#5b8cff;color:#06122e}
  .primary:hover{filter:brightness(1.08)}
  .ghost{background:rgba(255,255,255,.08);color:#eceff4;border:1px solid rgba(255,255,255,.16)}
  .ghost:hover{background:rgba(255,255,255,.16)}
  .hint{margin-top:18px;color:#6b7280;font-size:.8rem}

  /* tiny floating toolbar after start */
  #bar{position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:11;transition:opacity .4s}
  #bar.gone{opacity:0;pointer-events:none}
  #bar button{padding:9px 14px;font-size:.82rem;
    background:rgba(20,24,32,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.14);color:#eceff4;border-radius:50px}
  #count{position:fixed;left:16px;bottom:14px;color:#5b6472;font-size:.74rem;z-index:11;
    font-variant-numeric:tabular-nums;transition:opacity .4s}
  #count.gone{opacity:0}
</style>
</head>
<body>
<div id="stage"></div>

<div id="ui">
  <div class="panel">
    <h1>Floating Photos</h1>
    <p>Pick a folder of images (or select several) and they'll drift upward at random sizes — same effect as the .420 background, but with your pictures.</p>
    <div class="btns">
      <button class="primary" id="pick-folder">Choose a folder</button>
      <button class="ghost" id="pick-files">Pick photos</button>
    </div>
    <div class="hint">all local · nothing is uploaded · press F for fullscreen, Space to pause</div>
  </div>
</div>

<div id="bar" class="gone">
  <button id="re-pick">Change photos</button>
  <button id="fs">Fullscreen</button>
</div>
<div id="count" class="gone"></div>

<input type="file" id="folder-input" webkitdirectory multiple hidden>
<input type="file" id="files-input" accept="image/*" multiple hidden>

<script>
"use strict";
const stage = document.getElementById('stage');
const ui = document.getElementById('ui');
const bar = document.getElementById('bar');
const countEl = document.getElementById('count');

const COUNT = Math.min(28, Math.max(14, Math.round(window.innerWidth / 70)));
let W = innerWidth, H = innerHeight;
let pool = [];          // object URLs
let particles = [];
let paused = false;
let last = performance.now();

addEventListener('resize', () => { W = innerWidth; H = innerHeight; });

function rand(a, b) { return a + Math.random() * (b - a); }

function setPhoto(p) {
  if (!pool.length) return;
  const url = pool[(Math.random() * pool.length) | 0];
  p.el.style.backgroundImage = `url("${url}")`;
}

function respawn(p, initial) {
  p.size = rand(70, 230);
  p.ar = rand(0.72, 1.45);            // height / width
  const h = p.size * p.ar;
  p.baseX = rand(-0.05, 1.05) * W;
  p.sway = rand(15, 80);
  p.swayPhase = rand(0, Math.PI * 2);
  p.swaySpeed = rand(0.15, 0.55);
  p.speed = rand(16, 46);             // px/sec upward
  p.rot = rand(-9, 9);
  p.rotSpeed = rand(-5, 5);
  p.peak = 1;
  p.h = h;
  p.span = H + h + 80;
  p.top = initial ? rand(-h, H) : (H + 30);
  p.el.style.width = p.size + 'px';
  p.el.style.height = h + 'px';
  setPhoto(p);
}

function makeParticles() {
  particles.forEach(p => p.el.remove());
  particles = [];
  for (let i = 0; i < COUNT; i++) {
    const el = document.createElement('div');
    el.className = 'photo';
    stage.appendChild(el);
    const p = { el };
    respawn(p, true);
    particles.push(p);
  }
}

function fade(prog) {           // 0..1 across the full travel — tiny fade only at the very edges
  if (prog < 0.06) return prog / 0.06;
  if (prog > 0.94) return (1 - prog) / 0.06;
  return 1;
}

function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;
  if (!paused) {
    for (const p of particles) {
      p.top -= p.speed * dt;
      p.rot += p.rotSpeed * dt;
      if (p.top < -p.h - 60) respawn(p, false);
      const travel = (H + 30) - p.top;
      const prog = travel / p.span;
      const x = p.baseX + Math.sin(t * p.swaySpeed + p.swayPhase) * p.sway;
      p.el.style.transform = `translate3d(${(x - p.size / 2).toFixed(1)}px, ${p.top.toFixed(1)}px, 0) rotate(${p.rot.toFixed(2)}deg)`;
      p.el.style.opacity = (p.peak * Math.max(0, fade(prog))).toFixed(3);
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---- loading photos ----
function loadFiles(fileList) {
  const imgs = [...fileList].filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  pool.forEach(u => URL.revokeObjectURL(u));
  pool = imgs.slice(0, 120).map(f => URL.createObjectURL(f));
  makeParticles();
  ui.classList.add('gone');
  bar.classList.remove('gone');
  countEl.classList.remove('gone');
  countEl.textContent = `${pool.length} photos drifting`;
  autoHide();
}

document.getElementById('pick-folder').onclick = () => document.getElementById('folder-input').click();
document.getElementById('pick-files').onclick = () => document.getElementById('files-input').click();
document.getElementById('re-pick').onclick = () => ui.classList.remove('gone');
document.getElementById('folder-input').addEventListener('change', e => loadFiles(e.target.files));
document.getElementById('files-input').addEventListener('change', e => loadFiles(e.target.files));

// drag & drop anywhere
['dragenter', 'dragover'].forEach(ev => addEventListener(ev, e => e.preventDefault()));
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

// fullscreen + pause
function toggleFs() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}
document.getElementById('fs').onclick = toggleFs;
addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') toggleFs();
  if (e.key === ' ') { e.preventDefault(); paused = !paused; }
});

// auto-hide the toolbar
let hideTimer;
function autoHide() {
  bar.classList.remove('gone'); countEl.classList.remove('gone');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (!ui.classList.contains('gone')) return;
    bar.classList.add('gone'); countEl.classList.add('gone');
  }, 2800);
}
['mousemove', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, () => { if (pool.length) autoHide(); }));
</script>
</body>
</html>
