<style>
/* THEME: Midnight Amber — warm amber on near-black void, violet secondary layer */
:root {
  --bg:      #080608;
  --panel:   #0f0c13;
  --border:  #221c2e;
  --border2: #3a2f4c;
  --text:    #e2d8f0;
  --text2:   #8a7899;
  --text3:   #4a3e58;
  --accent:  #e8a020;
  --accent2: #c084fc;
  --mono:    'Share Tech Mono', monospace;
  --vt:      'VT323', monospace;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { height: 100%; }

body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  display: grid;
  grid-template-rows: 44px 1fr 38px;
  overflow: hidden;
}

/* Scanlines overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.07) 3px, rgba(0,0,0,.07) 4px);
  pointer-events: none;
  z-index: 1000;
}

/* ── HEADER ── */
#header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid var(--border2);
  background: var(--panel);
  gap: 16px;
  flex-shrink: 0;
}

#logo {
  font-family: var(--vt);
  font-size: 21px;
  letter-spacing: 0.1em;
  color: var(--accent);
  text-shadow: 0 0 16px rgba(232,160,32,0.4);
  flex-shrink: 0;
  animation: flicker 9s infinite;
}

#logo .sep { color: var(--text3); }

#hinfo {
  display: flex;
  gap: 20px;
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text3);
}

#hinfo b { color: var(--text2); }

/* ── MAIN ── */
#main {
  display: grid;
  grid-template-columns: 1fr 296px;
  overflow: hidden;
  min-height: 0;
}

/* ── LEFT: INPUT ── */
#input-panel {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  border-right: 1px solid var(--border);
}

#input-panel::-webkit-scrollbar { width: 2px; }
#input-panel::-webkit-scrollbar-thumb { background: var(--border2); }

.section {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.slabel {
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 12px;
}

/* Prompt */
#prompt-section {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--border);
}

#big-q {
  font-family: var(--vt);
  font-size: clamp(38px, 5vw, 62px);
  line-height: 1.0;
  color: var(--text);
  letter-spacing: 0.02em;
  animation: fadeUp 0.45s ease both;
}

#big-q em {
  font-style: normal;
  color: var(--accent);
  text-shadow: 0 0 22px rgba(232,160,32,0.3);
}

#big-q .cursor { color: var(--text3); animation: blink 1.1s steps(1) infinite; }

/* Canvas wave strip */
#wave-section {
  border-bottom: 1px solid var(--border);
  line-height: 0;
}

#vibe-canvas {
  display: block;
  width: 100%;
  height: 44px;
}

/* Mood spectrum */
#spectrum {
  display: flex;
  gap: 3px;
  flex-wrap: nowrap;
  overflow-x: auto;
  padding-bottom: 2px;
}

#spectrum::-webkit-scrollbar { height: 2px; }
#spectrum::-webkit-scrollbar-thumb { background: var(--border2); }

.mood-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  flex: 1;
  min-width: 52px;
  padding: 10px 4px 8px;
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  transition: border-color 0.14s, background 0.14s, transform 0.14s;
}

.mood-node .m-e { font-size: 23px; line-height: 1; }

.mood-node .m-l {
  font-family: var(--mono);
  font-size: 7.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text3);
  transition: color 0.14s;
  white-space: nowrap;
}

.mood-node:hover { border-color: var(--border2); transform: translateY(-2px); }
.mood-node:hover .m-l { color: var(--text2); }

.mood-node.sel {
  border-color: var(--accent);
  background: rgba(232,160,32,0.07);
  transform: translateY(-3px);
}

.mood-node.sel .m-l { color: var(--accent); }

/* Tags */
#tags-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.tag {
  padding: 4px 9px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text3);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  cursor: pointer;
  transition: border-color 0.12s, color 0.12s, background 0.12s;
}

.tag:hover { border-color: var(--accent2); color: var(--accent2); }

.tag.sel {
  border-color: var(--accent2);
  background: rgba(192,132,252,0.08);
  color: var(--accent2);
}

/* Note */
#note {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 9px 10px;
  resize: none;
  outline: none;
  line-height: 1.5;
  transition: border-color 0.14s;
}

#note::placeholder { color: var(--text3); }
#note:focus { border-color: var(--border2); }

#char-count {
  text-align: right;
  font-size: 9px;
  color: var(--text3);
  margin-top: 5px;
  letter-spacing: 0.1em;
  font-variant-numeric: tabular-nums;
}

/* Submit */
#submit-wrap { padding: 14px 20px; }

#submit-btn {
  width: 100%;
  padding: 12px;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text3);
  font-family: var(--vt);
  font-size: 22px;
  letter-spacing: 0.25em;
  cursor: not-allowed;
  transition: border-color 0.2s, color 0.2s, background 0.2s, box-shadow 0.2s;
}

#submit-btn.ready {
  border-color: var(--accent);
  color: var(--accent);
  cursor: pointer;
}

#submit-btn.ready:hover {
  background: rgba(232,160,32,0.09);
  box-shadow: 0 0 22px rgba(232,160,32,0.18);
}

/* ── RIGHT: BOARD ── */
#board {
  display: flex;
  flex-direction: column;
  background: var(--panel);
  overflow: hidden;
  min-height: 0;
}

#board-top {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border2);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-shrink: 0;
}

.blabel {
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text3);
}

#entry-count {
  font-family: var(--vt);
  font-size: 18px;
  color: var(--text2);
  font-variant-numeric: tabular-nums;
}

/* Aggregate */
#agg-section {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#agg-top {
  display: flex;
  align-items: baseline;
  gap: 9px;
  margin-bottom: 7px;
}

#agg-emoji {
  font-size: 28px;
  line-height: 1;
  display: inline-block;
}

#agg-label {
  font-family: var(--vt);
  font-size: 24px;
  color: var(--accent);
  text-shadow: 0 0 12px rgba(232,160,32,0.25);
  letter-spacing: 0.05em;
}

.meter-track {
  height: 2px;
  background: var(--border2);
  overflow: hidden;
}

.meter-fill {
  height: 100%;
  background: linear-gradient(90deg, #e05060, var(--accent), var(--accent2));
  transition: width 0.7s cubic-bezier(0.4,0,0.2,1);
  width: 0%;
}

/* Distribution */
#dist-section {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.dist-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
}

.dist-e { font-size: 12px; width: 18px; text-align: center; flex-shrink: 0; }

.dist-track { flex: 1; height: 3px; background: var(--border); overflow: hidden; }

.dist-bar { height: 100%; background: var(--border2); transition: width 0.45s ease; }
.dist-bar.peak { background: var(--accent); opacity: 0.8; }

.dist-n {
  font-size: 9px;
  color: var(--text3);
  width: 16px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

/* Feed */
#feed {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

#feed::-webkit-scrollbar { width: 2px; }
#feed::-webkit-scrollbar-thumb { background: var(--border2); }

.empty-msg {
  padding: 22px 14px;
  color: var(--text3);
  font-size: 11px;
  line-height: 1.8;
}

.entry {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  animation: slideIn 0.22s ease;
}

.entry-top {
  display: flex;
  align-items: center;
  gap: 7px;
}

.entry-emoji { font-size: 15px; flex-shrink: 0; }

.entry-mood {
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}

.entry-time {
  margin-left: auto;
  font-size: 9px;
  color: var(--text3);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.entry-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: 3px;
}

.entry-tag {
  font-size: 8px;
  letter-spacing: 0.1em;
  color: var(--accent2);
  opacity: 0.65;
}

.entry-note {
  font-size: 10px;
  color: var(--text2);
  margin-top: 3px;
  line-height: 1.45;
}

/* ── FLASH ── */
#flash {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(8,6,8,0.82);
  z-index: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s;
}

#flash.show {
  opacity: 1;
  pointer-events: auto;
}

#flash-inner {
  border: 1px solid var(--accent);
  padding: 22px 40px;
  text-align: center;
  background: var(--panel);
  box-shadow: 0 0 36px rgba(232,160,32,0.2);
  animation: scaleIn 0.18s ease;
}

#flash-e { font-size: 50px; display: block; margin-bottom: 8px; line-height: 1; }

#flash-t {
  font-family: var(--vt);
  font-size: 26px;
  color: var(--accent);
  letter-spacing: 0.18em;
}

/* ── FOOTER ── */
#footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-top: 1px solid var(--border2);
  background: var(--panel);
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text3);
  flex-shrink: 0;
}

#footer-mid { color: var(--text2); }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0; }
}

@keyframes flicker {
  0%, 88%, 90%, 92%, 100% { opacity: 1; }
  89% { opacity: 0.65; }
  91% { opacity: 0.85; }
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(7px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes scaleIn {
  from { transform: scale(0.9); }
  to   { transform: scale(1); }
}

/* ── MOBILE ── */
@media (max-width: 768px) {
  html, body { height: auto; overflow-y: auto; }
  body { grid-template-rows: 44px auto 38px; }
  #main { grid-template-columns: 1fr; height: auto; overflow: visible; }
  #input-panel { overflow: visible; }
  #board { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
</style>
</head>

</div>

    <span id="flash-e">🌀</span>

  </div>
</div>

<script>
'use strict';

const MOODS = [
  { e:'💀', l:'dead',    s:0 },
  { e:'😮‍💨', l:'done',    s:1 },
  { e:'😕', l:'meh',     s:2 },
  { e:'😐', l:'neutral', s:3 },
  { e:'🙂', l:'ok',      s:4 },
  { e:'😌', l:'chill',   s:5 },
  { e:'😊', l:'good',    s:6 },
  { e:'🤩', l:'hyped',   s:7 },
  { e:'🔥', l:'vibing',  s:8 },
];

const TAGS = [
  'TIRED','WIRED','ANXIOUS','CHILL','FOCUSED',
  'SCATTERED','MOTIVATED','COZY','STRESSED',
  'FLOW STATE','CAFFEINATED','ZONED OUT','HUNGRY',
  'OVERTHINKING','UNBOTHERED',
];

const REPLIES = ['VIBE LOGGED','FELT THAT','WE SEE YOU','NOTED FR','VALID','SAY LESS','REAL ONE'];

let selMood = null;
let selTags = new Set();
let entries = [];

try { entries = JSON.parse(localStorage.getItem('hwf-v2') || '[]'); } catch (_) {}

// ── BUILD MOOD NODES ──
const spectrumEl = document.getElementById('spectrum');
MOODS.forEach(m => {
  const btn = document.createElement('button');
  btn.className = 'mood-node';
  btn.setAttribute('aria-label', m.l);
  btn.innerHTML = `<span class="m-e" aria-hidden="true">${m.e}</span><span class="m-l">${m.l}</span>`;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-node').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
    selMood = m;
    const sbtn = document.getElementById('submit-btn');
    sbtn.classList.add('ready');
    sbtn.removeAttribute('aria-disabled');
    document.getElementById('footer-mid').textContent = `${m.e} ${m.l.toUpperCase()}`;
    targetAmp = 0.1 + (m.s / 8) * 0.65;
  });
  spectrumEl.appendChild(btn);
});

// ── BUILD TAG BUTTONS ──
const tagsWrap = document.getElementById('tags-wrap');
TAGS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'tag';
  btn.textContent = t;
  btn.addEventListener('click', () => {
    const on = btn.classList.toggle('sel');
    on ? selTags.add(t) : selTags.delete(t);
  });
  tagsWrap.appendChild(btn);
});

// ── NOTE COUNTER ──
const noteEl = document.getElementById('note');
const charEl = document.getElementById('char-count');
noteEl.addEventListener('input', () => {
  charEl.textContent = `${noteEl.value.length} / 120`;
});

// ── SUBMIT ──
document.getElementById('submit-btn').addEventListener('click', () => {
  if (!selMood) return;

  const entry = {
    mood: { e: selMood.e, l: selMood.l, s: selMood.s },
    tags: [...selTags],
    note: noteEl.value.trim(),
    t: Date.now(),
  };

  entries.unshift(entry);
  if (entries.length > 200) entries.length = 200;
  try { localStorage.setItem('hwf-v2', JSON.stringify(entries)); } catch (_) {}

  // Flash
  const ri = Math.floor(entries.length % REPLIES.length);
  document.getElementById('flash-e').textContent = selMood.e;
  document.getElementById('flash-t').textContent = REPLIES[ri];
  const flash = document.getElementById('flash');
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 1300);

  // Reset form
  selMood = null;
  selTags.clear();
  noteEl.value = '';
  charEl.textContent = '0 / 120';
  document.querySelectorAll('.mood-node, .tag').forEach(b => b.classList.remove('sel'));
  const sbtn = document.getElementById('submit-btn');
  sbtn.classList.remove('ready');
  sbtn.setAttribute('aria-disabled', 'true');
  document.getElementById('footer-mid').textContent = '——';
  targetAmp = computeTargetAmp();

  renderBoard();
});

// ── BOARD ──
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function renderBoard() {
  const n = entries.length;
  document.getElementById('entry-count').textContent = `${n} vibe${n !== 1 ? 's' : ''}`;

  if (n === 0) {
    document.getElementById('agg-emoji').textContent = '——';
    document.getElementById('agg-label').textContent = 'NO VIBES YET';
    document.getElementById('meter-fill').style.width = '0%';
    document.getElementById('dist-section').innerHTML = '';
    document.getElementById('feed').innerHTML = '<div class="empty-msg">no vibes logged yet<br>be first<span class="cursor" style="animation:blink 1.1s steps(1) infinite;color:var(--text3)">_</span></div>';
    return;
  }

  // Aggregate
  const avg = entries.reduce((a, e) => a + e.mood.s, 0) / n;
  const pct = (avg / 8) * 100;
  document.getElementById('meter-fill').style.width = pct.toFixed(1) + '%';
  const avgMood = MOODS[Math.min(8, Math.round(avg))];
  document.getElementById('agg-emoji').textContent = avgMood.e;
  document.getElementById('agg-label').textContent = avgMood.l.toUpperCase();

  // Distribution
  const counts = {};
  MOODS.forEach(m => { counts[m.l] = 0; });
  entries.forEach(e => { if (counts[e.mood.l] !== undefined) counts[e.mood.l]++; });
  const maxC = Math.max(1, ...Object.values(counts));

  document.getElementById('dist-section').innerHTML =
    [...MOODS].reverse().map(m => {
      const c = counts[m.l];
      const w = (c / maxC * 100).toFixed(1);
      const peak = c === maxC && c > 0 ? ' peak' : '';
      return `<div class="dist-row">
        <span class="dist-e" aria-hidden="true">${m.e}</span>
        <div class="dist-track"><div class="dist-bar${peak}" style="width:${w}%"></div></div>
        <span class="dist-n">${c}</span>
      </div>`;
    }).join('');

  // Feed
  document.getElementById('feed').innerHTML =
    entries.slice(0, 40).map(e => {
      const tagsHtml = e.tags.length
        ? `<div class="entry-tags">${e.tags.map(t => `<span class="entry-tag">#${t}</span>`).join(' ')}</div>`
        : '';
      const noteHtml = e.note
        ? `<div class="entry-note">${escHtml(e.note)}</div>`
        : '';
      return `<div class="entry">
        <div class="entry-top">
          <span class="entry-emoji" aria-hidden="true">${e.mood.e}</span>
          <span class="entry-mood">${e.mood.l}</span>
          <span class="entry-time">${timeAgo(e.t)}</span>
        </div>
        ${tagsHtml}${noteHtml}
      </div>`;
    }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── WAVE CANVAS ──
const canvas = document.getElementById('vibe-canvas');
const ctx = canvas.getContext('2d');
let phase = 0;
let targetAmp = 0.18;
let currentAmp = 0.18;
let dpr = 1;

function computeTargetAmp() {
  if (!entries.length) return 0.18;
  const avg = entries.reduce((a, e) => a + e.mood.s, 0) / entries.length;
  return 0.1 + (avg / 8) * 0.62;
}

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth;
  const H = canvas.offsetHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
}

function drawWave() {
  const W = canvas.offsetWidth;
  const H = canvas.offsetHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  currentAmp += (targetAmp - currentAmp) * 0.018;
  const amp = (H / 2) * currentAmp;
  const midY = H / 2;

  // Glow pass
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(232,160,32,0.10)';
  ctx.lineWidth = 4;
  for (let x = 0; x <= W; x++) {
    const t = (x / W) * Math.PI * 5;
    const y = midY + Math.sin(t + phase) * amp + Math.sin(t * 1.6 + phase * 0.75) * amp * 0.28;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Main line
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(232,160,32,0.38)';
  ctx.lineWidth = 1;
  for (let x = 0; x <= W; x++) {
    const t = (x / W) * Math.PI * 5;
    const y = midY + Math.sin(t + phase) * amp + Math.sin(t * 1.6 + phase * 0.75) * amp * 0.28;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  phase += 0.022;
  requestAnimationFrame(drawWave);
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
drawWave();

// ── INIT ──
targetAmp = computeTargetAmp();
renderBoard();

// Refresh timestamps every minute
setInterval(() => { if (entries.length > 0) renderBoard(); }, 60000);
</script>
