<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Bash — HostLab Study</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../other/logo/HLab_Logo.png">
<link rel="stylesheet" href="../other/backbutton.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050905;--surface:#090e09;--surface2:#0d140d;
  --border:#1a2e1a;--border2:rgba(0,255,65,.06);
  --green:#00ff41;--dim:#008822;--amber:#ffb300;
  --text:#b8f0b8;--muted:#3a5a3a;--err:#ff2828;
  --font:'Share Tech Mono',monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;animation:flicker 10s infinite}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.12) 3px,rgba(0,0,0,.12) 4px);pointer-events:none;z-index:9000}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.5) 100%);pointer-events:none;z-index:8999}
@keyframes flicker{0%,90%,100%{opacity:1}91%{opacity:.88}93%{opacity:1}95%{opacity:.92}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes scanIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── TOPBAR ── */
.topbar{
  flex-shrink:0;
  padding:10px 20px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  background:var(--surface);
  position:relative;z-index:100;
}
.topbar-logo{font-size:10px;letter-spacing:.2em;color:var(--dim);margin-right:auto}
.topbar-logo span{color:var(--green)}
.lesson-nav{display:flex;align-items:center;gap:10px}
.nav-btn{background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--font);font-size:11px;padding:5px 14px;cursor:pointer;transition:all .15s;letter-spacing:.1em}
.nav-btn:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.lesson-counter{font-size:11px;color:var(--dim);letter-spacing:.12em;min-width:80px;text-align:center}
.progress-wrap{width:120px;height:3px;background:var(--border);position:relative}
.progress-fill{height:100%;background:var(--green);transition:width .4s ease;box-shadow:0 0 6px rgba(0,255,65,.4)}

/* ── LESSON INFO BAR ── */
.lesson-bar{
  flex-shrink:0;
  padding:10px 20px;
  border-bottom:1px solid var(--border);
  background:var(--surface2);
  position:relative;z-index:50;
}
.lesson-title{font-size:11px;color:var(--green);letter-spacing:.1em;margin-bottom:4px}
.lesson-task{font-size:11px;color:var(--text);letter-spacing:.04em;line-height:1.55}
.lesson-task code{color:var(--amber);background:rgba(255,179,0,.08);padding:1px 5px}

/* ── SPLIT AREA ── */
.split{flex:1;display:flex;overflow:hidden;position:relative;z-index:10}

/* ── EDITOR PANEL ── */
.editor-panel{
  width:46%;flex-shrink:0;
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  background:var(--bg);
}
.panel-header{
  padding:7px 14px;
  border-bottom:1px solid var(--border);
  font-size:9px;letter-spacing:.25em;color:var(--muted);
  text-transform:uppercase;display:flex;align-items:center;gap:8px;
  background:var(--surface);flex-shrink:0;
}
.panel-dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.panel-dot.green{background:var(--green);box-shadow:0 0 4px rgba(0,255,65,.5)}
.editor-body{flex:1;display:flex;overflow:hidden}
.line-nums{
  padding:12px 0;
  background:var(--surface);
  border-right:1px solid var(--border);
  min-width:38px;
  font-size:12px;color:var(--muted);
  line-height:1.6;
  text-align:right;
  overflow:hidden;
  flex-shrink:0;
  user-select:none;
}
.line-nums div{padding:0 8px 0 4px}
textarea#editor{
  flex:1;
  background:var(--bg);
  color:var(--green);
  font-family:var(--font);
  font-size:12px;
  line-height:1.6;
  padding:12px 14px;
  border:none;outline:none;
  resize:none;
  caret-color:var(--green);
  tab-size:2;
  overflow-y:auto;
  white-space:pre;
  overflow-x:auto;
}
textarea#editor::selection{background:rgba(0,255,65,.15)}

/* ── TERMINAL PANEL ── */
.terminal-panel{
  flex:1;
  display:flex;flex-direction:column;
  background:var(--bg);
  overflow:hidden;
}
#output{
  flex:1;
  padding:14px 18px;
  font-size:12px;
  line-height:1.65;
  overflow-y:auto;
  overflow-x:auto;
  white-space:pre-wrap;
  word-break:break-word;
}
.line-out{color:var(--text)}
.line-err{color:var(--err)}
.line-sys{color:var(--dim)}
.line-ok{color:var(--green)}
.cursor-line::after{content:'_';animation:blink 1s infinite;color:var(--green)}

/* ── BOTTOM BAR ── */
.bottom-bar{
  flex-shrink:0;
  padding:9px 20px;
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
  background:var(--surface);
  position:relative;z-index:50;
}
.btn{
  font-family:var(--font);font-size:11px;letter-spacing:.1em;
  padding:7px 18px;border:1px solid var(--border);
  background:none;color:var(--muted);cursor:pointer;transition:all .15s;
}
.btn-run{border-color:var(--green);color:var(--green)}
.btn-run:hover{background:var(--green);color:var(--bg)}
.btn:hover:not(.btn-run){border-color:var(--dim);color:var(--text)}
.btn-sep{flex:1}
.status-msg{font-size:10px;letter-spacing:.12em;color:var(--muted);transition:color .3s}
.status-msg.ok{color:var(--green)}
.status-msg.err{color:var(--err)}

/* ── HINT BOX ── */
.hint-box{
  position:absolute;bottom:64px;right:20px;
  max-width:310px;
  background:var(--surface2);border:1px solid var(--border);
  padding:14px 16px;font-size:11px;color:var(--text);line-height:1.65;
  z-index:300;animation:scanIn .2s ease;display:none;
}
.hint-box.show{display:block}
.hint-box b{color:var(--amber)}
.hint-close{position:absolute;top:6px;right:10px;cursor:pointer;color:var(--muted);font-size:13px}
.hint-close:hover{color:var(--text)}

/* ── SUCCESS OVERLAY ── */
.success-overlay{
  position:fixed;inset:0;background:rgba(0,5,0,.9);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:5000;
}
.success-overlay.show{display:flex}
.success-box{
  border:1px solid var(--green);padding:40px 56px;
  text-align:center;position:relative;background:var(--surface);
}
.success-box::before{content:'';position:absolute;inset:6px;border:1px solid var(--border2)}
.success-title{font-size:32px;color:var(--green);letter-spacing:.08em;text-shadow:0 0 20px rgba(0,255,65,.4);margin-bottom:12px}
.success-msg{font-size:11px;color:var(--muted);letter-spacing:.04em;line-height:1.65;max-width:380px}
.success-next{
  margin-top:24px;font-size:11px;border:1px solid var(--green);
  color:var(--green);padding:10px 28px;cursor:pointer;
  background:none;font-family:var(--font);letter-spacing:.12em;transition:all .15s;
}
.success-next:hover{background:var(--green);color:var(--bg)}

@media(max-width:700px){
  .split{flex-direction:column}
  .editor-panel{width:100%;height:45%;border-right:none;border-bottom:1px solid var(--border)}
  .progress-wrap{display:none}
}
</style>
</head>
<body>

<!-- LESSON BAR -->
<div class="lesson-bar" id="lesson-bar">
  <div class="lesson-title" id="lesson-title"></div>
  <div class="lesson-task" id="lesson-task"></div>
</div>

<!-- SPLIT AREA -->
<div class="split">

  <!-- EDITOR -->
  <div class="editor-panel">
    <div class="panel-header">
      <div class="panel-dot green"></div>
      <span>EDYTOR — skrypt.sh</span>
    </div>
    <div class="editor-body">
      <div class="line-nums" id="line-nums"></div>
      <textarea id="editor" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></textarea>

  <!-- TERMINAL -->

      <div class="panel-dot"></div>

<span class="cursor-line"></span></div>

</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="btn btn-run" onclick="runScript()">&#9654; URUCHOM</button>
  <button class="btn" onclick="resetEditor()">&#8635; RESETUJ</button>

  <div class="btn-sep"></div>

</div>

<!-- HINT -->
<div class="hint-box" id="hint-box">

  <span id="hint-text"></span>
</div>

<!-- SUCCESS -->
<div class="success-overlay" id="success-overlay">
  <div class="success-box">
    <div class="success-title">ZALICZONE_</div>
    <div class="success-msg" id="success-msg"></div>
    <button class="success-next" id="success-next-btn">NASTĘPNA LEKCJA &#8594;</button>
  </div>
</div>

<script>
// ─── LESSONS ───────────────────────────────────────────────────────────
const LESSONS = [
  {
    title: 'LEKCJA 1 — HELLO WORLD',
    task: 'Napisz swój pierwszy skrypt Bash. Każdy skrypt zaczyna się od <code>#!/bin/bash</code> (shebang). Użyj <code>echo</code> żeby wypisać dokładnie: <b>Hello, World!</b>',
    starter: '#!/bin/bash\n# Twój pierwszy skrypt Bash\n\n',
    hint: '<b>#!/bin/bash</b> — shebang, mówi systemowi jaki interpreter użyć\n<b>echo "tekst"</b> — wypisuje tekst na ekran\n\nPrzykład:\n<b>echo "Hello, World!"</b>',
    check: (code, out) => out.includes('Hello, World!'),
    ok: 'echo wypisuje tekst. Shebang #!/bin/bash to obowiązkowy nagłówek każdego skryptu Bash.'
  },
  {
    title: 'LEKCJA 2 — ZMIENNE',
    task: 'Utwórz zmienną <code>imie="Jan"</code> i wypisz ją: <code>echo "Cześć, $imie!"</code>. Zmienne tworzymy bez spacji wokół znaku =.',
    starter: '#!/bin/bash\n\nimie="Jan"\n\necho "Cześć, $imie!"\n',
    hint: '<b>imie="Jan"</b> — przypisanie (bez spacji!)\n<b>$imie</b> lub <b>${imie}</b> — odczyt zmiennej\n\nW podwójnych cudzysłowach <b>" "</b> zmienne są rozwijane.\nW pojedynczych <b>\' \'</b> — nie są.',
    check: (code, out) => (/Cześć,\s*\S+/.test(out) || out.includes('Czesc')) && /\$\w+/.test(code),
    ok: 'Zmienne w Bash: przypisujesz przez VAR=wartość (bez spacji), odczytujesz przez $VAR.'
  },
  {
    title: 'LEKCJA 3 — ARYTMETYKA',
    task: 'Utwórz zmienne <code>a=10</code> i <code>b=3</code>. Wypisz wyniki:\n<code>echo "Suma: $((a + b))"</code>\n<code>echo "Reszta: $((a % b))"</code>',
    starter: '#!/bin/bash\n\na=10\nb=3\n\necho "Suma: $((a + b))"\necho "Iloczyn: $((a * b))"\necho "Reszta: $((a % b))"\n',
    hint: '<b>$(( wyrażenie ))</b> — obliczenia matematyczne\n\nOperatory: <b>+ - * / %</b>\n\nPrzykład:\n<b>echo "$((10 / 3))"</b>   # 3\n<b>echo "$((10 % 3))"</b>  # 1',
    check: (code, out) => out.includes('Suma:') && out.includes('13') && /\$\(\(/.test(code),
    ok: 'Arytmetyka w Bash: $(( )). Działa z +, -, *, /, % (modulo). Wynik zawsze całkowity.'
  },
  {
    title: 'LEKCJA 4 — WARUNEK IF',
    task: 'Sprawdź czy liczba jest większa od 10. Struktura:\n<code>if [ $x -gt 10 ]; then</code>\n<code>  echo "..."</code>\n<code>else</code>\n<code>  echo "..."</code>\n<code>fi</code>',
    starter: '#!/bin/bash\n\nx=15\n\nif [ $x -gt 10 ]; then\n  echo "Duża liczba"\nelse\n  echo "Mała liczba"\nfi\n',
    hint: 'Operatory porównania liczb:\n<b>-gt</b> &gt; | <b>-lt</b> &lt; | <b>-eq</b> == | <b>-ne</b> !=\n<b>-ge</b> &gt;= | <b>-le</b> &lt;=\n\n⚠ Spacje wewnątrz [ ] są OBOWIĄZKOWE!\n[ $x -gt 10 ] ✓\n[$x -gt 10] ✗',
    check: (code, out) => (out.includes('Duża liczba') || out.includes('Mała liczba')) && /if\s*\[/.test(code) && /\bfi\b/.test(code),
    ok: 'Warunek if: [ ] to test, spacje wewnątrz wymagane. Kończymy blokiem fi.'
  },
  {
    title: 'LEKCJA 5 — PĘTLA FOR (LISTA)',
    task: 'Wypisz owoce z listy używając pętli for:\n<code>for owoc in jabłko gruszka śliwka; do</code>\n<code>  echo "Owoc: $owoc"</code>\n<code>done</code>',
    starter: '#!/bin/bash\n\nfor owoc in jablko gruszka sliwka; do\n  echo "Owoc: $owoc"\ndone\n',
    hint: '<b>for zmienna in lista; do</b>\n  polecenia\n<b>done</b>\n\nKażdy element trafia do zmiennej po kolei.\n\n<b>for plik in *.txt; do\n  echo $plik\ndone</b>',
    check: (code, out) => (['jablko','gruszka','sliwka'].every(c => out.includes(c)) || ['jabłko','gruszka','śliwka'].every(c => out.includes(c))) && /\bfor\b/.test(code) && /\bdo\b/.test(code),
    ok: 'Pętla for iteruje po liście elementów. Każdy element trafia do zmiennej (tu: $owoc).'
  },
  {
    title: 'LEKCJA 6 — PĘTLA FOR (ZAKRES)',
    task: 'Wypisz liczby od 1 do 5 używając zakresu <code>{1..5}</code>. Format: <b>Liczba: N</b> dla każdej.',
    starter: '#!/bin/bash\n\nfor i in {1..5}; do\n  echo "Liczba: $i"\ndone\n',
    hint: '<b>{1..10}</b> — zakres od 1 do 10\n<b>{1..10..2}</b> — co 2 (1,3,5,7,9)\n<b>{a..z}</b> — zakres liter\n\nAlternatywnie:\n<b>for i in $(seq 1 5); do</b>',
    check: (code, out) => [1,2,3,4,5].every(n => out.includes('Liczba: '+n)) && /\bfor\b/.test(code) && /\bdo\b/.test(code),
    ok: '{1..N} to wygodny zakres numeryczny. Pętla for to jedno z najczęstszych narzędzi w Bash!'
  },
  {
    title: 'LEKCJA 7 — PĘTLA WHILE',
    task: 'Wypisz odliczanie od 5 do 1, a potem <b>START!</b>. Używaj <code>((n--))</code> do zmniejszania zmiennej.',
    starter: '#!/bin/bash\n\nn=5\n\nwhile [ $n -gt 0 ]; do\n  echo "Odliczanie: $n"\n  ((n--))\ndone\n\necho "START!"\n',
    hint: '<b>while [ warunek ]; do</b>\n  polecenia\n<b>done</b>\n\n<b>((n--))</b> zmniejsza n o 1\n<b>((n++))</b> zwiększa n o 1\n<b>((n+=5))</b> dodaje 5\n\n⚠ Pamiętaj o zmianie warunku!',
    check: (code, out) => out.includes('START!') && out.includes('Odliczanie: 5') && out.includes('Odliczanie: 1') && /\bwhile\b/.test(code) && /\bdo\b/.test(code),
    ok: 'Pętla while działa dopóki warunek jest true. Zawsze dbaj o zmianę warunku, żeby nie było pętli nieskończonej!'
  },
  {
    title: 'LEKCJA 8 — FUNKCJE',
    task: 'Napisz funkcję <code>powitanie()</code> która przyjmuje argument i wypisuje <b>Cześć, [argument]!</b>. Wywołaj ją dwukrotnie z różnymi imionami.',
    starter: '#!/bin/bash\n\npowitanie() {\n  echo "Cześć, $1!"\n}\n\npowitanie "Anna"\npowitanie "Marek"\n',
    hint: '<b>nazwa() {</b>\n  polecenia\n<b>}</b>\n\nParametry funkcji:\n<b>$1</b> — pierwszy argument\n<b>$2</b> — drugi argument\n<b>$@</b> — wszystkie argumenty\n\nWywołanie: <b>nazwa argument1 argument2</b>',
    check: (code, out) => {
      const lines = out.trim().split('\n').filter(l => l.includes('Cześć'));
      return lines.length >= 2 && /\w+\s*\(\)\s*\{/.test(code);
    },
    ok: 'Funkcje: definiujesz przez nazwa() { ... }, parametry to $1, $2... Wywołujesz podając nazwę i argumenty.'
  },
  {
    title: 'LEKCJA 9 — ARGUMENTY SKRYPTU',
    task: 'Skrypt przyjmuje argumenty z wiersza poleceń: <code>$1</code>, <code>$2</code>, <code>$#</code> (liczba), <code>$@</code> (wszystkie). Wypisz je wszystkie.',
    starter: '#!/bin/bash\n\necho "Skrypt: $0"\necho "Liczba argumentów: $#"\necho "Pierwszy: $1"\necho "Drugi: $2"\necho "Wszystkie: $@"\n',
    hint: '<b>$0</b> — nazwa skryptu\n<b>$1, $2...</b> — kolejne argumenty\n<b>$#</b> — liczba argumentów\n<b>$@</b> — wszystkie argumenty\n\nUruchomienie:\n<b>./skrypt.sh Jan Kowalski 25</b>\nWtedy $1=Jan, $2=Kowalski, $3=25',
    check: (code, out) => out.includes('Skrypt:') || out.includes('Liczba argumentów:') || out.includes('Pierwszy:'),
    ok: 'Argumenty pozycyjne $1..$N, $# to liczba argumentów, $@ to wszystkie. Podstawa elastycznych skryptów!'
  },
  {
    title: 'LEKCJA 10 — SKRYPT KOŃCOWY',
    task: 'Napisz skrypt z tablicą <code>owoce=("jabłko" "kiwi" "arbuz")</code>. Iteruj po tablicy i dla każdego owocu sprawdź czy jego długość jest większa niż 4 znaki. Wypisz odpowiedź.',
    starter: '#!/bin/bash\n\nowoce=("jablko" "kiwi" "arbuz" "banan")\n\nfor owoc in "${owoce[@]}"; do\n  dlugosc=${#owoc}\n  if [ $dlugosc -gt 4 ]; then\n    echo "$owoc: długa ($dlugosc)"\n  else\n    echo "$owoc: krótka ($dlugosc)"\n  fi\ndone\n',
    hint: '<b>tablica=("a" "b" "c")</b> — definicja tablicy\n<b>"${tablica[@]}"</b> — wszystkie elementy\n<b>${#zmienna}</b> — długość stringa\n<b>${#tablica[@]}</b> — liczba elementów\n\nUżywaj cudzysłowów przy "${tablica[@]}" żeby obsłużyć spacje w elementach!',
    check: (code, out) => (out.includes('długa') || out.includes('krótka')) && (out.includes('jablko') || out.includes('jabłko') || out.includes('kiwi')),
    ok: 'Brawo! Tablice, pętle, warunki, długość stringa — to solidna podstawa Bash. Jesteś gotowy na egzamin INF02!'
  }
];

// ─── STATE ─────────────────────────────────────────────────────────────
let currentLesson = 0;
let progress = JSON.parse(localStorage.getItem('hl-bash2') || '[]');

// ─── BASH INTERPRETER ──────────────────────────────────────────────────
function runBash(code) {
  const output = [];
  const env = {};
  const arrays = {};
  const funcs = {};

  function emit(text, cls) { output.push({text: String(text), cls: cls||'line-out'}); }
  function emitErr(t) { emit(t, 'line-err'); }

  function expand(s) {
    s = String(s);
    // ${#var} length
    s = s.replace(/\$\{#(\w+)\}/g, (_, v) => (env[v]||'').length);
    // ${array[@]}
    s = s.replace(/\$\{(\w+)\[@\]\}/g, (_, v) => (arrays[v]||[]).join(' '));
    // ${#array[@]}
    s = s.replace(/\$\{#(\w+)\[@\]\}/g, (_, v) => (arrays[v]||[]).length);
    // $(( expr ))
    s = s.replace(/\$\(\(([^)]+)\)\)/g, (_, expr) => {
      try { return String(evalExpr(expr)); } catch(e){ return '0'; }
    });
    // $# $@ $0
    s = s.replace(/\$#/g, env['#']||'0');
    s = s.replace(/\$@/g, env['@']||'');
    s = s.replace(/\$0/g, 'skrypt.sh');
    // ${var}
    s = s.replace(/\$\{(\w+)\}/g, (_, v) => env[v]!==undefined ? env[v] : '');
    // $var (word chars only)
    s = s.replace(/\$([a-zA-Z_]\w*|\d)/g, (_, v) => env[v]!==undefined ? env[v] : '');
    return s;
  }

  function evalExpr(expr) {
    const e = expr.replace(/([a-zA-Z_]\w*)/g, v => {
      const n = Number(env[v]);
      return isNaN(n) ? '0' : String(n);
    });
    return Function('"use strict";return ('+e+')')();
  }

  function stripQuotes(s) {
    s = s.trim();
    if ((s[0]==='"'&&s[s.length-1]==='"')||(s[0]==="'"&&s[s.length-1]==="'"))
      return s.slice(1,-1);
    return s;
  }

  function tokenize(line) {
    const tokens = []; let cur='', inD=false, inS=false;
    for (let c of line) {
      if (c==='"' && !inS){inD=!inD;continue;}
      if (c==="'" && !inD){inS=!inS;continue;}
      if (c===' ' && !inD && !inS){if(cur){tokens.push(cur);cur='';} continue;}
      cur+=c;
    }
    if(cur) tokens.push(cur);
    return tokens;
  }

  function parseArrayLit(s) {
    s = s.trim();
    if(!s.startsWith('(')) return [];
    const inner = s.slice(1, s.lastIndexOf(')'));
    const items=[]; let cur='', inQ=false, qt='';
    for(let c of inner) {
      if((c==='"'||c==="'")&&!inQ){inQ=true;qt=c;continue;}
      if(c===qt&&inQ){inQ=false;items.push(cur);cur='';continue;}
      if(c===' '&&!inQ){if(cur){items.push(cur);cur='';} continue;}
      cur+=c;
    }
    if(cur) items.push(cur);
    return items;
  }

  function evalCond(s) {
    s = s.trim();
    if(s.startsWith('[')&&s.endsWith(']')) s=s.slice(1,-1).trim();
    const numOp = s.match(/^(.+?)\s+(-gt|-lt|-eq|-ne|-ge|-le)\s+(.+)$/);
    if(numOp) {
      const a=Number(expand(numOp[1].trim())), b=Number(expand(numOp[3].trim())), op=numOp[2];
      return op==='-gt'?a>b:op==='-lt'?a<b:op==='-eq'?a===b:op==='-ne'?a!==b:op==='-ge'?a>=b:a<=b;
    }
    const strOp = s.match(/^(.+?)\s+(==|!=)\s+(.+)$/);
    if(strOp) {
      const a=expand(stripQuotes(strOp[1].trim())), b=expand(stripQuotes(strOp[3].trim()));
      return strOp[2]==='=='?a===b:a!==b;
    }
    if(s.startsWith('-z ')) return !expand(stripQuotes(s.slice(3).trim()));
    if(s.startsWith('-n ')) return !!expand(stripQuotes(s.slice(3).trim()));
    return false;
  }

  function evalArith(expr) {
    const postInc=expr.match(/^(\w+)\+\+$/);
    if(postInc){env[postInc[1]]=String(Number(env[postInc[1]]||0)+1);return;}
    const postDec=expr.match(/^(\w+)--$/);
    if(postDec){env[postDec[1]]=String(Number(env[postDec[1]]||0)-1);return;}
    const comp=expr.match(/^(\w+)([+\-*\/])=(.+)$/);
    if(comp){
      const cur=Number(env[comp[1]]||0),rhs=Number(expand(comp[3]));
      const op=comp[2];
      env[comp[1]]=String(op==='+'?cur+rhs:op==='-'?cur-rhs:op==='*'?cur*rhs:Math.floor(cur/rhs));
      return;
    }
    try{evalExpr(expr);}catch(e){}
  }

  function execBlock(lines, start, end) {
    let i=start;
    while(i<=end&&i<lines.length) {
      const raw=lines[i], t=raw.trim();
      if(!t||t.startsWith('#')||t==='#!/bin/bash'){i++;continue;}

      if(t.startsWith('if ')||t==='if ['){
        const r=handleIf(lines,i,end);i=r;continue;
      }
      if(t.startsWith('for ')){const r=handleFor(lines,i,end);i=r;continue;}
      if(t.startsWith('while ')){const r=handleWhile(lines,i,end);i=r;continue;}
      if(/^\w+\s*\(\)\s*\{?$/.test(t)||/^\w+\(\)\{$/.test(t)){const r=handleFuncDef(lines,i,end);i=r;continue;}
      if(t==='done'||t==='fi'||t==='else'||t==='}'||t==='{'){i++;continue;}
      if(t.startsWith('((')){
        const inner=t.slice(2,t.length-2).trim();
        evalArith(inner);i++;continue;
      }
      // assignment (including array)
      const asgn=t.match(/^([a-zA-Z_]\w*)=(.*)$/);
      if(asgn&&!t.startsWith('echo')){
        const nm=asgn[1], rhs=asgn[2].trim();
        if(rhs.startsWith('(')){
          arrays[nm]=parseArrayLit(rhs);
          env[nm]=arrays[nm].join(' ');
        } else {
          env[nm]=expand(stripQuotes(rhs));
        }
        i++;continue;
      }
      if(t.startsWith('echo')){
        const rest=t.slice(4).trim();
        // handle -n flag
        const noNewline=rest.startsWith('-n ');
        const txt=expand(stripQuotes(noNewline?rest.slice(3):rest));
        emit(txt);i++;continue;
      }
      if(t.startsWith('printf ')){
        emit(expand(stripQuotes(t.slice(7))).replace(/\\n/g,'\n'));i++;continue;
      }
      // function call
      const parts=tokenize(t);
      if(funcs[parts[0]]){
        const args=parts.slice(1).map(a=>expand(stripQuotes(a)));
        const saved={};
        args.forEach((a,idx)=>{saved[idx+1]=env[idx+1];env[String(idx+1)]=a;});
        saved['#']=env['#'];saved['@']=env['@'];
        env['#']=String(args.length);env['@']=args.join(' ');
        execBlock(funcs[parts[0]],0,funcs[parts[0]].length-1);
        args.forEach((_,idx)=>{
          if(saved[idx+1]!==undefined)env[String(idx+1)]=saved[idx+1];
          else delete env[String(idx+1)];
        });
        if(saved['#']!==undefined)env['#']=saved['#'];
        if(saved['@']!==undefined)env['@']=saved['@'];
        i++;continue;
      }
      if(t.startsWith('read ')){const v=t.split(' ')[1];if(v)env[v]=env[v]||'(input)';i++;continue;}
      // skip unknown
      i++;
    }
  }

  function handleFuncDef(lines, startIdx, endIdx) {
    const h=lines[startIdx].trim();
    const nm=h.match(/^(\w+)/)[1];
    let body=[],depth=h.includes('{')?1:0,i=startIdx+(depth>0?1:0);
    if(depth===0){i=startIdx+1;}
    while(i<=endIdx){
      const t2=lines[i].trim();
      if(t2==='{'){depth++;i++;continue;}
      if(t2==='}'){depth--;if(depth<=0){i++;break;}}
      if(depth>0)body.push(lines[i]);
      i++;
    }
    funcs[nm]=body;
    return i;
  }

  function handleIf(lines, startIdx, endIdx) {
    const ifLine=lines[startIdx].trim();
    let cond=ifLine.replace(/^if\s+/,'').replace(/;\s*then$/,'').replace(/;$/,'').trim();
    let thenL=[],elseL=[],inElse=false,depth=1,i=startIdx+1;
    while(i<=endIdx){
      const t=lines[i].trim();
      if(t.startsWith('if '))depth++;
      if(t==='fi'){depth--;if(depth===0){i++;break;}}
      if(depth===1&&(t==='else'||t.startsWith('elif '))){inElse=true;i++;continue;}
      (inElse?elseL:thenL).push(lines[i]);
      i++;
    }
    evalCond(cond)?execBlock(thenL,0,thenL.length-1):execBlock(elseL,0,elseL.length-1);
    return i;
  }

  function handleFor(lines, startIdx, endIdx) {
    const fLine=lines[startIdx].trim();
    const m=fLine.match(/^for\s+(\w+)\s+in\s+(.+?)(?:;\s*do)?$/);
    if(!m)return startIdx+1;
    const varN=m[1];let listStr=m[2].trim().replace(/;\s*do$/,'').trim();
    let items=[];
    const range=listStr.match(/^\{(\d+)\.\.(\d+)(?:\.\.(\d+))?\}$/);
    if(range){
      const from=parseInt(range[1]),to=parseInt(range[2]),step=range[3]?parseInt(range[3]):1;
      for(let n=from;n<=to;n+=step)items.push(String(n));
    } else if(listStr.includes('@]}')){
      const an=listStr.match(/\$\{?(\w+)\[@\]\}?/)?.[1];
      if(an&&arrays[an])items=[...arrays[an]];
    } else {
      items=expand(listStr).split(/\s+/).filter(Boolean).map(s=>stripQuotes(s));
    }
    let body=[],depth=1,i=startIdx+1;
    while(i<=endIdx){
      const t=lines[i].trim();
      if(t.startsWith('for ')||t.startsWith('while '))depth++;
      if(t==='done'){depth--;if(depth===0){i++;break;}}
      body.push(lines[i]);i++;
    }
    for(const item of items){env[varN]=item;execBlock(body,0,body.length-1);}
    return i;
  }

  function handleWhile(lines, startIdx, endIdx) {
    const wLine=lines[startIdx].trim();
    const m=wLine.match(/^while\s+(.+?)(?:;\s*do)?$/);
    if(!m)return startIdx+1;
    let cond=m[1].trim().replace(/;\s*do$/,'').trim();
    let body=[],depth=1,i=startIdx+1;
    while(i<=endIdx){
      const t=lines[i].trim();
      if(t.startsWith('while ')||t.startsWith('for '))depth++;
      if(t==='done'){depth--;if(depth===0){i++;break;}}
      body.push(lines[i]);i++;
    }
    let guard=0;
    while(evalCond(cond)&&guard++<300){execBlock(body,0,body.length-1);}
    return i;
  }

  const scriptLines=code.split('\n');
  execBlock(scriptLines,0,scriptLines.length-1);
  return output;
}

// ─── UI ────────────────────────────────────────────────────────────────
const editorEl = document.getElementById('editor');
const outputEl = document.getElementById('output');
const lineNumsEl = document.getElementById('line-nums');
const progressFill = document.getElementById('progress-fill');
const lessonCounter = document.getElementById('lesson-counter');
const statusMsg = document.getElementById('status-msg');

function updateLineNums() {
  const n = editorEl.value.split('\n').length;
  let html = '';
  for(let i=1;i<=n;i++) html += `<div>${i}</div>`;
  lineNumsEl.innerHTML = html;
  lineNumsEl.scrollTop = editorEl.scrollTop;
}

editorEl.addEventListener('input', updateLineNums);
editorEl.addEventListener('scroll', () => { lineNumsEl.scrollTop = editorEl.scrollTop; });
editorEl.addEventListener('keydown', e => {
  if(e.key==='Tab'){
    e.preventDefault();
    const s=editorEl.selectionStart, v=editorEl.value;
    editorEl.value=v.slice(0,s)+'  '+v.slice(editorEl.selectionEnd);
    editorEl.selectionStart=editorEl.selectionEnd=s+2;
    updateLineNums();
  }
});

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setStatus(msg, cls) {
  statusMsg.textContent = msg;
  statusMsg.className = 'status-msg'+(cls?' '+cls:'');
}

function goLesson(n) {
  if(n<0||n>=LESSONS.length) return;
  currentLesson=n;
  loadLesson();
}

function loadLesson() {
  const L=LESSONS[currentLesson];
  document.getElementById('lesson-title').textContent=L.title;
  document.getElementById('lesson-task').innerHTML=L.task;
  editorEl.value=L.starter;
  updateLineNums();
  outputEl.innerHTML='<span class="line-sys">// Napisz skrypt i kliknij URUCHOM</span>\n<span class="cursor-line"></span>';
  setStatus('GOTOWY');
  hideHint();
  document.getElementById('btn-prev').disabled=currentLesson===0;
  document.getElementById('btn-next').disabled=currentLesson===LESSONS.length-1;
  lessonCounter.textContent=`${currentLesson+1} / ${LESSONS.length}`;
  const done=progress.filter(Boolean).length;
  progressFill.style.width=(done/LESSONS.length*100)+'%';
}

function runScript() {
  const code=editorEl.value;
  if(!code.trim()){setStatus('PUSTY SKRYPT','err');return;}
  outputEl.innerHTML='<span class="line-sys">$ bash skrypt.sh</span>\n';
  setStatus('URUCHAMIANIE...','');
  setTimeout(()=>{
    try{
      const lines=runBash(code);
      let html='<span class="line-sys">$ bash skrypt.sh</span>\n';
      if(lines.length===0){
        html+='<span class="line-sys">// (brak wyjścia)</span>\n';
      } else {
        for(const {text,cls} of lines){
          html+=`<span class="${cls}">${escHtml(text)}</span>\n`;
        }
      }
      html+='<span class="cursor-line"></span>';
      outputEl.innerHTML=html;
      outputEl.scrollTop=outputEl.scrollHeight;
      const outText=lines.map(l=>l.text).join('\n');
      const L=LESSONS[currentLesson];
      if(L.check(code,outText)){
        setStatus('ZALICZONE!','ok');
        progress[currentLesson]=true;
        localStorage.setItem('hl-bash2',JSON.stringify(progress));
        setTimeout(()=>showSuccess(L.ok),700);
      } else {
        setStatus('URUCHOMIONO — SPRAWDŹ WYJŚCIE','');
      }
    }catch(err){
      outputEl.innerHTML+='<span class="line-err">BŁĄD: '+escHtml(err.message)+'</span>\n';
      setStatus('BŁĄD','err');
    }
  },80);
}

function resetEditor(){
  editorEl.value=LESSONS[currentLesson].starter;
  updateLineNums();
  outputEl.innerHTML='<span class="line-sys">// Skrypt zresetowany</span>\n<span class="cursor-line"></span>';
  setStatus('ZRESETOWANO');
}

function showHint(){
  document.getElementById('hint-text').innerHTML=LESSONS[currentLesson].hint;
  document.getElementById('hint-box').classList.add('show');
}
function hideHint(){document.getElementById('hint-box').classList.remove('show');}

function showSuccess(msg){
  document.getElementById('success-msg').textContent=msg;
  const ov=document.getElementById('success-overlay');
  ov.classList.add('show');
  const btn=document.getElementById('success-next-btn');
  if(currentLesson>=LESSONS.length-1){
    btn.textContent='KONIEC KURSU ✓';
    btn.onclick=()=>ov.classList.remove('show');
  } else {
    btn.textContent='NASTĘPNA LEKCJA →';
    btn.onclick=nextLesson;
  }
}

function nextLesson(){
  document.getElementById('success-overlay').classList.remove('show');
  if(currentLesson<LESSONS.length-1) goLesson(currentLesson+1);
}

// INIT
loadLesson();
</script>
</body>
</html>
