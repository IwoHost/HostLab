<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0c0c0c;
  --surface: #141414;
  --text-primary: #f0f0ee;
  --text-secondary: #888884;
  --text-muted: #3a3a38;
  --border: #222220;
  --accent: #f0f0ee;
  --tag-bg: #1a1a18;
  --font-display: 'Syne', sans-serif;
  --font-mono: 'Syne Mono', monospace;
  --switch-track: #2a2a28;
  --switch-thumb: #555550;
}

html.light {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --text-primary: #0f0f0f;
  --text-secondary: #6b6b6b;
  --text-muted: #b0b0b0;
  --border: #e8e6e0;
  --accent: #0f0f0f;
  --tag-bg: #efefeb;
  --switch-track: #d0ceca;
  --switch-thumb: #888884;
}

html, body, header, footer, .card, .card-thumb, .card-body, .card-footer, .hero, .grid-header, .count-badge {
  transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-display);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
header {
  padding: 48px 64px 0;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding-bottom: 24px;
}

.logo {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.12em;
  color: var(--text-primary);
  text-decoration: none;
}

.logo span { color: var(--text-muted); }

.header-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.08em;
}

/* ── HERO ── */
.hero {
  padding: 80px 64px 64px;
  border-bottom: 1px solid var(--border);
}

.hero-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 20px;
}

.hero h1 {
  font-size: clamp(56px, 8vw, 96px);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 0.95;
  color: var(--text-primary);
}

.hero h1 em {
  font-style: normal;
  color: var(--text-muted);
}

.hero-sub {
  margin-top: 28px;
  font-size: 15px;
  color: var(--text-secondary);
  max-width: 400px;
  line-height: 1.6;
}

/* ── GRID ── */
.grid-header {
  padding: 36px 64px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.grid-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  text-transform: uppercase;
}

.count-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  background: var(--tag-bg);
  padding: 4px 10px;
  border-radius: 100px;
}

.tag-chip {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  padding: 5px 14px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  text-transform: uppercase;
}
.tag-chip:hover { color: var(--text-secondary); border-color: var(--text-muted); }
.tag-chip.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }


.grid {
  padding: 0 64px 80px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 2px;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  overflow: hidden;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  display: flex;
  flex-direction: column;
  transition: transform 0.25s cubic-bezier(.22,.61,.36,1), box-shadow 0.25s ease;
}

.card:hover {
  z-index: 1;
  position: relative;
}


.card-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  background: var(--tag-bg);
  overflow: hidden;
  position: relative;
}

.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.card-thumb-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
  background: repeating-linear-gradient(
    45deg,
    var(--tag-bg) 0px,
    var(--tag-bg) 8px,
    var(--border) 8px,
    var(--border) 9px
  );
}

.card-body {
  padding: 20px 24px 24px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}

.card-meta-text {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.card-index {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
}

.card-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  line-height: 1.2;
}

.card-icon {
  width: 36px;
  height: 36px;
  min-width: 36px;
  border-radius: 8px;
  overflow: hidden;
}

.card-icon img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  border-radius: 6px;
}

html.light .card-icon img {
  filter: none;
}

.card-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;
  flex: 1;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.card-filename {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.05em;
}

.card-arrow {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s, border-color 0.2s;
}

.card:hover .card-arrow {
  background: var(--accent);
  border-color: var(--accent);
}

.card-arrow svg {
  transition: stroke 0.2s;
}

.card:hover .card-arrow svg path {
  stroke: #fff;
}

/* ── NAV LINKS ── */
.nav-link {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.2s;
}
.nav-link:hover { color: var(--text-secondary); }

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  padding: 24px 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.footer-left {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
}

.footer-right {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 20px;
}

/* outbound link — marked with an arrow so it reads as leaving the site */
.footer-link {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: color 0.2s ease;
}
.footer-link:hover { color: var(--text-primary); }
.footer-link:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
.footer-link svg { transition: transform 0.2s cubic-bezier(.4,0,.2,1); }
.footer-link:hover svg { transform: translate(2px, -2px); }

/* ── LOADING STATE ── */
.card-desc.loading {
  background: var(--tag-bg);
  border-radius: 4px;
  height: 14px;
  color: transparent;
  animation: shimmer 1.4s infinite;
}

@keyframes shimmer {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* ── THEME SWITCH ── */
.theme-switch { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
.switch-label { font-family:var(--font-mono); font-size:10px; color:var(--text-muted); letter-spacing:0.12em; text-transform:uppercase; transition:color 0.35s ease; }
.switch-track { width:36px; height:20px; background:var(--switch-track); border-radius:100px; border:1px solid var(--border); position:relative; flex-shrink:0; transition:background 0.35s ease, border-color 0.35s ease; }
.switch-thumb { position:absolute; top:3px; left:3px; width:12px; height:12px; border-radius:50%; background:var(--switch-thumb); transition:transform 0.3s ease, background 0.35s ease; }
html.light .switch-thumb { transform:translateX(16px); background:#0f0f0f; }
.card-arrow svg path { stroke:#f0f0ee; }
html.light .card-arrow svg path { stroke:#0f0f0f; }
.card:hover .card-arrow { background:var(--accent); border-color:var(--accent); }
.card:hover .card-arrow svg path { stroke:#0c0c0c; }
html.light .card:hover .card-arrow svg path { stroke:#ffffff; }
.card:hover { box-shadow:0 12px 40px rgba(0,0,0,0.5); }
html.light .card:hover { box-shadow:0 12px 40px rgba(0,0,0,0.08); }

/* ── HEADER RIGHT ── */
.header-right { display: flex; align-items: center; gap: 24px; }

/* ── SEARCH ── */
.search {
  margin-left: auto;          /* pushed to the right of the tag chips */
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 5px 11px;
  border: 1px solid var(--border);
  border-radius: 100px;
  background: transparent;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.search:focus-within {
  border-color: var(--text-muted);
  background: var(--tag-bg);
}
.search > svg {
  flex-shrink: 0;
  color: var(--text-muted);
  transition: color 0.2s ease;
}
.search:focus-within > svg { color: var(--text-secondary); }

.search input {
  width: 96px;
  border: 0;
  outline: 0;
  background: transparent;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-primary);
  transition: width 0.28s cubic-bezier(.22,.61,.36,1);
}
.search input::placeholder { color: var(--text-muted); text-transform: uppercase; }
/* type=search draws its own clear button in Chrome — we have our own */
.search input::-webkit-search-cancel-button,
.search input::-webkit-search-decoration {
  -webkit-appearance: none;
          appearance: none;
  display: none;
}
.search:focus-within input, .search.has-text input { width: 150px; }

/* clear button, only once something is typed */
.search-clear {
  display: none;
  flex-shrink: 0;
  width: 14px;
  height: 14px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--text-muted);
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 14px;
  cursor: pointer;
  transition: background 0.2s ease;
}
.search.has-text .search-clear { display: block; }
.search-clear:hover { background: var(--text-secondary); }
.search-clear:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

/* nothing matched */
.no-match {
  grid-column: 1 / -1;
  padding: 48px 0 56px;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--text-muted);
}
.no-match b { color: var(--text-secondary); font-weight: 400; }

/* ── INTERACTION ── (shared rules live in other/cardmotion.css) */
.card:hover { border-color: var(--text-muted); }
.card:hover { z-index: 1; }

/* a hairline under each grid label — static, just structure */
.grid-header { position: relative; }
.grid-header::after {
  content: '';
  position: absolute;
  left: 64px; right: 64px; bottom: 0;
  height: 1px;
  background: var(--border);
}

@media (prefers-reduced-motion: reduce) {
  .tag-chip, .card-arrow, .section-arrow { transition: none !important; }
}

/* ── SECTION TILES ── */
.sections {
  padding: 20px 64px 44px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
}

.section-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  text-decoration: none;
  color: inherit;
  padding: 26px 22px 20px;
  min-height: 190px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s cubic-bezier(.22,.61,.36,1);
}

/* accent rule along the top — grows across the tile on hover */
.section-card .bar {
  position: absolute;
  top: -1px; left: -1px;
  height: 2px;
  width: 40px;
  z-index: 3;
  background: var(--sec, var(--accent));
  transition: width 0.35s cubic-bezier(.4,0,.2,1);
}
.section-card:hover,
.section-card:focus-visible {
  background: var(--tag-bg);
  border-color: var(--text-muted);
  transform: translateY(-2px);
  outline: none;
}
.section-card:hover .bar,
.section-card:focus-visible .bar { width: calc(100% + 2px); }

.section-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

.section-kicker {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--sec, var(--text-muted));
  opacity: 0.85;
}

.section-index {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.1em;
}

.section-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 30px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  margin-bottom: 10px;
}

.section-desc {
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--text-secondary);
  margin-bottom: 18px;
}

.section-foot {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border);
  padding-top: 12px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  transition: color 0.25s ease, border-color 0.25s ease;
}
.section-card:hover .section-foot { color: var(--text-secondary); }

.section-arrow {
  display: inline-block;
  transition: transform 0.25s cubic-bezier(.4,0,.2,1);
}
.section-card:hover .section-arrow { transform: translate(3px, -3px); }

@media (max-width: 1100px) {
  .sections { grid-template-columns: repeat(2, 1fr); }
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  header { padding: 20px 24px 16px; flex-wrap: wrap; align-items: center; gap: 8px; }
  .header-right { width: 100%; gap: 14px; }
  #site-count { display: none; }
  .hero { padding: 40px 24px 36px; }
  .hero h1 { font-size: 48px; }
  .hero-sub { max-width: 100%; }
  .grid-header { padding: 26px 24px 12px; }
  .grid-header::after { left: 24px; right: 24px; }
  #tag-filters { padding: 16px 24px 18px !important; }
  .search { margin-left: 0; width: 100%; }
  .search input, .search:focus-within input, .search.has-text input { width: 100%; flex: 1; }
  .grid { padding: 0 24px 60px; grid-template-columns: 1fr; }
  .sections { padding: 16px 24px 34px; grid-template-columns: 1fr; }
  .section-card { min-height: 0; padding: 22px 20px 18px; }
  .section-title { font-size: 26px; }
  footer { padding: 16px 24px; }
  .footer-right { gap: 14px; }
}

/* ── hidden "host" keyword easter egg ── */
#egg-toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--surface); border: 1px solid var(--border); color: var(--text-primary);
  font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.5px;
  padding: 10px 18px; border-radius: 4px; z-index: 9999;
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
  box-shadow: 0 12px 30px rgba(0,0,0,0.4);
}
#egg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#egg-toast .cursor { display: inline-block; width: 7px; height: 13px; background: var(--text-primary); margin-left: 2px; vertical-align: -1px; animation: egg-blink 0.9s steps(1) infinite; }
@keyframes egg-blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<div id="egg-toast"></div>

<header>
  <a href="index.html" class="logo">HOST<span>·</span>LAB</a>
  <div class="header-right">
    <a href="pages/archives.html" class="nav-link">ARCHIVES</a>
    <a href="pages/games.html" class="nav-link">GAMES</a>
    <a href="pages/study.html" class="nav-link">STUDY</a>
    <a href="pages/terminal.html" class="nav-link">TERMINAL</a>
    <div class="header-meta" id="site-count">— PROJECTS</div>
    <div class="theme-switch" id="theme-switch" title="Toggle light mode">
      <span class="switch-label" id="switch-label">LIGHT</span>
      <div class="switch-track"><div class="switch-thumb"></div></div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-label">Personal project hub</div>
  <h1>Host<em>Lab</em></h1>
  <p class="hero-sub">A collection of tools and experiments. Click any card to open the project.</p>
</section>

<div class="grid-header">
  <span class="grid-label">Sections</span>
</div>

<nav class="sections" id="sections-grid" aria-label="Sections"></nav>

<div class="grid-header">
  <span class="grid-label">All projects</span>
  <span class="count-badge" id="count-badge">0</span>
</div>

<div id="tag-filters" style="padding:20px 64px 24px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
  <div class="search">
    <svg width="11" height="11" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10.6 10.6L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input id="search-input" type="search" placeholder="search" aria-label="Search projects"
           autocomplete="off" spellcheck="false">
    <button class="search-clear" id="search-clear" type="button" aria-label="Clear search">&times;</button>
  </div>
</div>

<main class="grid" id="grid"></main>

<footer>
  <div class="footer-left">HOSTLAB</div>
  <div class="footer-right">
    <a class="footer-link" href="https://iwohost.github.io/hplaysite/index.html" target="_blank" rel="noopener"
       title="Hplay — an Android music player with a scroll wheel, by HostLabo"
       aria-label="Hplay, an Android music player with a scroll wheel — opens in a new tab">
      HPLAY
      <svg width="8" height="8" viewBox="0 0 12 12" fill="none" aria-hidden="true">
        <path d="M2.5 9.5L9.5 2.5M9.5 2.5H4M9.5 2.5V8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <span id="footer-date"></span>
  </div>
</footer>

<script>
/* ════════════════════════════════════════════
   EDIT THIS ARRAY TO ADD / REMOVE PROJECTS
   ════════════════════════════════════════════
   Each entry:
     file  — filename inside /websites/

function imgSrc(file) {
  return `other/p_${file.replace('.html','')}.png`;
}

function buildCard(project, index) {
  const { file, title, desc } = project;
  const num = String(index + 1).padStart(2, '0');

  const card = document.createElement('a');
  card.className = 'card';
  card.href = project.href || `websites/${file}`;
  if (project.external) { card.target = '_blank'; card.rel = 'noopener'; }
  if (project.topColor) card.style.borderTop = `2px solid ${project.topColor}`;

  const thumb = document.createElement('div');
  thumb.className = 'card-thumb';

  const img = document.createElement('img');
  img.alt = title;
  img.src = imgSrc(file);
  img.onerror = () => {
    thumb.innerHTML = `<div class="card-thumb-placeholder">NO PREVIEW</div>`;
  };
  thumb.appendChild(img);

  const body = document.createElement('div');
  body.className = 'card-body';

  const icon = project.icon || 'other/logo/HLab_Logo.png';

  const descText = desc
    ? `<p class="card-desc">${desc}</p>`
    : `<p class="card-desc" style="color:var(--text-muted);font-style:italic;font-size:12px;">No description found. Add one at other/d_${file.replace('.html','')}.txt</p>`;

  body.innerHTML = `
    <div class="card-meta">
      <div class="card-icon"><img src="${icon}" alt="${title} icon"></div>
      <div class="card-meta-text">
        <div class="card-index">${num}</div>
        <div class="card-title">${title}</div>
      </div>
    </div>
    ${descText}
    <div class="card-footer">
      <span class="card-filename">${file}</span>
      <span class="card-arrow">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M2.5 9.5L9.5 2.5M9.5 2.5H4M9.5 2.5V8" stroke="#0f0f0f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>
  `;

  card.appendChild(thumb);
  card.appendChild(body);
  return card;
}

let activeTag = 'all';
let query = '';

/* everything a project can be found by */
const haystack = p =>
  [p.title, p.desc, p.file, ...(p.tags || [])].join(' ').toLowerCase();

function applyFilters() {
  let list = activeTag === 'all' ? PROJECTS : PROJECTS.filter(p => p.tags && p.tags.includes(activeTag));
  if (query) {
    // every word has to appear somewhere, so "qr fun" narrows rather than widens
    const words = query.split(/\s+/).filter(Boolean);
    list = list.filter(p => { const h = haystack(p); return words.every(w => h.includes(w)); });
  }

  grid.innerHTML = '';
  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'no-match';
    empty.innerHTML = query
      ? `NOTHING MATCHES <b>${query.replace(/[<>&]/g, '')}</b>`
      : 'NOTHING HERE YET';
    grid.appendChild(empty);
  } else {
    list.forEach((p, i) => grid.appendChild(buildCard(p, i)));
  }

  CardMotion.measure();
  countBadge.textContent = list.length;
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.toggle('active', c.dataset.tag === activeTag));
}

function filterProjects(tag) {
  activeTag = tag;
  applyFilters();
}

function initSearch() {
  const box = document.querySelector('.search');
  const input = document.getElementById('search-input');
  const clear = document.getElementById('search-clear');

  const sync = () => {
    query = input.value.trim().toLowerCase();
    box.classList.toggle('has-text', input.value !== '');
    applyFilters();
  };

  input.addEventListener('input', sync);
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { input.value = ''; sync(); input.blur(); }
  });
  clear.addEventListener('click', () => { input.value = ''; sync(); input.focus(); });

  /* "/" jumps to the search box, the way it does most other places */
  addEventListener('keydown', e => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA') {
      e.preventDefault();
      input.focus();
    }
  });
}

function buildTagFilters() {
  const tags = ['all', ...new Set(PROJECTS.flatMap(p => p.tags || []))];
  const container = document.getElementById('tag-filters');
  const search = container.querySelector('.search');   // chips go before it
  tags.forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-chip' + (tag === 'all' ? ' active' : '');
    btn.dataset.tag = tag;
    btn.textContent = tag === 'all' ? 'All' : tag;
    btn.addEventListener('click', () => filterProjects(tag));
    container.insertBefore(btn, search);
  });
}

function buildSectionCard(section, index) {
  const { href, title, desc, topColor, kicker } = section;

  const card = document.createElement('a');
  card.className = 'section-card';
  card.href = href;
  if (topColor) card.style.setProperty('--sec', topColor);

  card.innerHTML = `
    <i class="bar"></i>
    <div class="section-top">
      <span class="section-kicker">${kicker || 'Section'}</span>
      <span class="section-index">${String(index + 1).padStart(2, '0')}</span>
    </div>
    <div class="section-title">${title}</div>
    <p class="section-desc">${desc}</p>
    <div class="section-foot">
      <span>Browse</span>
      <span class="section-arrow">&#8599;</span>
    </div>
  `;
  return card;
}

function init() {
  SECTIONS.forEach((section, i) => {
    sectionsGrid.appendChild(buildSectionCard(section, i));
  });
  PROJECTS.forEach((project, i) => {
    const card = buildCard(project, i);
    grid.appendChild(card);
  });
  buildTagFilters();
  initSearch();
  CardMotion.measure();
}

init();

/* type "host" anywhere on the page to find something */
(function () {
  const KEY = 'host';
  let buffer = '';
  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key.length !== 1) return;
    buffer = (buffer + e.key.toLowerCase()).slice(-KEY.length);
    if (buffer === KEY) {
      buffer = '';
      const toast = document.getElementById('egg-toast');
      toast.innerHTML = '&gt; access granted<span class="cursor"></span>';
      toast.classList.add('show');
      setTimeout(() => { window.location.href = 'websites/chronicle.html'; }, 850);
    }
  });
})();
