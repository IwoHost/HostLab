<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#06050a;font-family:'Share Tech Mono',monospace;}

:root{
  --red:#ff3c3c;
  --orange:#ff7c35;
  --gold:#ffd700;
  --silver:#c0c0c0;
  --bronze:#cd7f32;
  --green:#3dff8f;
  --dim:rgba(255,255,255,.18);
  --dimmer:rgba(255,255,255,.06);
}

/* scanlines */
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.07) 3px,rgba(0,0,0,.07) 4px);pointer-events:none;z-index:9000;}

/* ── NAV DOTS ── */
#dots{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:8000;max-width:90vw;flex-wrap:wrap;justify-content:center;}
.dot{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.15);transition:background .4s,width .3s;}
.dot.done{background:rgba(255,255,255,.5);}
.dot.active{background:#fff;width:30px;}

/* tap zones */
#tapL,#tapR{position:fixed;top:0;bottom:0;width:40%;z-index:7000;cursor:pointer;}
#tapL{left:0;}#tapR{right:0;}

/* nav hint */
#hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.2);z-index:8000;pointer-events:none;white-space:nowrap;animation:blink 2.5s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.3;}50%{opacity:.9;};}

/* ── SLIDES ── */
#stage{position:fixed;inset:0;}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .05s;}
.slide.current{opacity:1;pointer-events:all;}

/* ── TRANSITIONS ── */
.slide-in-right{animation:slideInRight .5s cubic-bezier(.16,1,.3,1) forwards;}
.slide-in-left {animation:slideInLeft  .5s cubic-bezier(.16,1,.3,1) forwards;}
.slide-out-left {animation:slideOutLeft  .4s cubic-bezier(.4,0,1,1) forwards;}
.slide-out-right{animation:slideOutRight .4s cubic-bezier(.4,0,1,1) forwards;}
@keyframes slideInRight {from{transform:translateX(60px);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes slideInLeft  {from{transform:translateX(-60px);opacity:0;}to{transform:translateX(0);opacity:1;}}
@keyframes slideOutLeft {from{transform:translateX(0);opacity:1;}to{transform:translateX(-60px);opacity:0;}}
@keyframes slideOutRight{from{transform:translateX(0);opacity:1;}to{transform:translateX(60px);opacity:0;}}

/* ── SHARED TEXT COMPONENTS ── */
.tag{font-size:10px;letter-spacing:6px;color:var(--dim);margin-bottom:16px;text-align:center;}
.big{font-family:'Bebas Neue',sans-serif;font-size:clamp(100px,20vw,240px);line-height:.85;text-align:center;transform:scale(.55);opacity:0;transition:transform 1.1s cubic-bezier(.16,1,.3,1),opacity .5s;}
.big.in{transform:scale(1);opacity:1;}
.reveal{overflow:hidden;}
.reveal span{display:block;transform:translateY(110%);transition:transform .9s cubic-bezier(.16,1,.3,1);}
.reveal.in span{transform:translateY(0);}

/* ── SLIDE 0 — INTRO ── */
.s0{background:radial-gradient(ellipse at 50% 55%,#120810 0%,#06050a 70%);}
.s0-target{font-size:clamp(100px,25vw,280px);animation:targetPulse 2.5s ease-in-out infinite;user-select:none;display:block;margin-bottom:-20px;}
@keyframes targetPulse{0%,100%{transform:scale(1) rotate(-3deg);}50%{transform:scale(1.07) rotate(3deg);}}
.s0-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,7vw,80px);letter-spacing:8px;text-align:center;line-height:1;margin-bottom:12px;}
.s0-sub{font-size:11px;letter-spacing:5px;color:var(--dim);text-align:center;margin-bottom:32px;}
.s0-btn{border:1px solid rgba(255,255,255,.2);padding:14px 36px;font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:5px;color:rgba(255,255,255,.5);background:none;cursor:pointer;transition:color .2s,border-color .2s;text-transform:uppercase;}
.s0-btn:hover{color:#fff;border-color:rgba(255,255,255,.6);}
.s0-ring{position:absolute;border-radius:50%;border:1px solid rgba(255,60,60,.08);left:50%;top:50%;pointer-events:none;}
.s0-ring:nth-child(1){width:400px;height:400px;margin:-200px 0 0 -200px;animation:rpulse 3s ease-in-out infinite;}
.s0-ring:nth-child(2){width:640px;height:640px;margin:-320px 0 0 -320px;animation:rpulse 3s ease-in-out infinite .5s;}
.s0-ring:nth-child(3){width:900px;height:900px;margin:-450px 0 0 -450px;animation:rpulse 3s ease-in-out infinite 1s;}
@keyframes rpulse{0%,100%{opacity:.6;transform:scale(1);}50%{opacity:.15;transform:scale(1.05);}}

/* ── SLIDE 1 — COUNT ── */
.s1{background:radial-gradient(ellipse at 50% 60%,#050a14 0%,#06050a 75%);}
.s1-num{font-family:'Bebas Neue',sans-serif;font-size:clamp(120px,24vw,280px);line-height:.8;background:linear-gradient(180deg,#fff 40%,rgba(255,255,255,.2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;transform:scale(.5);opacity:0;transition:transform 1.2s cubic-bezier(.16,1,.3,1),opacity .6s;}
.s1-num.in{transform:scale(1);opacity:1;}

/* ── SLIDE 2 — MVP ── */

.mvp-crown{font-size:clamp(60px,10vw,100px);display:block;text-align:center;margin-bottom:4px;animation:crown 3s ease-in-out infinite;}
@keyframes crown{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-14px) rotate(5deg);}}
.mvp-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(72px,15vw,180px);letter-spacing:4px;background:linear-gradient(160deg,var(--gold) 30%,#fff 60%,var(--gold) 90%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;transform:scale(.5) translateY(30px);opacity:0;transition:transform 1.3s cubic-bezier(.16,1,.3,1),opacity .6s;}
.mvp-name.in{transform:scale(1) translateY(0);opacity:1;}
.mvp-score{font-family:'Bebas Neue',sans-serif;font-size:clamp(80px,16vw,200px);color:var(--gold);opacity:.15;line-height:.85;position:absolute;bottom:-10px;right:5vw;pointer-events:none;}
.mvp-stat{font-size:clamp(12px,1.8vw,15px);letter-spacing:3px;color:rgba(255,215,0,.5);margin-top:20px;text-align:center;}
.mvp-roast{font-size:clamp(11px,1.6vw,14px);letter-spacing:1px;color:rgba(255,255,255,.3);margin-top:12px;max-width:500px;text-align:center;line-height:1.7;}

/* ── SLIDE 3 — PLAYER CARD ── */
.pc{background:#06050a;overflow:hidden;}
.pc-bg{position:absolute;inset:0;opacity:.25;}
.pc-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:0;width:100%;padding:0 24px;}
.pc-place{font-family:'Bebas Neue',sans-serif;font-size:clamp(120px,30vw,360px);position:absolute;right:-2vw;top:50%;transform:translateY(-50%);opacity:.04;line-height:1;pointer-events:none;}
.pc-rank{font-size:10px;letter-spacing:6px;color:var(--dim);margin-bottom:10px;}
.pc-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(60px,12vw,140px);letter-spacing:4px;line-height:.9;text-align:center;transform:translateY(20px);opacity:0;transition:transform .9s cubic-bezier(.16,1,.3,1),opacity .5s;}
.pc-name.in{transform:translateY(0);opacity:1;}
.pc-bday{display:inline-block;font-size:10px;letter-spacing:4px;padding:3px 10px;border:1px solid rgba(255,215,0,.4);color:rgba(255,215,0,.7);margin-bottom:8px;animation:bdaypulse 2s ease-in-out infinite;}
@keyframes bdaypulse{0%,100%{opacity:.7;}50%{opacity:1;}}

.pc-score-row{display:flex;align-items:baseline;gap:10px;margin-top:14px;}
.pc-score{font-family:'Bebas Neue',sans-serif;font-size:clamp(50px,10vw,110px);line-height:.9;}
.pc-score-lbl{font-size:10px;letter-spacing:4px;color:var(--dim);align-self:flex-end;padding-bottom:10px;}

.pc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;width:min(480px,88vw);margin-top:18px;}
.pc-stat{background:rgba(255,255,255,.03);padding:12px 14px;display:flex;flex-direction:column;gap:3px;transform:translateY(12px);opacity:0;transition:transform .6s cubic-bezier(.16,1,.3,1),opacity .4s;}
.pc-stat.in{transform:translateY(0);opacity:1;}
.pc-stat-label{font-size:8px;letter-spacing:3px;color:rgba(255,255,255,.2);text-transform:uppercase;}
.pc-stat-val{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1;}
.pc-bar{height:2px;background:rgba(255,255,255,.06);border-radius:1px;overflow:hidden;margin-top:4px;}
.pc-bar-fill{height:100%;border-radius:1px;width:0%;transition:width .8s cubic-bezier(.4,0,.2,1) .2s;}

.pc-roast{font-size:clamp(10px,1.5vw,13px);letter-spacing:1px;color:rgba(255,255,255,.28);max-width:min(500px,88vw);text-align:center;line-height:1.7;margin-top:14px;padding:12px 16px;border-left:2px solid rgba(255,255,255,.08);}

/* ── SLIDE — WEAPON KING ── */
.wk{background:radial-gradient(ellipse at 50% 50%,#0a0614 0%,#06050a 75%);}
.wk-icon{font-size:80px;display:block;text-align:center;animation:weaponspin 4s ease-in-out infinite;}
@keyframes weaponspin{0%,100%{transform:rotate(-8deg) scale(1);}50%{transform:rotate(8deg) scale(1.1);}}

/* ── SLIDE — BILANS ── */
.bl{background:radial-gradient(ellipse at 50% 50%,#021208 0%,#06050a 75%);}
.bl-list{display:flex;flex-direction:column;gap:4px;width:min(480px,88vw);}
.bl-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.03);transform:translateX(-20px);opacity:0;transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .4s;}
.bl-row.in{transform:translateX(0);opacity:1;}
.bl-row-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;flex:1;}
.bl-row-bar{flex:2;height:4px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;}
.bl-row-fill{height:100%;border-radius:2px;width:0%;transition:width .7s cubic-bezier(.4,0,.2,1);}
.bl-row-val{font-family:'Bebas Neue',sans-serif;font-size:20px;min-width:60px;text-align:right;}

/* ── SLIDE — PODIUM ── */
.pd{background:radial-gradient(ellipse at 50% 80%,#141008 0%,#06050a 70%);}
.pd-wrap{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-top:24px;}
.pd-col{display:flex;flex-direction:column;align-items:center;gap:8px;width:clamp(90px,16vw,150px);}
.pd-name{font-size:clamp(9px,1.3vw,12px);letter-spacing:2px;text-align:center;opacity:0;transition:opacity .5s;}
.pd-name.in{opacity:1;}
.pd-val{font-family:'Bebas Neue',sans-serif;font-size:clamp(22px,4vw,40px);opacity:0;transition:opacity .5s;}
.pd-val.in{opacity:1;}
.pd-block{width:100%;border-radius:3px 3px 0 0;border-top:2px solid;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,4vw,38px);height:0;transition:height 1.1s cubic-bezier(.34,1.4,.64,1);}
.r1{background:linear-gradient(180deg,rgba(255,215,0,.22),rgba(255,215,0,.02));border-color:var(--gold);color:var(--gold);}
.r2{background:linear-gradient(180deg,rgba(192,192,192,.16),rgba(192,192,192,.02));border-color:var(--silver);color:var(--silver);}
.r3{background:linear-gradient(180deg,rgba(205,127,50,.16),rgba(205,127,50,.02));border-color:var(--bronze);color:var(--bronze);}

/* ── SLIDE — HBD ── */
.hbd{background:radial-gradient(ellipse at 50% 55%,#120620 0%,#06050a 70%);}
.hbd-cake{font-size:clamp(80px,14vw,140px);display:block;text-align:center;animation:cakedance 1.5s ease-in-out infinite;}
@keyframes cakedance{0%,100%{transform:rotate(-4deg) scale(1);}50%{transform:rotate(4deg) scale(1.1);}}
.hbd-name{font-family:'Bebas Neue',sans-serif;font-size:clamp(60px,13vw,160px);letter-spacing:6px;line-height:.9;text-align:center;background:linear-gradient(160deg,#ff8fe8,#c084fc,#ff8fe8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hbd-sub{font-size:clamp(10px,1.5vw,13px);letter-spacing:5px;color:rgba(255,180,230,.3);text-align:center;margin-top:16px;line-height:2;}

/* ── CONFETTI ── */
.cf{position:fixed;width:8px;height:8px;top:-10px;border-radius:1px;animation:cffall linear forwards;pointer-events:none;z-index:8500;}
@keyframes cffall{0%{transform:translateY(0) rotate(0deg);opacity:1;}85%{opacity:1;}100%{transform:translateY(110vh) rotate(720deg);opacity:0;}}

/* ── PARTICLE CANVAS ── */
#pCanvas{position:fixed;inset:0;pointer-events:none;z-index:8100;}

/* ── PROGRESS BAR ── */
#progress{position:fixed;bottom:0;left:0;height:2px;background:rgba(255,255,255,.2);z-index:8000;transition:width .4s ease;}
</style>
</head>

const byScore   = [...PLAYERS].sort((a,b) => b.wynik   - a.wynik);
const byBilans  = [...PLAYERS].sort((a,b) => b.bilans  - a.bilans);
const totalUZI  = PLAYERS.reduce((s,p) => s + p.uzi, 0);
const maxBilans = Math.max(...PLAYERS.map(p => Math.abs(p.bilans)));
const maxWynik  = Math.max(...PLAYERS.map(p => p.wynik));
const maxTrafil = Math.max(...PLAYERS.map(p => p.trafil));

/* ═══════════════════════════════════════
   SLIDE DEFINITIONS
═══════════════════════════════════════ */
function slideIntro() {
  return /*html*/`
    <div class="slide s0" id="s-intro">
      <div class="s0-ring"></div><div class="s0-ring"></div><div class="s0-ring"></div>

      <div class="s0-title">STRZELNICA<br>KSAWEGO</div>

}

function slideCount() {
  return /*html*/`
    <div class="slide s1" id="s-count">
      <div class="tag">ŁĄCZNIE WYSTRZELONO</div>
      <div class="s1-num" id="cnt-num">${Math.round(totalUZI).toLocaleString('pl-PL')}</div>

}

function slideMVP() {
  const p = byScore[0];
  return /*html*/`
    <div class="slide s2" id="s-mvp">
      <div class="mvp-score">${p.wynik}</div>
      <span class="mvp-crown">🏆</span>
      <div class="tag">ZWYCIĘZCA</div>
      <div class="mvp-name" id="mvp-name">${p.name.toUpperCase()}</div>
      <div class="mvp-stat">WYNIK ${p.wynik} · BILANS +${p.bilans} · UZI ${p.uzi.toLocaleString('pl-PL')}</div>
      <div class="mvp-roast">${p.roast}</div>
    </div>`;
}

function slidePlayer(p, rank) {
  const medals = ['🥇','🥈','🥉'];
  const medal  = medals[rank] || '';
  const isBday = p.birthday;

}

/* ═══════════════════════════════════════
   BUILD SLIDES ARRAY
═══════════════════════════════════════ */
const SLIDES_HTML = [
  slideIntro(),
  slideCount(),
  slideMVP(),
  ...byScore.map((p, i) => slidePlayer(p, i)),
  slideWeaponKing(),
  slideBilans(),
  slidePodium(),
  slideHBD(),
];

const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
SLIDES_HTML.forEach((html, i) => {
  stage.insertAdjacentHTML('beforeend', html);
  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.addEventListener('click', e => { e.stopPropagation(); goTo(i); });
  dotsEl.appendChild(dot);
});

const slides = stage.querySelectorAll('.slide');
const dotEls = dotsEl.querySelectorAll('.dot');
let current  = 0;
let animating = false;

/* ═══════════════════════════════════════
   PARTICLE CANVAS
═══════════════════════════════════════ */
const canvas = document.getElementById('pCanvas');
const ctx    = canvas.getContext('2d');
let particles = [];

function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function spawnParticles(x, y, color, count=6) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 2,
      alpha: 1, size: 2 + Math.random()*3, color, decay: .02 + Math.random()*.02 });
  }
}

function loopCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.alpha > 0);
  for (const p of particles) {
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
    p.x += p.vx; p.y += p.vy; p.vy += .08; p.alpha -= p.decay;
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loopCanvas);
}
loopCanvas();

/* ═══════════════════════════════════════
   CONFETTI
═══════════════════════════════════════ */
function confetti(n=60) {
  const cols = ['#ffd700','#f0d060','#c084fc','#ff8fe8','#3dff8f','#50c8ff','#ffffff'];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'cf';
    el.style.cssText = `left:${Math.random()*100}vw;background:${cols[i%cols.length]};width:${4+Math.random()*8}px;height:${4+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.5+Math.random()*2.5}s;animation-delay:${Math.random()*.8}s;`;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

/* ═══════════════════════════════════════
   SLIDE ENTRY ANIMATIONS
═══════════════════════════════════════ */
function onEnter(idx) {
  const s = slides[idx];

  /* count slide */
  const cn = s.querySelector('.s1-num');
  if (cn) { cn.classList.add('in'); }

  /* MVP */
  const mn = s.querySelector('.mvp-name');
  if (mn) setTimeout(() => { mn.classList.add('in'); confetti(40); }, 200);

  /* player card */
  const pcn = s.querySelector('.pc-name');
  if (pcn) {
    setTimeout(() => pcn.classList.add('in'), 100);
    s.querySelectorAll('.pc-stat').forEach((el,i) => setTimeout(() => {
      el.classList.add('in');
      el.querySelectorAll('.pc-bar-fill').forEach(b => { b.style.width = b.dataset.pct + '%'; });
    }, 250 + i*80));
  }

  /* bilans list */
  s.querySelectorAll('.bl-row').forEach((row, i) => {
    setTimeout(() => {
      row.classList.add('in');
      row.querySelectorAll('.bl-row-fill').forEach(b => { b.style.width = b.dataset.pct + '%'; });
    }, i * 80);
  });

  /* podium */
  const heights = [180, 130, 100];
  [1,0,2].forEach((rank, col) => {
    const block = document.getElementById(`pdb-${rank}`);
    const name  = document.getElementById(`pdn-${rank}`);
    const val   = document.getElementById(`pdv-${rank}`);
    if (!block) return;
    setTimeout(() => {
      block.style.height = heights[rank] + 'px';
      if (name) name.classList.add('in');
      if (val)  val.classList.add('in');
    }, col * 180);
    if (rank === 0) setTimeout(() => confetti(50), 500);
  });

  /* HBD */
  if (s.classList.contains('hbd')) confetti(80);
}

/* ═══════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════ */
function updateDots(idx) {
  dotEls.forEach((d,i) => {
    d.className = 'dot' + (i < idx ? ' done' : i === idx ? ' active' : '');
  });
  document.getElementById('progress').style.width = ((idx / (slides.length-1)) * 100) + '%';
}

function goTo(idx, dir = 1) {
  if (animating || idx === current || idx < 0 || idx >= slides.length) return;
  animating = true;

  const outCls = dir > 0 ? 'slide-out-left'  : 'slide-out-right';
  const inCls  = dir > 0 ? 'slide-in-right'  : 'slide-in-left';

  const prev = slides[current];
  const next = slides[idx];

  prev.classList.add(outCls);
  prev.addEventListener('animationend', () => {
    prev.classList.remove('current', outCls);
  }, { once: true });

  next.classList.add('current', inCls);
  next.addEventListener('animationend', () => {
    next.classList.remove(inCls);
    current = idx;
    animating = false;
    onEnter(idx);
    spawnParticles(innerWidth/2, innerHeight/2, '#ffffff', 4);
  }, { once: true });

  updateDots(idx);
}

function next() { goTo(current + 1, 1); }
function prev() { goTo(current - 1, -1); }

document.getElementById('tapR').addEventListener('click', next);
document.getElementById('tapL').addEventListener('click', prev);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') next();
  if (e.key === 'ArrowLeft')  prev();
});

/* swipe */
let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive:true });
document.addEventListener('touchend',   e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 40) dx < 0 ? next() : prev();
}, { passive:true });

/* click to advance (excluding back-home button) */
document.addEventListener('click', e => {
  if (e.target.closest('.back-home') || e.target.closest('.s0-btn') || e.target.closest('#dots')) return;
  if (e.clientX > innerWidth * 0.4) next(); else prev();
});

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
slides[0].classList.add('current');
updateDots(0);
</script>
</body>
