<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HostLab · Study</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=Syne+Mono&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="../other/logo/HLab_Logo.png">
<link rel="stylesheet" href="../other/backbutton.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0c0c0c;--surface:#141414;--text-primary:#f0f0ee;
  --text-secondary:#888884;--text-muted:#3a3a38;
  --border:#222220;--accent:#f0f0ee;--tag-bg:#1a1a18;
  --font-display:'Syne',sans-serif;--font-mono:'Syne Mono',monospace;
  --switch-track:#2a2a28;--switch-thumb:#555550;
}
html.light{
  --bg:#f5f4f0;--surface:#ffffff;--text-primary:#0f0f0f;
  --text-secondary:#6b6b6b;--text-muted:#b0b0b0;
  --border:#e8e6e0;--accent:#0f0f0f;--tag-bg:#efefeb;
  --switch-track:#d0ceca;--switch-thumb:#888884;
}
html,body,header,footer,.card,.card-thumb,.card-body,.card-footer{transition:background .35s ease,color .35s ease,border-color .35s ease}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text-primary);font-family:var(--font-display);min-height:100vh;-webkit-font-smoothing:antialiased}

header{padding:48px 64px 0;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:24px}
.logo{font-family:var(--font-mono);font-size:13px;letter-spacing:.12em;color:var(--text-primary);text-decoration:none}
.logo span{color:var(--text-muted)}
.header-right{display:flex;align-items:center;gap:24px}
.header-meta{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:.08em}

.hero{padding:72px 64px 56px;border-bottom:1px solid var(--border)}
.hero-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--text-muted);text-transform:uppercase;margin-bottom:16px}
.hero h1{font-size:clamp(44px,6vw,72px);font-weight:700;letter-spacing:-.03em;line-height:.95;color:var(--text-primary)}
.hero h1 em{font-style:normal;color:var(--text-muted)}
.hero-sub{margin-top:22px;font-size:14px;color:var(--text-secondary);max-width:440px;line-height:1.6}

.grid-header{padding:32px 64px 16px;display:flex;align-items:center;justify-content:space-between}
.grid-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--text-muted);text-transform:uppercase}
.count-badge{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);background:var(--tag-bg);padding:4px 10px;border-radius:100px}

.grid{padding:0 64px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2px}

.card{background:var(--surface);border:1px solid var(--border);overflow:hidden;cursor:pointer;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease;animation:fadeUp .5s ease both}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
html.light .card:hover{box-shadow:0 12px 40px rgba(0,0,0,.08)}
.card:nth-child(1){animation-delay:.05s}.card:nth-child(2){animation-delay:.1s}.card:nth-child(3){animation-delay:.15s}.card:nth-child(4){animation-delay:.2s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.card-thumb{width:100%;aspect-ratio:16/9;background:var(--tag-bg);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.card-thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);letter-spacing:.1em;background:repeating-linear-gradient(45deg,var(--tag-bg) 0px,var(--tag-bg) 8px,var(--border) 8px,var(--border) 9px)}
.card-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.card:hover .card-thumb img{transform:scale(1.04)}
.card-thumb-text{font-family:var(--font-mono);font-size:clamp(18px,3vw,32px);color:var(--border);letter-spacing:.05em;user-select:none}
.card:hover .card-thumb-text{color:var(--text-muted);transition:color .3s}

.card-body{padding:18px 22px 20px;flex:1;display:flex;flex-direction:column;gap:10px}
.card-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-title-block{display:flex;flex-direction:column;gap:4px}
.card-num{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.1em}
.card-title{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--text-primary);line-height:1.2}
.card-badge{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;padding:3px 8px;border-radius:3px;white-space:nowrap;flex-shrink:0;border:1px solid var(--border);color:var(--text-muted);background:var(--tag-bg)}
.card-desc{font-size:13px;color:var(--text-secondary);line-height:1.55;flex:1}
.card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border)}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--text-muted);background:var(--tag-bg);padding:3px 7px;border-radius:2px;text-transform:uppercase}
.card-arrow{width:28px;height:28px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,border-color .2s}
.card:hover .card-arrow{background:var(--accent);border-color:var(--accent)}
.card-arrow svg path{stroke:var(--text-primary)}
.card:hover .card-arrow svg path{stroke:var(--bg)}

footer{border-top:1px solid var(--border);padding:24px 64px;display:flex;align-items:center;justify-content:space-between}
.footer-left,.footer-right{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.1em}

.nav-link{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--text-muted);text-decoration:none;transition:color .2s}
.nav-link:hover{color:var(--text-secondary)}
.theme-switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch-label{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase}
.switch-track{width:36px;height:20px;background:var(--switch-track);border-radius:100px;border:1px solid var(--border);position:relative;flex-shrink:0;transition:background .35s ease}
.switch-thumb{position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--switch-thumb);transition:transform .3s ease,background .35s ease}
html.light .switch-thumb{transform:translateX(16px);background:#0f0f0f}
html.light .switch-track{background:#d0ceca}

@media(max-width:768px){
  header{padding:20px 24px 16px;flex-wrap:wrap;align-items:center;gap:8px}
  .header-right{width:100%;gap:14px}
  #site-count{display:none}
  .hero{padding:40px 24px 36px}
  .hero h1{font-size:40px}
  .hero-sub{max-width:100%}
  .grid-header{padding:20px 24px 14px}
  .grid{padding:0 24px 60px;grid-template-columns:1fr}
  footer{padding:16px 24px}
}
</style>
</head>
<body>

<header>
  <a href="../index.html" class="logo">HOST<span>·</span>LAB<span style="color:var(--text-secondary);padding-left:2px"> / STUDY</span></a>
  <div class="header-right">
    <a href="archives.html" class="nav-link">ARCHIVES</a>
    <a href="games.html" class="nav-link">GAMES</a>
    <a href="terminal.html" class="nav-link">TERMINAL</a>
    <div class="header-meta" id="site-count"></div>
    <div class="theme-switch" id="theme-switch" title="Toggle light mode">
      <span class="switch-label" id="switch-label">LIGHT</span>
      <div class="switch-track"><div class="switch-thumb"></div></div>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-label">Learn by doing</div>
  <h1>Stu<em>dy</em></h1>
  <p class="hero-sub">Interactive courses — write real code, run it, see results. No passive reading, just hands-on practice.</p>
</section>

<div class="grid-header">
  <span class="grid-label">Courses</span>
  <span class="count-badge" id="count-badge">0</span>
</div>

<main class="grid" id="grid"></main>

<footer>
  <div class="footer-left">HOSTLAB · STUDY</div>
  <div class="footer-right" id="footer-date"></div>
</footer>

<script>
const TOOLS=[
  {url:'../websites/bash-learn.html',title:'Linux Bash',badge:'LINUX',tags:['bash','linux','shell'],
   desc:'18 lessons across 2 chapters — Basics (variables, if, loops, functions) + Practice (mkdir, date, whoami, redirects). Built-in editor with a live terminal.'},
  {url:'../websites/batch-learn.html',title:'Batch Scripting',badge:'CMD',tags:['batch','.bat','cmd','windows'],
   desc:'18 lessons across 2 chapters — Basics (set, if, for, goto, call) + Practice (md, date /t, hostname, redirects). Built-in editor with a live terminal.'},
];
function imgSrc(url){return'../other/p_'+url.split('/').pop().replace('.html','')+'.png'}

document.getElementById('footer-date').textContent=new Date().toLocaleDateString('en-GB',{year:'numeric',month:'long',day:'numeric'}).toUpperCase();
document.getElementById('count-badge').textContent=TOOLS.length;
document.getElementById('site-count').textContent=TOOLS.length+' COURSES';

const ts=document.getElementById('theme-switch');
const sl=document.getElementById('switch-label');
ts.addEventListener('click',()=>{
  const isLight=document.documentElement.classList.toggle('light');
  sl.textContent=isLight?'DARK':'LIGHT';
  localStorage.setItem('hostlab-theme',isLight?'light':'dark');
});
if(localStorage.getItem('hostlab-theme')==='light'){document.documentElement.classList.add('light');sl.textContent='DARK'}

const grid=document.getElementById('grid');
TOOLS.forEach((t,i)=>{
  const card=document.createElement('a');
  card.className='card';card.href=t.url;
  const tagHTML=(t.tags||[]).map(tg=>`<span class="tag">${tg}</span>`).join('');
  card.innerHTML=`
    <div class="card-thumb"></div>
    <div class="card-body">
      <div class="card-header-row">
        <div class="card-title-block">
          <div class="card-num">${String(i+1).padStart(2,'0')}</div>
          <div class="card-title">${t.title}</div>
        </div>
        <span class="card-badge">${t.badge}</span>
      </div>
      <p class="card-desc">${t.desc}</p>
      <div class="card-footer">
        <div class="card-tags">${tagHTML}</div>
        <span class="card-arrow"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 9.5L9.5 2.5M9.5 2.5H4M9.5 2.5V8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
    </div>
  `;
  const thumb=card.querySelector('.card-thumb');
  const img=document.createElement('img');img.src=imgSrc(t.url);img.alt=t.title;
  img.onerror=()=>{thumb.innerHTML='<div class="card-thumb-placeholder">NO PREVIEW</div>'};
  thumb.appendChild(img);
  grid.appendChild(card);
});
</script>
</body>
</html>
